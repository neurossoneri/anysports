media:
  input: media
  output: media
  rename: safe
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
  - avif
content:
- name: posts
  label: Статьи / Articles
  type: collection
  path: content/posts
  format: yaml-frontmatter
  filename: '{lang}-{slug}.md'
  view:
    fields:
    - title
    - lang
    - published
    - date
    primary: title
    sort:
    - date
    - title
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Заголовок / Title
    type: string
    required: true
  - name: slug
    label: URL slug (latin letters / digits / hyphens)
    type: string
    required: true
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  - name: lang
    label: Язык / Language
    type: select
    required: true
    options:
      values:
      - name: ru
        label: Русский
      - name: en
        label: English
      - name: fr
        label: Français
  - name: published
    label: Опубликовано / Published
    type: boolean
  - name: date
    label: Дата / Date
    type: date
    required: true
  - name: category
    label: Категория / Category
    type: string
  - name: summary
    label: Анонс / Summary
    type: text
    required: true
  - name: cover
    label: Обложка / Cover
    type: image
  - name: body
    label: Текст статьи / Article body
    type: rich-text
    required: true
    options:
      format: markdown
      switcher: true
- name: site
  label: Контакты, фото, имя / Site settings
  type: file
  path: content/site.json
  format: json
  operations:
    delete: false
  fields:
  - name: name_ru
    label: Имя (RU)
    type: string
  - name: name_en
    label: Name (EN)
    type: string
  - name: name_fr
    label: Nom (FR)
    type: string
  - name: role_ru
    label: Специализация (RU)
    type: string
  - name: role_en
    label: Professional role (EN)
    type: string
  - name: role_fr
    label: Spécialité (FR)
    type: string
  - name: email
    label: Email
    type: string
  - name: whatsapp
    label: WhatsApp (digits, international prefix)
    type: string
  - name: telegram
    label: Telegram (@ without symbol)
    type: string
  - name: booking_url
    label: Booking URL (https://...)
    type: string
  - name: form_endpoint
    label: Адрес формы связи / Contact form endpoint (https://...)
    description: Адрес из сервиса форм (например Formspree), который пересылает сообщения на вашу почту. Подробности в README.
    type: string
  - name: public_url
    label: Public site URL (optional, https://...)
    type: string
  - name: portrait
    label: Главное фото (широкий кадр, на нём лежит первая цитата)
    type: image
  - name: eyes_photo
    label: Фото крупным планом («посмотрите на фотографию»)
    type: image
  - name: quote_photo
    label: Атмосферное фото за цитатой А (необязательно; если пусто — мягкий цвет)
    type: image
  - name: story_photo_1
    label: История · кадр 1 (спорт с детства и FIFA)
    type: image
  - name: story_photo_2
    label: История · кадр 2 («хватит» — смена пути)
    type: image
  - name: story_photo_3
    label: История · кадр 3 (поиск)
    type: image
  - name: story_photo_4
    label: История · кадр 4 (доверие к себе)
    type: image
  - name: publish_ready
    label: Готов к индексации / Allow search indexing
    description: Activate only after replacing all placeholders with verified details and obtaining permissions for photos.
    type: boolean
