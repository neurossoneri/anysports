media:
  input: media
  output: media
  rename: safe
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
  - avif
content:
- name: posts
  label: Статьи / Articles
  type: collection
  path: content/posts
  format: yaml-frontmatter
  filename: '{lang}-{slug}.md'
  view:
    fields:
    - title
    - lang
    - published
    - date
    primary: title
    sort:
    - date
    - title
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Заголовок / Title
    type: string
    required: true
  - name: slug
    label: URL slug (latin letters / digits / hyphens)
    type: string
    required: true
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  - name: lang
    label: Язык / Language
    type: select
    required: true
    options:
      values:
      - name: en
        label: English
  - name: published
    label: Опубликовано / Published
    type: boolean
  - name: date
    label: Дата / Date
    type: date
    required: true
  - name: category
    label: Категория / Category
    type: string
  - name: summary
    label: Анонс / Summary
    type: text
    required: true
  - name: cover
    label: Обложка / Cover
    type: image
  - name: body
    label: Текст статьи / Article body
    type: rich-text
    required: true
    options:
      format: markdown
      switcher: true
- name: site
  label: Контакты, фото, имя / Site settings
  type: file
  path: content/site.json
  format: json
  operations:
    delete: false
  fields:
  - name: brand
    label: Название сайта (бренд)
    description: Показывается в шапке, во вкладке браузера, в подвале и в превью ссылок. Не переводится.
    type: string
  - name: name_en
    label: Имя (как на сайте)
    type: string
  - name: role_en
    label: Специализация (как на сайте)
    type: string
  - name: email
    label: Email
    type: string
  - name: whatsapp
    label: WhatsApp (digits, international prefix)
    type: string
  - name: telegram
    label: Telegram (@ without symbol)
    type: string
  - name: form_endpoint
    label: Адрес формы связи / Contact form endpoint (https://...)
    description: Адрес из сервиса форм (например Formspree), который пересылает сообщения на вашу почту. Подробности в README.
    type: string
  - name: inbox_endpoint
    label: Адрес приёма заявок (Google Apps Script, https://script.google.com/...)
    description: Заполняется в панели /admin/ на вкладке «Заявки». Сообщения из формы на сайте попадают в вашу Google-таблицу.
    type: string
  - name: public_url
    label: Public site URL (optional, https://...)
    type: string
  - name: privacy_address
    label: Адрес для политики конфиденциальности (улица, индекс, город, Швейцария)
    description: 'Показывается в разделе «Who is responsible» на странице privacy/. Можно оставить пустым: тогда указываются имя и email.'
    type: string
  - name: portrait
    label: Фото 1 · Главное фото (первый экран, левая половина; вертикальный кадр, например половина лица)
    type: image
  - name: quote_photo
    label: Фото 2 · место выбирается в блоке «Фото» раздела страницы (лучше править в /admin/)
    type: image
  - name: eyes_photo
    label: Фото 3 · место выбирается в блоке «Фото» раздела страницы (лучше править в /admin/)
    type: image
  - name: story_photo_1
    label: Фото 4 · место выбирается в блоке «Фото» раздела страницы (лучше править в /admin/)
    type: image
  - name: story_photo_2
    label: Фото 5 · место выбирается в блоке «Фото» раздела страницы (лучше править в /admin/)
    type: image
  - name: story_photo_3
    label: Фото 6 · место выбирается в блоке «Фото» раздела страницы (лучше править в /admin/)
    type: image
  - name: story_photo_4
    label: Фото 7 · место выбирается в блоке «Фото» раздела страницы (лучше править в /admin/)
    type: image
  - name: publish_ready
    label: Готов к индексации / Allow search indexing
    description: Activate only after replacing all placeholders with verified details and obtaining permissions for photos.
    type: boolean
- name: privacy
  label: Политика конфиденциальности / Privacy notice
  type: file
  path: content/privacy.md
  format: yaml-frontmatter
  operations:
    delete: false
  fields:
  - name: title
    label: Заголовок / Title
    type: string
    required: true
  - name: description
    label: Описание / Description
    type: text
  - name: updated
    label: Дата обновления / Last updated
    type: date
    required: true
  - name: body
    label: Текст / Text (метки {{controller}}, {{form_service}}, {{updated}} подставляются сами)
    type: rich-text
    required: true
    options:
      format: markdown
      switcher: true
- name: sections
  label: 'Страница: разделы и блоки (порядок, цитаты, фото; удобнее в /admin/)'
  type: file
  path: content/sections.json
  format: json
  operations:
    delete: false
  fields:
  - name: sections
    label: Разделы (порядок = порядок на сайте)
    type: object
    list: true
    fields:
    - name: id
      label: Служебное имя раздела (не меняйте)
      type: string
    - name: type
      label: Вид раздела
      type: select
      options:
        values:
        - value: text
          label: Текстовый
        - value: contact
          label: Контакты и форма
        - value: qa
          label: Вопросы и ответы
    - name: title
      label: Заголовок раздела
      type: string
    - name: layout
      label: Расположение
      type: select
      options:
        values:
        - value: rail-right
          label: Текст слева, боковая колонка справа
        - value: rail-left
          label: Боковая колонка слева, текст справа
        - value: column
          label: Одна колонка у левого края
        - value: centered
          label: Одна колонка по центру (как предисловие)
    - name: blocks
      label: Блоки (порядок = порядок в разделе)
      type: object
      list: true
      fields:
      - name: type
        label: Тип блока
        type: select
        options:
          values:
          - value: text
            label: Текст
          - value: quote
            label: Цитата
          - value: aside
            label: Фраза
          - value: photos
            label: Фото
          - value: themes
            label: Список тем со значками
      - name: heading
        label: Подзаголовок (необязательно)
        type: string
      - name: body
        label: Текст
        type: text
      - name: note
        label: Мелкая приписка под текстом (необязательно)
        type: text
      - name: look
        label: Оформление (у Фразы quiet — тихая, hand — рукописью, panel — на плашке)
        type: select
        options:
          values:
          - value: quiet
            label: Фраза · тихая
          - value: closing
            label: Фраза · заключительная
          - value: plain
            label: Обычный текст (с подзаголовком выглядит как раздел, без него как абзац)
          - value: lead
            label: Крупная вводная фраза
          - value: panel
            label: Тёмная плашка (можно с фото за текстом)
          - value: dropcap
            label: Обычный текст, первая буква крупно
          - value: finale
            label: Итоговая фраза по центру
          - value: hand
            label: Рукописная фраза без плашки
      - name: text
        label: Цитата
        type: text
      - name: size
        label: Размер
        type: select
        options:
          values:
          - value: auto
            label: Автоматически (длинные фразы мельче)
          - value: large
            label: Крупно
          - value: small
            label: Помельче
      - name: photo
        label: Фото за фразой (необязательно) (номер 2–7 или файл media/…; удобнее выбирать в панели)
        type: string
      - name: s1
        label: Первое фото (номер 2–7 или файл media/…; удобнее выбирать в панели)
        type: string
      - name: s2
        label: Второе фото (необязательно) (номер 2–7 или файл media/…; удобнее выбирать в панели)
        type: string
      - name: s3
        label: Третье фото (необязательно) (номер 2–7 или файл media/…; удобнее выбирать в панели)
        type: string
      - name: place
        label: Где показать
        type: select
        options:
          values:
          - value: inline
            label: В тексте
          - value: side
            label: Сбоку, в боковой колонке
      - name: caption
        label: Подпись под фото (необязательно)
        type: string
      - name: alt
        label: Описание фото для скринридеров (необязательно)
        type: string
      - name: comp
        label: Композиция фото
        type: select
        options:
          values:
          - value: auto
            label: Как раньше, ряд из 1–3 фото
          - value: single
            label: Одно фото
          - value: wide
            label: Одно широкое фото
          - value: calm-pair
            label: Спокойная пара, большое и малое
          - value: lead-small
            label: Крупное и малое, асимметрия
          - value: trio
            label: Три фото, крупное и два малых
      - name: zoom
        label: Открывать фото крупнее по нажатию
        type: select
        options:
          values:
          - value: ''
            label: Нет
          - value: yes
            label: Да
      - name: f1
        label: Кадрирование 1 (x,y,масштаб; задаётся в панели)
        type: string
      - name: f2
        label: Кадрирование 2 (x,y,масштаб; задаётся в панели)
        type: string
      - name: f3
        label: Кадрирование 3 (x,y,масштаб; задаётся в панели)
        type: string
      - name: title
        label: Заголовок
        type: string
      - name: intro
        label: Вступление
        type: text
      - name: t1
        label: Тема 1 · фраза
        type: string
      - name: d1
        label: Тема 1 · пояснение
        type: text
      - name: t2
        label: Тема 2 · фраза
        type: string
      - name: d2
        label: Тема 2 · пояснение
        type: text
      - name: t3
        label: Тема 3 · фраза
        type: string
      - name: d3
        label: Тема 3 · пояснение
        type: text
      - name: t4
        label: Тема 4 · фраза
        type: string
      - name: d4
        label: Тема 4 · пояснение
        type: text
      - name: t5
        label: Тема 5 · фраза
        type: string
      - name: d5
        label: Тема 5 · пояснение
        type: text
      - name: t6
        label: Тема 6 · фраза
        type: string
      - name: d6
        label: Тема 6 · пояснение
        type: text
      - name: finalTitle
        label: Итоговая фраза · заголовок (по центру, крупно)
        type: string
      - name: finalText
        label: Итоговая фраза · текст (по центру)
        type: text
- name: home_en
  label: Тексты сайта (English)
  type: file
  path: content/home_en.json
  format: json
  operations:
    delete: false
  fields:
  - name: meta
    label: Вкладка браузера и поиск
    type: object
    fields:
    - name: title
      label: Название страницы (« — Sport Intuitive» добавится само)
      type: string
    - name: description
      label: Описание для поисковиков и соцсетей
      type: text
  - name: hero
    label: 'Главный экран: цитата на главном фото (всегда первый)'
    type: object
    fields:
    - name: alt
      label: Описание фото для скринридеров
      type: string
    - name: quote1
      label: Цитата, строка 1 (это заголовок страницы)
      type: text
    - name: quote2
      label: Цитата, строка 2 (меньше, рядом)
      type: text
  - name: contact
    label: Контакты и форма (раздел страницы, его место меняется в /admin/)
    type: object
    fields:
    - name: title
      label: Заголовок
      type: string
    - name: lead
      label: Текст под заголовком
      type: text
    - name: formName
      label: Поле «имя»
      type: string
    - name: formReach
      label: Поле «как связаться»
      type: string
    - name: formMessage
      label: Поле «сообщение» (приглашение написать)
      type: string
    - name: formSend
      label: Кнопка отправки
      type: string
    - name: formSent
      label: Сообщение после успешной отправки
      type: text
    - name: formNote
      label: Согласие под формой (после текста сама добавляется ссылка «privacy notice»)
      type: text
  - name: qa
    label: Q&A (раздел страницы; пустой вопрос скрывает слот)
    type: object
    fields:
    - name: title
      label: Заголовок
      type: string
    - name: lead
      label: Текст под заголовком
      type: text
    - name: ask
      label: Ссылка под текстом (ведёт к форме контактов)
      type: string
    - name: g1
      label: Подпись группы 1 (над вопросами 1–4)
      type: string
      description: Оставьте пустым, чтобы убрать подпись.
    - name: q1
      label: Вопрос 1
      type: string
      description: Оставьте пустым, чтобы скрыть этот вопрос.
    - name: a1
      label: Ответ 1
      type: text
    - name: q2
      label: Вопрос 2
      type: string
      description: Оставьте пустым, чтобы скрыть этот вопрос.
    - name: a2
      label: Ответ 2
      type: text
    - name: q3
      label: Вопрос 3
      type: string
      description: Оставьте пустым, чтобы скрыть этот вопрос.
    - name: a3
      label: Ответ 3
      type: text
    - name: q4
      label: Вопрос 4
      type: string
      description: Оставьте пустым, чтобы скрыть этот вопрос.
    - name: a4
      label: Ответ 4
      type: text
    - name: g2
      label: Подпись группы 2 (над вопросами 5–6)
      type: string
      description: Оставьте пустым, чтобы убрать подпись.
    - name: q5
      label: Вопрос 5
      type: string
      description: Оставьте пустым, чтобы скрыть этот вопрос.
    - name: a5
      label: Ответ 5
      type: text
    - name: q6
      label: Вопрос 6
      type: string
      description: Оставьте пустым, чтобы скрыть этот вопрос.
    - name: a6
      label: Ответ 6
      type: text
    - name: g3
      label: Подпись группы 3 (над вопросами 7–8)
      type: string
      description: Оставьте пустым, чтобы убрать подпись.
    - name: q7
      label: Вопрос 7
      type: string
      description: Оставьте пустым, чтобы скрыть этот вопрос.
    - name: a7
      label: Ответ 7
      type: text
    - name: q8
      label: Вопрос 8
      type: string
      description: Оставьте пустым, чтобы скрыть этот вопрос.
    - name: a8
      label: Ответ 8
      type: text
  - name: free
    label: 'Q&A: блок «вводная беседа бесплатно» (под вопросами)'
    type: object
    fields:
    - name: title
      label: Заголовок
      type: string
    - name: text
      label: Текст
      type: text
    - name: cta
      label: Кнопка (ведёт к форме «Write to me»)
      type: string
  - name: notes
    label: Заметки (раздел виден, только если есть опубликованные статьи)
    type: object
    fields:
    - name: title
      label: Заголовок
      type: string
    - name: lead
      label: Текст под заголовком
      type: text
  - name: footer
    label: Подвал
    type: object
    fields:
    - name: line
      label: Короткая фраза
      type: string
    - name: privacy
      label: Строка о приватности
      type: text
