  <style>
    /* ===== Cold redesign: dark and light bands, square edges, blue and green accents ===== */
    /* ---------- Tokens ---------- */
    :root {
      --serif:"Source Serif 4",Georgia,"Palatino Linotype",serif;
      --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      --hand:"Caveat","Segoe Script","Bradley Hand","Comic Sans MS",cursive;
      --ease:cubic-bezier(.16,1,.3,1);
      /* Cold palette. Deep tones open the page; sand and dune are the soft light bands. */
      --abyss:#06121e; --deep:#08192a; --teal:#0c2a3d; --sand:#e5dac4; --dune:#dccfb4; --blend:clamp(112px,14vw,216px);
      --blue:#2f6fb3; --blue-hi:#8dbdf0; --green:#1f8a74; --green-hi:#6fd2b8;
      /* Shared with article pages */
      --bg:#e5dac4; --bg-soft:#ddd1ba; --paper:#efe6d3; --paper-alt:#e8dec9;
      --text:#10243a; --text-muted:#46607a; --blue-deep:#1f5f9e; --mint-strong:#1f7a67;
      --border:rgba(16,36,58,.16); --shadow-strong:0 30px 70px -44px rgba(6,18,30,.55);
      --glass:rgba(247,241,228,.6); --focus:#2f6fb3;
      --header-muted:#a3b9cc;
      /* admin-crm-update: soft controls that hover above the page */
      --r-pill:999px; --r-soft:14px;
      --float:0 1px 0 rgba(255,255,255,.3) inset,0 14px 28px -16px rgba(6,18,30,.55),0 4px 10px -5px rgba(6,18,30,.28);
      --float-hi:0 1px 0 rgba(255,255,255,.4) inset,0 22px 36px -16px rgba(6,18,30,.6),0 8px 16px -8px rgba(6,18,30,.3);
    }
    :root[data-theme="dark"] {
      color-scheme:dark;
      --bg:#0a1a2a; --bg-soft:#0e2336; --paper:#10283c; --paper-alt:#133049;
      --text:#e8f0f7; --text-muted:#a9bdd0; --blue-deep:#8dbdf0; --mint-strong:#6fd2b8;
      --border:rgba(160,196,230,.22); --shadow-strong:0 30px 70px -44px rgba(0,6,16,.85);
      --glass:rgba(16,40,60,.62); --focus:#8dbdf0;
    }

    /* ---------- Bands: the section background carries the colours ---------- */
    /* Light bands are warm sand, never white or cool grey: easier on the eyes after a dark band. */
    .band { position:relative; isolation:isolate; padding:calc(var(--blend) + clamp(12px,2vw,36px)) 0 clamp(56px,7vw,104px); color:var(--c-text); background:var(--c-bg); }
    .band > .container, .band > .hero-grid { position:relative; z-index:1; }
    .band-deep { --c-bg:var(--deep); --c-text:#e8f0f7; --c-muted:#a6bccf; --c-line:rgba(141,189,240,.24); --c-a:var(--blue-hi); --c-b:var(--green-hi); --c-panel:rgba(141,189,240,.07); --focus:#8dbdf0; color-scheme:dark;
      background:radial-gradient(70% 90% at 100% 0%,rgba(47,111,179,.22),transparent 62%),radial-gradient(60% 70% at 0% 100%,rgba(31,138,116,.14),transparent 64%),var(--deep); }
    .band-teal { --c-bg:var(--teal); --c-text:#e8f0f7; --c-muted:#a6bccf; --c-line:rgba(141,189,240,.26); --c-a:var(--blue-hi); --c-b:var(--green-hi); --c-panel:rgba(141,189,240,.08); --focus:#8dbdf0; color-scheme:dark;
      background:radial-gradient(60% 80% at 0% 0%,rgba(31,138,116,.22),transparent 62%),radial-gradient(60% 80% at 100% 100%,rgba(47,111,179,.2),transparent 64%),var(--teal); }
    .band-sand { --c-bg:var(--sand); --c-text:#10243a; --c-muted:#3d5870; --c-line:rgba(16,36,58,.2); --c-a:#245f9c; --c-b:#1f7a67; --c-panel:rgba(36,95,156,.07); }
    .band-dune { --c-bg:var(--dune); --c-text:#10243a; --c-muted:#3d5870; --c-line:rgba(16,36,58,.22); --c-a:#1b5a96; --c-b:#1b7060; --c-panel:rgba(255,246,228,.4); }

    /* ---------- Soft transitions: each band opens as the previous colour and melts into its own ---------- */
    /* Dark into warm sand: the gradients are drawn in OKLab and lean slightly warm in the middle, so the transition never passes through a cold grey or white. */
    .band::before, .site-footer::before { content:""; position:absolute; inset:0 0 auto 0; height:var(--blend); z-index:0; pointer-events:none; }
    .site-footer::before { height:calc(var(--blend) * .7); }
    .band::after { content:""; position:absolute; inset:auto 0 0 0; height:calc(var(--blend) * .6); z-index:0; pointer-events:none; background:linear-gradient(180deg,transparent,var(--c-bg)); }   /* ends on the plain colour, so the next band can start from it */
    main > .band:first-child::before { content:none; }
    .band-deep + .band-sand::before { background:linear-gradient(180deg,rgb(8,25,42) 0%,rgb(15,28,42) 8%,rgb(28,37,46) 17%,rgb(46,50,55) 25%,rgb(68,68,67) 33%,rgb(94,89,81) 42%,rgb(121,112,99) 50%,rgb(149,137,118) 58%,rgb(176,160,138) 67%,rgb(199,182,157) 75%,rgb(217,200,174) 83%,rgb(227,213,188) 92%,rgb(229,218,196) 100%); }
    .band-sand + .band-teal::before { background:linear-gradient(180deg,rgb(229,218,196) 0%,rgb(228,213,188) 8%,rgb(218,202,176) 17%,rgb(201,186,161) 25%,rgb(179,166,144) 33%,rgb(154,145,126) 42%,rgb(127,123,110) 50%,rgb(101,102,95) 58%,rgb(76,82,81) 67%,rgb(53,66,71) 75%,rgba(35,53,64,0.741) 83%,rgba(21,45,60,0.259) 92%,rgba(12,42,61,0.000) 100%); }
    .band-teal + .band-dune::before { background:linear-gradient(180deg,rgb(12,42,61) 0%,rgb(21,45,60) 8%,rgb(35,53,63) 17%,rgb(52,65,69) 25%,rgb(74,80,78) 33%,rgb(98,98,89) 42%,rgb(123,118,102) 50%,rgb(149,138,117) 58%,rgb(173,159,132) 67%,rgb(194,177,147) 75%,rgb(209,192,161) 83%,rgb(219,203,172) 92%,rgb(220,207,180) 100%); }
    .band-dune + .band-deep::before { background:linear-gradient(180deg,rgb(220,207,180) 0%,rgb(219,202,172) 8%,rgb(208,190,159) 17%,rgb(192,173,144) 25%,rgb(169,153,126) 33%,rgb(144,130,109) 42%,rgb(117,107,92) 50%,rgb(91,85,76) 58%,rgb(66,66,63) 67%,rgb(45,49,53) 75%,rgba(27,36,45,0.741) 83%,rgba(15,28,41,0.259) 92%,rgba(8,25,42,0.000) 100%); }
    .band-teal + .band-sand::before { background:linear-gradient(180deg,rgb(12,42,61) 0%,rgb(21,45,60) 8%,rgb(35,53,64) 17%,rgb(53,66,71) 25%,rgb(76,82,81) 33%,rgb(101,102,95) 42%,rgb(127,123,110) 50%,rgb(154,145,126) 58%,rgb(179,166,144) 67%,rgb(201,186,161) 75%,rgb(218,202,176) 83%,rgb(228,213,188) 92%,rgb(229,218,196) 100%); }
    .site-footer.after-sand::before { background:linear-gradient(180deg,rgb(229,218,196) 0%,rgb(227,213,187) 8%,rgb(216,200,173) 17%,rgb(198,181,154) 25%,rgb(174,158,133) 33%,rgb(147,133,112) 42%,rgb(119,107,91) 50%,rgb(90,83,72) 58%,rgb(64,61,56) 67%,rgb(42,43,44) 75%,rgb(24,30,35) 83%,rgb(12,21,30) 92%,rgb(6,18,30) 100%); }
    .site-footer.after-teal::before { background:linear-gradient(180deg,rgb(12,42,61) 0%,rgb(12,42,60) 8%,rgb(12,40,59) 17%,rgb(11,38,56) 25%,rgb(10,36,53) 33%,rgb(10,33,49) 42%,rgb(9,30,45) 50%,rgb(8,27,41) 58%,rgb(7,24,38) 67%,rgb(7,22,35) 75%,rgb(6,20,32) 83%,rgb(6,18,31) 92%,rgb(6,18,30) 100%); }


    /* ---------- Base ---------- */
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; scroll-padding-top:0; }
    body { margin:0; min-width:320px; color:var(--text); background:var(--bg); font-family:var(--sans); line-height:1.65; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
    main { overflow-x:clip; }
    main:focus { outline:none; }
    figure { margin:0; }
    img { display:block; width:100%; height:100%; object-fit:cover; }
    button, input, select, textarea { font:inherit; color:inherit; border-radius:0; }
    button { cursor:pointer; }
    a { color:inherit; text-decoration:none; }
    :where(a,button,select,input,textarea,summary):focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    h1,h2,h3 { text-wrap:balance; margin:0; }
    p { text-wrap:pretty; margin:0; white-space:pre-line; }
    ::selection { background:rgba(111,180,240,.4); }
    [hidden] { display:none!important; }
    .sr-only { position:absolute!important; width:1px!important; height:1px!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; }
    .skip { position:fixed; top:-90px; left:15px; z-index:1000; background:#fff; color:#10243a; padding:12px 20px; border-radius:var(--r-pill); }
    .skip:focus { top:15px; }
    .container { width:min(1200px,calc(100% - 48px)); margin-inline:auto; }
    .title { font:500 clamp(2rem,4.2vw,3.4rem)/1.12 var(--serif); letter-spacing:-.025em; margin:0 0 clamp(20px,3vw,32px); color:var(--c-text); }
    .lead { font-size:clamp(1.03rem,1.35vw,1.15rem); line-height:1.85; color:var(--c-muted); max-width:58ch; }
    .lead + .lead { margin-top:1.2em; }
    .split { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(32px,6vw,96px); align-items:start; }
    .sticky { position:sticky; top:32px; }

    /* ---------- Buttons and fields ---------- */
    .button { display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:13px 32px; border:1px solid var(--border); border-radius:var(--r-pill); background:var(--glass); color:var(--text); font-weight:650; font-size:.95rem; letter-spacing:.005em; text-align:center; box-shadow:var(--float); transition:transform .5s var(--ease),box-shadow .5s var(--ease),background-color .3s,border-color .3s,filter .3s; }
    .button:hover { transform:translateY(-3px); box-shadow:var(--float-hi); }
    .button:active { transform:translateY(-1px) scale(.985); transition-duration:.12s; }
    .button:disabled { opacity:.6; cursor:progress; transform:none; box-shadow:var(--float); }
    .button-primary { border-color:transparent; color:#fff; background:linear-gradient(110deg,#2b66ab,#2a8f86 60%,#2f9a7e); box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 18px 32px -16px rgba(31,138,116,.8),0 6px 14px -6px rgba(43,102,171,.55); }
    .button-primary:hover { filter:brightness(1.07); box-shadow:0 1px 0 rgba(255,255,255,.36) inset,0 26px 40px -16px rgba(31,138,116,.85),0 10px 18px -8px rgba(43,102,171,.6); }
    .button-outline { background:var(--glass); }
    .icon-button { display:grid; place-items:center; width:38px; height:38px; border:1px solid rgba(141,189,240,.32); border-radius:50%; background:rgba(141,189,240,.08); color:#e8f0f7; flex:none; font-size:1rem; line-height:1; box-shadow:0 8px 18px -10px rgba(0,0,0,.6); }

    /* ---------- Header: a flat dark bar, no name, no pill ---------- */
    .site-header { position:sticky; top:0; z-index:90; background:var(--abyss); color:#e8f0f7; border-bottom:1px solid rgba(141,189,240,.16); }
    .header-inner { display:flex; align-items:center; gap:14px; min-height:56px; }
    .site-header .header-inner { width:min(1200px,calc(100% - 48px)); margin-inline:auto; }
    .brand { display:flex; align-items:center; gap:11px; margin-right:auto; font-weight:700; letter-spacing:-.02em; font-size:.95rem; line-height:1.15; max-width:260px; }
    .brand-name { font-family:var(--serif); font-size:1.12rem; font-weight:600; letter-spacing:.01em; white-space:nowrap; }
    .brand-mark { flex:none; display:grid; place-items:center; width:32px; height:32px; overflow:hidden; background:#dce8f8; }
    .brand-mark svg { width:100%; height:100%; }

    /* ---------- Photographs: square frames, cold grading ---------- */
    .photo { position:relative; overflow:hidden; isolation:isolate; background:linear-gradient(135deg,#0f3148,#1b4d63 55%,#1d5f5b); }
    .photo > img { position:absolute; inset:0; opacity:0; transition:opacity 1.2s var(--ease); }
    .photo.has-photo > img { opacity:1; }
    .photo.has-photo .ph { display:none; }
    .slot-badge { position:absolute; left:12px; top:12px; z-index:30; padding:8px 15px; border-radius:var(--r-pill); background:#ffd23f; color:#111; font:800 .95rem/1 Inter,system-ui,sans-serif; letter-spacing:.02em; box-shadow:0 10px 22px -8px rgba(0,0,0,.55); pointer-events:none; }
    .plate .slot-badge { left:50%; top:26%; transform:translateX(-50%); white-space:nowrap; }   /* the story photos have feathered edges: keep the number in the clear middle */
    .show-slots .photo { outline:3px dashed #ffd23f; outline-offset:-3px; }
    .ph { position:absolute; inset:0; display:grid; place-content:center; justify-items:center; gap:10px; padding:24px; text-align:center; color:var(--blue-hi); font-size:.82rem; font-weight:600; opacity:.85; }
    .ph svg { width:48px; height:48px; opacity:.7; }
    /* A place that is still empty on the live site is removed together with its frame. It is never filled with another photograph. */
    .hero-grid:has(> .hero-photo[hidden]) { grid-template-columns:minmax(0,1fr); }
    .sessions .split:has(.side-pair > .eyes[hidden]) { grid-template-columns:minmax(0,1fr); }
    .side-pair:has(> .eyes[hidden]) { display:none; }

    /* ---------- 1. Hero: a vertical photograph on the left half, the quotation on the right half (phones included) ---------- */
    .hero { padding:0; }
    .hero-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); min-height:min(100svh,900px); }
    .hero-photo { min-height:100%; animation:heroIn 1.8s var(--ease) both; -webkit-mask-image:linear-gradient(180deg,#000 78%,transparent); mask-image:linear-gradient(180deg,#000 78%,transparent); }   /* the lower edge dissolves into the page */
    .hero-photo > img { object-position:88% 42%; }   /* the face sits at the right edge of the picture: keep it in view on narrow screens */
    .hero-quote { align-self:center; padding:clamp(40px,6vw,96px) max(24px,calc((100vw - 1200px) / 2)) clamp(40px,6vw,96px) clamp(24px,4vw,72px); }
    .hero-quote::before { content:""; display:block; width:64px; height:3px; margin-bottom:clamp(24px,3vw,40px); background:linear-gradient(90deg,var(--blue-hi),var(--green-hi)); }
    .hero-q1 { font:500 clamp(2.2rem,4vw,4rem)/1.08 var(--serif); letter-spacing:-.03em; animation:riseIn 1.6s var(--ease) .5s both; }
    .hero-q2 { margin-top:clamp(22px,3vw,36px); max-width:24em; font:italic 400 clamp(1.05rem,1.5vw,1.3rem)/1.6 var(--serif); color:var(--c-muted); animation:riseIn 1.6s var(--ease) 1.1s both; }

    /* ---------- 2. Introduction ---------- */
    .intro .split { grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); align-items:stretch; }
    .intro .title { font-size:clamp(1.8rem,3.4vw,2.8rem); max-width:19em; }
    .intro-body > p + p { margin-top:1.1em; }
    .intro-body .mid { font:400 clamp(1.08rem,1.4vw,1.2rem)/1.8 var(--serif); color:var(--c-text); max-width:56ch; }
    /* Highlighted phrase: the same format in every block (italic serif, accent colour, line on the left) */
    .pull { margin:clamp(26px,4vw,44px) 0; padding-left:22px; border-left:3px solid var(--c-b); font:italic 500 clamp(1.4rem,2.4vw,2rem)/1.35 var(--serif); color:var(--c-a); max-width:20em; }
    .pull-long { font-size:clamp(1.2rem,1.9vw,1.55rem); line-height:1.5; max-width:26em; }
    .pull:empty { display:none; }

    /* ---------- Quotations: handwritten, on a cold panel ---------- */
    .quote-panel { position:relative; isolation:isolate; display:grid; align-content:end; min-height:clamp(360px,44vw,640px); padding:clamp(28px,4vw,52px); color:#fff; overflow:hidden; background:linear-gradient(150deg,#0b2c44,#0f4a5b 60%,#14604f); }
    .quote-panel .quote-bg { position:absolute; inset:0; z-index:-2; }
    .quote-panel::before { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg,rgba(6,18,30,.05),rgba(6,18,30,.72)); }
    .quote-text { margin:0; font:500 clamp(2rem,3.6vw,3.2rem)/1.2 var(--hand); color:var(--c-a); text-wrap:balance; }
    .quote-panel .quote-text { color:#fff; text-shadow:0 2px 22px rgba(4,14,24,.55); }
    .quote-stroke { display:block; width:min(220px,60%); height:16px; margin-top:clamp(16px,2.4vw,26px); overflow:visible; }
    .quote-stroke path { fill:none; stroke:var(--c-b); stroke-width:2.2; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; transition:stroke-dashoffset 2.4s var(--ease) var(--stroke-delay,1.2s); }
    .quote-panel .quote-stroke path { stroke:var(--green-hi); }
    .is-written + .quote-stroke path { stroke-dashoffset:0; }
    .quote-inline { margin-top:clamp(32px,4vw,52px); padding-top:clamp(20px,3vw,32px); border-top:1px solid var(--c-line); }

    /* ---------- Handwriting: text is written in real time ---------- */
    .js [data-write]:not(.is-split) { visibility:hidden; }
    .w { display:inline-block; white-space:nowrap; }
    .js .ch { display:inline-block; opacity:0; transform:translateY(.22em) rotate(-3deg); transition:opacity .7s var(--ease),transform .9s var(--ease); transition-delay:calc(var(--i) * var(--step,45ms)); }
    .js .is-written .ch { opacity:1; transform:none; }
    .js [data-fade] { opacity:0; transition:opacity 1.4s ease var(--d,0s); }
    .js [data-fade].in { opacity:1; }

    /* ---------- 3. Intuitive sessions ---------- */
    .sessions .split { grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr); }
    .eyes { aspect-ratio:4/5; width:100%; }
    .eyes > img { object-position:84% 36%; }
    .sessions-lead { margin-bottom:clamp(36px,5vw,64px); max-width:24em; font:400 clamp(1.4rem,2.6vw,2.1rem)/1.35 var(--serif); letter-spacing:-.01em; color:var(--c-text); }
    .s-block { padding:clamp(22px,3vw,34px) 0; border-top:1px solid var(--c-line); }
    .s-block h3 { font:500 clamp(1.25rem,2vw,1.6rem)/1.25 var(--serif); margin-bottom:10px; color:var(--c-text); }
    .s-block p { color:var(--c-muted); line-height:1.85; max-width:60ch; }
    .s-honest { margin-top:clamp(18px,3vw,32px); padding:clamp(24px,3.4vw,40px); background:var(--c-panel); border-left:3px solid var(--c-b); display:grid; gap:14px; }
    .s-honest h3 { font:500 clamp(1.25rem,2vw,1.6rem)/1.25 var(--serif); }
    .s-honest p { color:var(--c-muted); line-height:1.8; }
    .s-honest .s-note { font-size:.92rem; color:var(--c-text); }

    /* What we can explore: seven symbols */
    .themes { margin-top:clamp(64px,9vw,120px); padding-top:clamp(36px,5vw,56px); border-top:1px solid var(--c-line); }
    .themes-title { font:500 clamp(1.5rem,2.8vw,2.2rem)/1.2 var(--serif); letter-spacing:-.02em; margin-bottom:14px; }
    .theme-grid { list-style:none; margin:clamp(28px,4vw,48px) 0 0; padding:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; }
    .theme { padding:clamp(22px,3vw,34px) clamp(18px,2.4vw,30px) clamp(22px,3vw,34px) 0; border-top:1px solid var(--c-line); }
    .theme:nth-child(3n+2), .theme:nth-child(3n+3) { padding-left:clamp(18px,2.4vw,30px); border-left:1px solid var(--c-line); }
    .glyph { display:block; width:36px; height:36px; margin-bottom:16px; fill:none; stroke:var(--c-a); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
    .theme strong { display:block; font:500 clamp(1.15rem,1.7vw,1.4rem)/1.25 var(--serif); }
    .theme span { display:block; margin-top:8px; max-width:40ch; color:var(--c-muted); font-size:.98rem; line-height:1.7; }
    /* Closing statements: centred, revealed slowly, drawing the eye */
    .finale { position:relative; isolation:isolate; max-width:46rem; margin:clamp(56px,8vw,112px) auto 0; padding:clamp(32px,5vw,64px) clamp(8px,3vw,32px); text-align:center; }
    .finale::before { content:""; position:absolute; inset:-18% -14%; z-index:-1; background:radial-gradient(closest-side,rgba(141,189,240,.16),transparent 72%); opacity:0; transition:opacity 2.8s ease .2s; }
    .finale.in::before { opacity:1; }
    .finale > * { transition:opacity 1.8s var(--ease),transform 2s var(--ease); }
    .finale > :nth-child(1) { transition-delay:.1s; } .finale > :nth-child(2) { transition-delay:.5s; } .finale > :nth-child(3) { transition-delay:.9s; } .finale > :nth-child(4) { transition-delay:1.5s; }
    .js .finale:not(.in) > :not(.finale-note):not(.quote-stroke) { opacity:0; transform:translateY(22px); }
    .js .finale:not(.in) > .finale-line { transform:scaleX(0); opacity:1; }
    .finale-line { display:block; width:72px; height:3px; margin:0 auto clamp(22px,3vw,34px); background:linear-gradient(90deg,var(--c-a),var(--c-b)); }
    .finale .glyph { margin:0 auto 18px; width:40px; height:40px; }
    .finale h3 { margin:0 0 clamp(14px,2vw,24px); font:500 clamp(2rem,4.4vw,3.4rem)/1.12 var(--serif); letter-spacing:-.025em; color:var(--c-text); }
    @supports ((-webkit-background-clip:text) or (background-clip:text)) {
      .finale h3 { color:transparent; -webkit-background-clip:text; background-clip:text; background-image:linear-gradient(95deg,var(--c-a) 0%,var(--c-b) 30%,var(--c-text) 50%,var(--c-b) 70%,var(--c-a) 100%); background-size:240% 100%; background-position:0 0; }
      .finale.in h3 { animation:sheen 3.4s ease-out 1.3s both; }      /* one slow sweep of light over the heading, then it rests */
    }
    .finale p { margin:0 auto; max-width:28em; font:italic 400 clamp(1.25rem,2.1vw,1.7rem)/1.55 var(--serif); color:var(--c-text); }
    .finale-hand .finale-note { margin:0 auto; font:500 clamp(2.1rem,5vw,3.8rem)/1.2 var(--hand); color:var(--c-b); text-wrap:balance; }
    .finale-hand .quote-stroke { margin:clamp(16px,2.4vw,26px) auto 0; }


    /* ---------- 4. Transformation ---------- */
    .change .split { grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr); }
    .change .title { max-width:9em; }
    .mm { display:block; width:min(100%,400px); height:auto; overflow:visible; margin:clamp(8px,2vw,24px) 0 0; will-change:transform; }
    .mm .s1, .mm .s2, .mm .s3 { opacity:0; }
    .mm .s1 { animation:mm1 16s ease-in-out infinite; }
    .mm .s2 { animation:mm2 16s ease-in-out infinite; }
    .mm .s3 { animation:mm3 16s ease-in-out infinite; transform-origin:180px 130px; }
    .mm .sway { transform-origin:180px 30px; animation:sway 6s ease-in-out infinite alternate; }
    .mm .wing { transform-origin:180px 125px; animation:flap 3.4s ease-in-out infinite; }
    .scene { padding:clamp(26px,3.6vw,44px) 0; border-top:1px solid var(--c-line); }
    .scene:first-child { padding-top:0; border-top:0; }
    .scene h3 { margin-bottom:14px; font:500 clamp(1.45rem,2.6vw,2.1rem)/1.18 var(--serif); letter-spacing:-.02em; color:var(--c-text); }
    .scene p { color:var(--c-muted); line-height:1.9; font-size:clamp(1.02rem,1.3vw,1.12rem); max-width:62ch; }
    .scene p + p { margin-top:1em; }
    .scene .pull { margin:clamp(18px,3vw,32px) 0; color:var(--c-a); font:italic 500 clamp(1.35rem,2.2vw,1.8rem)/1.4 var(--serif); max-width:22em; }
    .scene .pull-long { font-size:clamp(1.15rem,1.8vw,1.45rem); line-height:1.5; max-width:26em; }

    /* ---------- 5. My story: a preface, one soft column ---------- */
    .preface-head { max-width:46rem; margin:0 auto clamp(32px,5vw,60px); text-align:center; }
    .preface-head .title { margin-bottom:18px; }
    .about-lead { margin:0 auto; max-width:24em; font:italic 400 clamp(1.25rem,2.1vw,1.7rem)/1.45 var(--serif); color:var(--c-a); }
    .preface-body { display:flow-root; max-width:46rem; margin:0 auto; }
    .chap { margin:0 0 1.6em; max-width:none; font:400 clamp(1.08rem,1.45vw,1.22rem)/1.95 var(--serif); color:var(--c-text); }
    .chap.dropcap::first-letter { float:left; padding:.07em .1em 0 0; font:500 3.7em/.82 var(--serif); color:var(--c-a); }
    .plate { clear:both; width:min(46%,320px); aspect-ratio:4/5; margin:clamp(8px,2vw,24px) 0 clamp(36px,5vw,64px); -webkit-mask-image:radial-gradient(ellipse 55% 54% at 50% 48%,#000 48%,transparent 100%); mask-image:radial-gradient(ellipse 55% 54% at 50% 48%,#000 48%,transparent 100%); }   /* soft, feathered edges instead of a hard frame */
    .plate-r { margin-left:auto; margin-right:-6%; }
    .plate-l { margin-right:auto; margin-left:-6%; }
    .plate img { object-position:50% 30%; }
    .preface-body .pull { margin:clamp(4px,1vw,12px) 0 clamp(26px,4vw,42px); }

    /* ---------- 6. Contact ---------- */
    .contact .split { grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr); }
    .contact-links { display:grid; gap:10px; margin-top:clamp(24px,4vw,40px); max-width:380px; }
    .contact-links a { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:15px 24px; border:1px solid var(--c-line); border-radius:var(--r-pill); background:rgba(255,255,255,.34); box-shadow:var(--float); font-weight:650; font-size:.93rem; transition:transform .5s var(--ease),box-shadow .5s var(--ease),background-color .3s,border-color .3s; }
    .contact-links a::after { content:"\2192"; color:var(--c-a); transition:transform .5s var(--ease); }
    .contact-links a:hover { transform:translateY(-3px); background:rgba(255,255,255,.5); border-color:var(--c-a); box-shadow:var(--float-hi); }
    .contact-links a:hover::after { transform:translateX(5px); }
    .field { display:block; margin-bottom:16px; }
    .field span { display:block; margin:0 0 8px; font-size:.86rem; color:var(--c-muted); }
    .field input, .field textarea { width:100%; padding:14px 18px; border:1px solid var(--c-line); border-radius:var(--r-soft); background:#f4ecda; color:#10243a; box-shadow:0 12px 24px -18px rgba(16,36,58,.55); }
    .field input:focus, .field textarea:focus { border-color:var(--c-a); }
    .field textarea { min-height:140px; resize:vertical; }
    .field input[aria-invalid="true"] { border-color:#b64c56; box-shadow:0 0 0 3px rgba(182,76,86,.18); }
    .hp { position:absolute!important; left:-9999px!important; width:1px; height:1px; opacity:0; }
    .form-status { min-height:1.6em; margin-top:12px; font-size:.92rem; color:var(--c-muted); }
    .form-status.is-error { color:#b64c56; }
    .form-note { margin-top:10px; font-size:.8rem; line-height:1.6; color:var(--c-muted); }
    .form-note a { text-decoration:underline; text-underline-offset:3px; }
    .form-sent { display:grid; place-content:center; min-height:260px; text-align:center; font:500 clamp(1.8rem,3.4vw,2.6rem)/1.35 var(--hand); color:var(--c-a); }

    /* ---------- The free first meeting: closes the Q&A ---------- */
    .free { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:clamp(24px,5vw,72px); align-items:center; margin-top:clamp(48px,7vw,96px); padding:clamp(28px,5vw,64px); color:#fff; background:linear-gradient(120deg,#0e5560,#1b7f6c); }
    .free h3 { font:500 clamp(1.6rem,3vw,2.4rem)/1.2 var(--serif); letter-spacing:-.015em; margin-bottom:14px; }
    .free p { color:rgba(255,255,255,.9); line-height:1.8; max-width:52ch; }
    .free .button { color:#fff; border-color:rgba(255,255,255,.62); background:rgba(255,255,255,.1); white-space:nowrap; }
    .free .button:hover { background:rgba(255,255,255,.2); }

    /* ---------- 7. Q&A: numbered accordion, three groups ---------- */
    .qa { --qa-pad:clamp(8px,1.6vw,20px); --qa-gap:clamp(14px,2.4vw,28px); --qa-num:2.2rem; interpolate-size:allow-keywords; }
    .qa .split { grid-template-columns:minmax(0,.62fr) minmax(0,1.38fr); }
    .qa-ask { display:inline-flex; align-items:center; gap:12px; margin-top:clamp(20px,3vw,32px); padding:12px 0; font-weight:650; color:var(--c-a); border-bottom:1px solid currentColor; }
    .qa-ask::after { content:"\2192"; transition:transform .5s var(--ease); }
    .qa-ask:hover::after, .qa-ask:focus-visible::after { transform:translateX(6px); }
    .qa-body { counter-reset:qa; display:grid; gap:clamp(36px,5vw,60px); }
    .qa-group-title { display:flex; align-items:center; gap:18px; margin-bottom:6px; font:700 .76rem/1.2 var(--sans); letter-spacing:.16em; text-transform:uppercase; color:var(--c-a); }
    .qa-group-title::after { content:""; flex:1; height:1px; background:var(--c-line); }
    .qa-group-title:empty { display:none; }
    .qa-group:not(:has(details:not([hidden]))) { display:none; }
    .qa details { counter-increment:qa; border-bottom:1px solid var(--c-line); transition:background-color .5s var(--ease),box-shadow .5s var(--ease); }
    .qa-group-title:empty + details { border-top:1px solid var(--c-line); }
    .qa details[open] { background:var(--c-panel); box-shadow:inset 3px 0 0 var(--c-b); }
    .qa summary { display:grid; grid-template-columns:var(--qa-num) minmax(0,1fr) auto; align-items:center; gap:var(--qa-gap); padding:clamp(20px,2.6vw,28px) var(--qa-pad); cursor:pointer; list-style:none; }
    .qa summary::-webkit-details-marker { display:none; }
    .qa-n::before { content:counter(qa,decimal-leading-zero); font:500 .95rem/1 var(--serif); letter-spacing:.06em; font-variant-numeric:tabular-nums; color:var(--c-a); }
    .qa-q { font:500 clamp(1.1rem,1.7vw,1.4rem)/1.35 var(--serif); letter-spacing:-.01em; color:var(--c-text); text-wrap:balance; }
    .qa summary::after { content:""; flex:none; width:40px; height:40px; border:1px solid rgba(141,189,240,.3); border-radius:50%; color:var(--c-a); background:linear-gradient(currentColor,currentColor) center/14px 2px no-repeat,linear-gradient(currentColor,currentColor) center/2px 14px no-repeat,linear-gradient(160deg,rgba(141,189,240,.18),rgba(141,189,240,.05)); background-size:14px 2px,2px 14px,100% 100%; box-shadow:0 12px 22px -12px rgba(2,10,18,.85),inset 0 1px 0 rgba(255,255,255,.14); transition:transform .5s var(--ease),translate .45s var(--ease),border-color .3s ease,background-size .4s var(--ease),box-shadow .45s var(--ease); }
    .qa summary:hover::after, .qa details[open] summary::after { border-color:var(--c-a); }
    .qa summary:hover::after { translate:0 -2px; box-shadow:0 18px 26px -12px rgba(2,10,18,.9),inset 0 1px 0 rgba(255,255,255,.2); }
    .qa details[open] summary::after { background-size:14px 2px,2px 0,100% 100%; transform:rotate(180deg); }
    .qa-a { padding:0 var(--qa-pad) clamp(24px,3vw,34px) calc(var(--qa-pad) + var(--qa-num) + var(--qa-gap)); }
    .qa-a p { max-width:62ch; color:var(--c-muted); line-height:1.85; }
    .qa details[open] .qa-a p { animation:fadeIn .6s ease both; }
    @supports (interpolate-size:allow-keywords) {
      .qa details::details-content { block-size:0; overflow:hidden; transition:block-size .55s var(--ease),content-visibility .55s allow-discrete; }
      .qa details[open]::details-content { block-size:auto; }
    }

    /* ---------- Notes (appear only when an article is published) ---------- */
    .notes-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:22px; margin-top:clamp(28px,4vw,48px); }
    .blog-card { display:flex; flex-direction:column; overflow:hidden; background:#f3ebd9; border:1px solid rgba(16,36,58,.14); color:#10243a; }
    .blog-cover { display:flex; align-items:flex-end; height:190px; padding:22px; color:#123b63; background:linear-gradient(135deg,#d3e2f2,#a3c0de); overflow:hidden; }
    .blog-card:nth-child(3n+2) .blog-cover { background:linear-gradient(135deg,#d3ebe9,#8cc7c0); }
    .blog-card:nth-child(3n+3) .blog-cover { background:linear-gradient(135deg,#dbe9ee,#9bbfcf); }
    .blog-illustration { font:400 3.4rem/1 var(--serif); color:#1f5f9e; opacity:.6; }
    .blog-cover:has(> img) { padding:0; }
    .blog-body { display:flex; flex:1; flex-direction:column; padding:24px 26px 26px; }
    .blog-category { font-size:.78rem; font-weight:700; color:#1f7a67; }
    .blog-body h3 { font:500 1.3rem/1.35 var(--serif); margin:8px 0 10px; }
    .blog-body > p { margin:0 0 12px; font-size:.93rem; color:#46607a; }
    .article-link { margin-top:auto; font-weight:700; color:#1f5f9e; }
    .blog-empty { padding:28px; background:var(--glass); color:var(--text-muted); }
    .notes-all { margin-top:26px; }
    .notes .button-outline { background:transparent; border-color:var(--c-line); color:var(--c-text); }

    /* ---------- Footer ---------- */
    .site-footer { position:relative; isolation:isolate; padding:calc(var(--blend) * .7 + 28px) 0 44px; background:var(--abyss); color:#a6bccf; }
    .site-footer > .container { position:relative; z-index:1; }
    .footer-inner { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .footer-inner p { margin:0; color:#a6bccf; font-size:.86rem; }
    .footer-links { display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
    .footer-inner a { color:var(--blue-hi); font-weight:700; font-size:.88rem; }
    .footer-privacy { margin-top:14px; max-width:64ch; font-size:.8rem; line-height:1.6; color:#8ea6bb; }

    /* ---------- Jumping between sections ---------- */
    #top:focus, section[tabindex="-1"]:focus, .form-sent:focus { outline:none; }
    .mm.is-idle, .mm.is-idle * { animation-play-state:paused!important; }

    /* ---------- Shared with article pages ---------- */
    .scroll-progress { position:fixed; inset:0 0 auto 0; height:3px; z-index:140; transform:scaleX(var(--p,0)); transform-origin:0 50%; background:linear-gradient(90deg,var(--blue-hi),var(--green-hi)); pointer-events:none; }
    @supports (animation-timeline:scroll()) { .scroll-progress { animation:growBar linear both; animation-timeline:scroll(root block); } }
    @view-transition { navigation:auto; }
    ::view-transition-old(root), ::view-transition-new(root) { animation-duration:.5s; animation-timing-function:var(--ease); }
    .article-nav { margin-left:auto; }

    /* ---------- Motion ---------- */
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes riseIn { from { opacity:0; translate:0 26px; } to { opacity:1; translate:0 0; } }
    @keyframes sheen { from { background-position:100% 0; } to { background-position:0 0; } }
    @keyframes growBar { from { transform:scaleX(0); } to { transform:scaleX(1); } }
    @keyframes heroIn { from { opacity:0; } to { opacity:1; } }
    @keyframes flap { 0%,100% { transform:scaleX(1); } 50% { transform:scaleX(.7); } }
    @keyframes sway { from { transform:rotate(-3deg); } to { transform:rotate(3deg); } }
    @keyframes mm1 { 0% { opacity:0; } 6%,24% { opacity:1; } 32%,100% { opacity:0; } }
    @keyframes mm2 { 0%,26% { opacity:0; } 36%,56% { opacity:1; } 64%,100% { opacity:0; } }
    @keyframes mm3 { 0%,58% { opacity:0; transform:scale(.82); } 72%,92% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(1.04); } }

    /* ---------- Responsive ---------- */
    @media (max-width:900px) {
      .hero-grid { min-height:min(88svh,760px); }   /* still two halves on a phone: the vertical photograph, and the text */
      .hero-quote { padding:clamp(28px,6vw,56px) clamp(18px,4vw,36px) clamp(36px,7vw,64px) clamp(14px,3.2vw,28px); }
      .hero-quote::before { width:44px; margin-bottom:clamp(16px,3vw,26px); }
      .hero-q1 { font-size:clamp(1.45rem,5.6vw,2.7rem); line-height:1.12; letter-spacing:-.02em; overflow-wrap:break-word; }
      .hero-q2 { margin-top:clamp(14px,2.6vw,24px); font-size:clamp(.9rem,2.5vw,1.15rem); line-height:1.55; }
      .split, .intro .split, .sessions .split, .change .split, .contact .split, .qa .split { grid-template-columns:1fr; }
      .sticky { position:static; }
      .sessions .side-pair { display:contents; }
      .sessions .eyes { order:1; }
      .sessions .s-main { order:2; }
      .eyes { aspect-ratio:1; max-width:520px; }
      .quote-panel { min-height:340px; }
      .theme-grid { grid-template-columns:1fr 1fr; }
      .theme:nth-child(3n+2), .theme:nth-child(3n+3) { padding-left:0; border-left:0; }
      .theme:nth-child(even) { padding-left:clamp(18px,3vw,28px); border-left:1px solid var(--c-line); }
      .theme:nth-child(odd) { padding-left:0; }
      .free { grid-template-columns:1fr; }
    }
    @media (max-width:700px) {
      .plate, .plate-r, .plate-l { width:min(78%,360px); margin:8px auto 32px; }
    }
    @media (max-width:560px) {
      .container, .site-header .header-inner { width:calc(100% - 32px); }
      .theme-grid { grid-template-columns:1fr; }
      .theme, .theme:nth-child(even), .theme:nth-child(odd) { padding-left:0; border-left:0; }
      .qa { --qa-num:1.7rem; }
      .qa summary::after { width:34px; height:34px; }
      .qa-a { padding-left:var(--qa-pad); }
    }
    @media (prefers-reduced-motion:reduce) {
      html { scroll-behavior:auto; }
      *, *::before, *::after { animation-duration:.01ms!important; animation-iteration-count:1!important; animation-delay:0s!important; transition-duration:.01ms!important; transition-delay:0s!important; }
      .mm .s1, .mm .s2 { display:none; }
      .mm .s3 { opacity:1; }
      .quote-stroke path { stroke-dashoffset:0; }
      .scroll-progress { animation:none!important; }
    }
  </style>
</head>
<body>
  <div id="top" tabindex="-1"></div>
  <div class="scroll-progress" aria-hidden="true"></div>
  <a class="skip" href="#main" data-i18n="skip"></a>
  <main id="main" tabindex="-1">
    <!-- 1. Hero: the author's photograph on the left, the quotation on the right. No labels, no buttons. -->
    <section class="band band-deep hero" id="hero">
      <div class="hero-grid">
        <figure class="photo hero-photo">
          <img data-photo="portrait" data-i18n-alt="hero.alt" alt="" fetchpriority="high" decoding="async">
          <div class="ph" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="32" cy="22" r="10"/><path d="M10 58c1-14 9-22 22-22s21 8 22 22"/></svg><span data-i18n="photoSoon"></span></div>
        </figure>
        <div class="hero-quote">
          <h1 class="hero-q1" data-i18n="hero.quote1"></h1>
          <p class="hero-q2" data-i18n="hero.quote2"></p>
        </div>
      </div>
    </section>

    <!-- 2. Introduction: why this page is for athletes. Text on one side, photograph and quotation on the other. -->
    <section class="band band-sand intro" id="intro" aria-labelledby="intro-title">
      <div class="container split">
        <div class="intro-body">
          <h2 class="title" id="intro-title" data-fade data-i18n="story.title"></h2>
          <p class="mid" data-fade data-i18n="story.p1"></p>
          <p class="mid" data-fade data-i18n="story.p2"></p>
          <p class="pull" data-fade data-i18n="story.p3"></p>
          <p class="mid" data-fade data-i18n="story.p4"></p>
          <p class="mid" data-fade data-i18n="story.p5"></p>
        </div>
        <div class="quote-panel">
          <figure class="photo quote-bg" aria-hidden="true"><img data-photo="quote_photo" alt="" loading="lazy" decoding="async"></figure>
          <blockquote class="quote-text" data-write data-i18n="quotes.a"></blockquote>
          <svg class="quote-stroke" viewBox="0 0 300 18" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M2 11 C40 2 72 17 112 9 S190 3 232 10 S282 15 298 7"/></svg>
        </div>
      </div>
    </section>

    <!-- 3. Intuitive sessions: a different background from both neighbours -->
    <section class="band band-teal sessions" id="sessions" aria-labelledby="sessions-title">
      <div class="container">

  <script>
    'use strict';
    // Contact channels and the form endpoint are injected by scripts/build.py from content/site.json.
    const SETTINGS = { email:'', whatsapp:'', telegram:'', formEndpoint:'', inboxEndpoint:'', preview:false };
    const translations = { en:{} };
    // @@CMS_INJECTION@@

    const $ = (selector, scope) => (scope || document).querySelector(selector);
    const $$ = (selector, scope) => [...(scope || document).querySelectorAll(selector)];
    const root = document.documentElement;
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const hasObserver = 'IntersectionObserver' in window;
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const lang = 'en';

    function t(key) {
      const value = translations.en[key];
      return typeof value === 'string' ? value : '';
    }

    /* ---------- Handwriting: each quote is written letter by letter ---------- */
    function splitWrite(element) {
      const text = t(element.dataset.i18n).trim();
      const readable = document.createElement('span');
      readable.className = 'sr-only';
      readable.textContent = text;
      const visual = document.createElement('span');
      visual.setAttribute('aria-hidden', 'true');
      let count = 0;
      text.split('\n').forEach((line, lineIndex) => {
        if (lineIndex) visual.append(document.createElement('br'));
        line.split(/[^\S\u00a0]+/).filter(Boolean).forEach((word, wordIndex) => {
          if (wordIndex) visual.append(' ');
          const wrapper = document.createElement('span');
          wrapper.className = 'w';
          for (const character of word) {
            const letter = document.createElement('span');
            letter.className = 'ch';
            letter.style.setProperty('--i', count++);
            letter.textContent = character;
            wrapper.append(letter);
          }
          visual.append(wrapper);
        });
      });
      element.replaceChildren(readable, visual);
      const step = Math.max(16, Math.min(54, 3000 / Math.max(count, 1)));
      element.style.setProperty('--step', step.toFixed(1) + 'ms');
      element.parentElement.style.setProperty('--stroke-delay', Math.round(count * step + 500) + 'ms');   // the flourish is drawn last
      element.classList.add('is-split');
      if (reduceMotion || !hasObserver) element.classList.add('is-written');
    }
    function watch(selector, className, options) {
      const nodes = $$(selector);
      if (!hasObserver || (reduceMotion && className === 'is-written')) { nodes.forEach(node => node.classList.add(className)); return; }
      const observer = new IntersectionObserver(entries => entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add(className);
        observer.unobserve(entry.target);
      }), options);
      nodes.forEach(node => observer.observe(node));
    }

    /* ---------- Copy: the whole page is written in English ---------- */
    function applyCopy() {
      root.lang = 'en';
      document.title = t('meta.fullTitle');
      $('meta[name="description"]').content = t('meta.description');
      $('meta[property="og:title"]').content = t('meta.fullTitle');
      $('meta[property="og:description"]').content = t('meta.description');
      $$('[data-i18n]').forEach(node => { const text = t(node.dataset.i18n); if (node.textContent !== text) node.textContent = text; });   // the build already wrote this text: touch only what differs
      $$('[data-i18n-aria]').forEach(node => node.setAttribute('aria-label', t(node.dataset.i18nAria)));
      $$('[data-i18n-alt]').forEach(node => { const text = t(node.dataset.i18nAlt); if (node.alt !== text) node.alt = text; });
      $$('[data-qa]').forEach(node => { node.hidden = !t('qa.q' + node.dataset.qa).trim(); });
      $$('[data-post-lang]').forEach(node => { node.hidden = node.dataset.postLang !== lang; });
      const notes = $('#notes');
      if (notes) notes.hidden = !(CMS_VISIBLE_POSTS[lang] > 0);
      const allLink = $('#notes-all');
      if (allLink) allLink.href = lang + '/articles/';
      $('#form-status').textContent = '';
      $$('[data-write]').forEach(splitWrite);
    }
    applyCopy();
    $('#year').textContent = String(new Date().getFullYear());

    watch('[data-write]', 'is-written', { threshold: .4, rootMargin: '0px 0px -8% 0px' });
    watch('[data-fade]', 'in', { threshold: .15, rootMargin: '0px 0px -6% 0px' });
    watch('[data-finale]', 'in', { threshold: .45, rootMargin: '0px 0px -10% 0px' });    // closing statements appear slowly, once
    window.__ready = true;                                                              // the page script is running: the safety net in <head> stands down

    /* ---------- Photo numbers: every empty place is labelled until launch; ?photos labels all photos ---------- */
    const showAllSlots = /(?:^|[?&])photos(?:[=&]|$)/.test(location.search);
    if (showAllSlots) document.documentElement.classList.add('show-slots');
    $$('img[data-slot]').forEach(image => {
      const empty = !image.getAttribute('src');                           // an empty place is never filled with another photograph
      if (!showAllSlots && !(SETTINGS.preview && empty)) return;          // after launch only ?photos shows numbers
      const badge = document.createElement('span');
      badge.className = 'slot-badge';
      badge.setAttribute('aria-hidden', 'true');
      badge.textContent = 'Фото ' + image.dataset.slot;
      (image.closest('.quote-panel') || image.parentElement).appendChild(badge);
    });

    /* ---------- Photos: placeholders stay until a real image loads ---------- */
    $$('.photo').forEach(frame => {
      const image = $('img', frame);
      if (!image || !image.getAttribute('src')) return;
      const loaded = () => { if (image.naturalWidth > 0) frame.classList.add('has-photo'); };
      image.addEventListener('load', loaded);
      image.addEventListener('error', () => frame.classList.remove('has-photo'));
      if (image.complete) loaded();
    });

    /* ---------- Jumping between sections ---------- */
    const topAnchor = $('#top');
    const progressLine = $('.scroll-progress');
    const nativeProgress = !reduceMotion && window.CSS && CSS.supports && CSS.supports('animation-timeline', 'scroll()');
    function goTo(hash) {
      const id = decodeURIComponent(hash.slice(1));
      const target = id === 'top' ? topAnchor : document.getElementById(id);
      if (!target) return false;
      const behavior = reduceMotion ? 'auto' : 'smooth';
      if (id === 'top') scrollTo({ top: 0, behavior }); else target.scrollIntoView({ behavior, block: 'start' });
      if (!target.hasAttribute('tabindex') && !/^(A|BUTTON|INPUT|SELECT|TEXTAREA|SUMMARY)$/.test(target.tagName)) target.tabIndex = -1;
      target.focus({ preventScroll: true });             // keyboard and screen-reader users continue from here
      try { history.replaceState(history.state, '', id === 'top' ? location.pathname + location.search : hash); } catch (_) {}   // no extra Back steps
      return true;
    }
    document.addEventListener('click', event => {
      const link = event.target.closest('a[href^="#"]');
      if (!link || link.classList.contains('skip') || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      const hash = link.getAttribute('href');
      if (hash.length > 1 && goTo(hash)) event.preventDefault();
    });
    if (!nativeProgress) {                               // browsers without scroll-driven animations: the page height is measured on resize, never while scrolling
      let scrollQueued = false, scrollMax = 0;
      function onScroll() {
        scrollQueued = false;
        progressLine.style.setProperty('--p', scrollMax > 0 ? Math.min(1, scrollY / scrollMax).toFixed(4) : '0');
      }
      const measure = () => { scrollMax = Math.max(0, root.scrollHeight - innerHeight); onScroll(); };
      addEventListener('scroll', () => { if (!scrollQueued) { scrollQueued = true; requestAnimationFrame(onScroll); } }, { passive: true });
      addEventListener('resize', measure);
      addEventListener('load', measure);
      if ('ResizeObserver' in window) new ResizeObserver(measure).observe(document.body);
      measure();
    }
    if (hasObserver && !reduceMotion) {                  // the endless butterfly rests while it is off screen
      const rest = new IntersectionObserver(entries => entries.forEach(entry => entry.target.classList.toggle('is-idle', !entry.isIntersecting)), { rootMargin: '160px 0px' });
      $$('.mm').forEach(graphic => rest.observe(graphic));
    }

    /* ---------- Contact links: only genuinely configured channels are shown ---------- */
    const links = {
      email: EMAIL_RE.test(SETTINGS.email.trim()) ? 'mailto:' + SETTINGS.email.trim() : '',
      whatsapp: /^\d{7,15}$/.test(SETTINGS.whatsapp.trim()) ? 'https://wa.me/' + SETTINGS.whatsapp.trim() : '',
      telegram: /^[A-Za-z0-9_]{5,32}$/.test(SETTINGS.telegram.trim()) ? 'https://t.me/' + SETTINGS.telegram.trim() : ''
    };
    Object.entries(links).forEach(([key, url]) => {
      const link = $('#contact-' + key);
      if (link && url) { link.href = url; link.hidden = false; }
    });
    $('.contact-links').hidden = !Object.values(links).some(Boolean);

    /* ---------- Contact form: delivered to the inbox by a form service ---------- */
    const form = $('#contact-form');
    const statusLine = $('#form-status');
    const sendButton = $('#form-send');
    const endpoint = /^https:\/\//i.test(SETTINGS.formEndpoint.trim()) ? SETTINGS.formEndpoint.trim() : '';
    const inbox = /^https:\/\/script\.google\.com\//i.test((SETTINGS.inboxEndpoint || '').trim()) ? SETTINGS.inboxEndpoint.trim() : '';   // the owner's own requests sheet
    function say(key, isError) { statusLine.textContent = key ? t(key) : ''; statusLine.classList.toggle('is-error', !!isError); }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const data = new FormData(form);
      if (data.get('_gotcha')) return;                                  // honeypot: only bots fill it in
      const name = String(data.get('name') || '').trim();
      const contact = String(data.get('contact') || '').trim();
      const message = String(data.get('message') || '').trim();
      form.elements.namedItem('name').removeAttribute('aria-invalid');
      form.elements.namedItem('contact').removeAttribute('aria-invalid');
      if (!name || !contact) {
        say('formRequired', true);
        const missing = form.elements.namedItem(name ? 'contact' : 'name');
        missing.setAttribute('aria-invalid', 'true');   // announced by screen readers, styled below
        missing.focus();
        return;
      }
      const payload = { name, contact, message, language: lang, _subject: t('formSubject') + ' — ' + name };
      if (EMAIL_RE.test(contact)) { payload.email = contact; payload._replyto = contact; }
      if (!endpoint && !inbox) {                                        // nothing configured: use the mail client
        if (links.email) {
          location.href = links.email + '?subject=' + encodeURIComponent(payload._subject) + '&body=' + encodeURIComponent(name + ' — ' + contact + '\n\n' + message);
          say('formMailto');
        } else say('formUnset', true);
        return;
      }
      sendButton.disabled = true;
      say('formSending');
      try {
        const jobs = [];
        if (endpoint) jobs.push(fetch(endpoint, { method:'POST', headers:{ 'Content-Type':'application/json', 'Accept':'application/json' }, body:JSON.stringify(payload) }).then(response => { if (!response.ok) throw new Error('HTTP ' + response.status); }));
        if (inbox) jobs.push(fetch(inbox, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify({ action:'submit', ...payload }) }).then(response => response.json()).then(answer => { if (!answer || answer.ok !== true) throw new Error('inbox refused'); }));
        const results = await Promise.allSettled(jobs);                  // one working channel is enough
        if (!results.some(result => result.status === 'fulfilled')) throw new Error('not delivered');
        form.reset();
        form.hidden = true;
        const sent = $('#form-sent');
        sent.hidden = false;
        sent.focus({ preventScroll: true });             // screen readers announce the confirmation
      } catch (_) {
        say('formError', true);
        sendButton.disabled = false;
      }
    });
  </script>
</body>
</html>
