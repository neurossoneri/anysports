  <script>(function(){var r=document.documentElement;r.classList.add('js');try{var t=localStorage.getItem('sport-site-theme');r.dataset.theme=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}catch(e){r.dataset.theme='light'}})()</script>
  <style>
    /* ---------- Tokens ---------- */
    :root {
      --serif:"Source Serif 4",Georgia,"Palatino Linotype",serif;
      --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      --hand:"Caveat","Segoe Script","Bradley Hand","Comic Sans MS",cursive;
      --ease:cubic-bezier(.16,1,.3,1);
      --glass-inner:inset 0 1px 0 rgba(255,255,255,.65);
      --bg:#f5f9fc; --bg-soft:#eaf2f9; --paper:#ffffff; --paper-alt:#f4f8fd;
      --text:#1b3452; --text-muted:#465e75;
      --blue:#3f6cb0; --blue-deep:#2c559a; --mint:#79b9a3; --mint-strong:#25735f;
      --border:rgba(63,100,165,.16);
      --shadow:0 26px 66px -42px rgba(44,85,154,.34);
      --shadow-strong:0 36px 90px -46px rgba(38,76,140,.36);
      --focus:#3a64ae;
      --glass:rgba(255,255,255,.58); --glass-bright:rgba(255,255,255,.74); --glass-stroke:rgba(255,255,255,.85);
      --glass-shadow:0 22px 65px -34px rgba(52,92,166,.30);
      --soft-blue:rgba(160,188,234,.52); --soft-green:rgba(140,201,178,.42); --soft-lav:rgba(196,185,232,.42);
      --veil:rgba(255,255,255,.42);
      --wash-indigo:rgba(116,142,210,.50); --wash-blue:rgba(156,190,238,.55); --wash-teal:rgba(110,184,166,.46);
      --wash-lav:rgba(184,170,228,.46); --wash-lemon:rgba(238,242,208,.55);
      --aura:rgba(140,178,236,.30); --ripple:rgba(63,108,176,.24);
      --ink-q:#1f3558; --line-q:rgba(44,85,154,.5);
      --grad-a:linear-gradient(135deg,#e2ecfc,#ebe4f8 55%,#dcf1ea);
      --grad-b:linear-gradient(135deg,#dff2ea,#e4eefb 60%,#f1f4d9);
      --grad-c:linear-gradient(135deg,#ece5f8,#f8e8ec 55%,#e3ecfb);
      --grad-d:linear-gradient(135deg,#1d3a70,#2b4f8f 48%,#2a6c78);
      /* Organic outlines: no sharp corners anywhere. */
      --r-hero-a:34% 28% 30% 36% / 30% 34% 28% 32%;
      --r-hero-b:26% 36% 34% 28% / 34% 26% 32% 30%;
      --r-leaf:62% 38% 56% 44% / 46% 54% 46% 54%;
      --r-egg:50% 50% 46% 54% / 58% 56% 44% 42%;
      --r-cloud:38% 62% 42% 58% / 52% 38% 62% 48%;
    }
    :root[data-theme="dark"] {
      color-scheme:dark;
      --glass-inner:inset 0 1px 0 rgba(207,235,255,.10);
      --bg:#0e1f34; --bg-soft:#13293f; --paper:#182f48; --paper-alt:#1c3752;
      --text:#f1f6fd; --text-muted:#bdd0e4;
      --blue:#9fb9ee; --blue-deep:#b7caf5; --mint:#8fd1bb; --mint-strong:#a8dfc9;
      --border:rgba(168,196,240,.18);
      --shadow:0 26px 65px -40px rgba(0,7,20,.8); --shadow-strong:0 34px 80px -40px rgba(0,7,20,.82);
      --focus:#b7caf5;
      --glass:rgba(28,52,82,.62); --glass-bright:rgba(33,62,96,.74); --glass-stroke:rgba(176,200,240,.22);
      --glass-shadow:0 24px 70px -35px rgba(0,9,29,.72);
      --soft-blue:rgba(78,108,184,.30); --soft-green:rgba(50,140,120,.24); --soft-lav:rgba(110,96,186,.26);
      --veil:rgba(16,38,62,.46);
      --wash-indigo:rgba(66,88,170,.42); --wash-blue:rgba(54,96,164,.34); --wash-teal:rgba(34,126,116,.34);
      --wash-lav:rgba(96,82,170,.30); --wash-lemon:rgba(120,140,100,.10);
      --aura:rgba(110,140,230,.22); --ripple:rgba(168,196,240,.28);
      --ink-q:#f1f6fd; --line-q:rgba(190,212,255,.55);
      --grad-a:linear-gradient(135deg,#1c3158,#2a2c5c 55%,#1b4a4d);
      --grad-b:linear-gradient(135deg,#17413f,#1d3560 60%,#33432d);
      --grad-c:linear-gradient(135deg,#2c2a5c,#4a2f52 55%,#1f3560);
      --grad-d:linear-gradient(135deg,#0f2447,#193a6b 50%,#1b5560);
    }

    /* ---------- Base ---------- */
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; scroll-padding-top:96px; }
    body { margin:0; min-width:320px; color:var(--text); background:var(--bg); font-family:var(--sans); line-height:1.65; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow-x:hidden; }
    body::before { content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
      background:radial-gradient(ellipse 80% 60% at 0% 104%, var(--wash-indigo), transparent 68%),
                 radial-gradient(ellipse 60% 46% at 42% 112%, var(--wash-teal), transparent 70%),
                 radial-gradient(ellipse 50% 44% at 104% 86%, var(--wash-blue), transparent 68%),
                 radial-gradient(ellipse 44% 36% at 8% 38%, var(--wash-lav), transparent 70%),
                 radial-gradient(ellipse 60% 40% at 92% -4%, var(--wash-lemon), transparent 70%),
                 linear-gradient(180deg, var(--bg), var(--bg-soft)); }
    main { overflow-x:clip; }
    main:focus { outline:none; }
    figure { margin:0; }
    img { display:block; width:100%; height:100%; object-fit:cover; }
    button, input, select, textarea { font:inherit; color:inherit; }
    button { cursor:pointer; }
    a { color:inherit; text-decoration:none; }
    :where(a,button,select,input,textarea,summary):focus-visible { outline:3px solid var(--focus); outline-offset:4px; }
    h1,h2,h3 { text-wrap:balance; margin:0; }
    p { text-wrap:pretty; margin:0; white-space:pre-line; }
    ::selection { background:rgba(148,178,230,.42); }
    [hidden] { display:none!important; }
    .sr-only { position:absolute!important; width:1px!important; height:1px!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; }
    .skip { position:fixed; top:-90px; left:15px; z-index:1000; background:var(--paper); padding:12px 20px; border-radius:999px; }
    .skip:focus { top:15px; }
    .container { width:min(1120px,calc(100% - 40px)); margin-inline:auto; }
    .hand { font-family:var(--hand); }
    .title { font:500 clamp(2.1rem,4.8vw,3.7rem)/1.12 var(--serif); letter-spacing:-.025em; margin:0 0 clamp(20px,3vw,32px); }
    .lead { font-size:clamp(1.05rem,1.5vw,1.2rem); line-height:1.85; color:var(--text-muted); max-width:56ch; }
    .lead + .lead { margin-top:1.3em; }
    .sec { position:relative; padding:clamp(64px,10vw,150px) 0; }
    .sec--air { padding:clamp(110px,16vw,250px) 0; }

    /* ---------- Buttons and glass ---------- */
    .glass { background:var(--glass-bright); border:1px solid var(--glass-stroke); box-shadow:var(--glass-inner),var(--glass-shadow); backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4); }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:54px; padding:14px 30px; border-radius:999px; border:1px solid var(--glass-stroke); background:var(--glass-bright); color:var(--text); font-weight:650; font-size:.97rem; text-align:center; box-shadow:var(--glass-inner),var(--glass-shadow); transition:transform .6s var(--ease),box-shadow .6s var(--ease),background-color .3s; }
    .button:hover { transform:translateY(-2px); }
    .button:active { transform:scale(.98); transition-duration:.12s; }
    .button-primary { border-color:transparent; color:#fff; background:linear-gradient(110deg,#4a7cc4,#5a9fb0 55%,#5fae98); box-shadow:0 20px 44px -24px rgba(40,110,150,.85); }
    .button-outline { background:var(--glass); }
    .icon-button { display:grid; place-items:center; width:40px; height:40px; border-radius:50%; border:1px solid var(--glass-stroke); background:var(--glass); box-shadow:var(--glass-inner); color:var(--text); flex:none; }
    .icon-button { font-size:1.05rem; line-height:1; }
    .icon-button svg { width:19px; height:19px; }
    .theme-icon-sun, .theme-icon-moon { display:none; }
    :root[data-theme="dark"] .theme-icon-sun { display:block; }
    :root[data-theme="light"] .theme-icon-moon { display:block; }

    /* ---------- Header ---------- */
    .site-header { position:sticky; top:12px; z-index:90; width:min(1120px,calc(100% - 24px)); margin:12px auto 0; border-radius:999px; background:var(--glass-bright); border:1px solid var(--glass-stroke); box-shadow:var(--glass-inner),0 14px 42px -28px rgba(25,78,113,.45); backdrop-filter:blur(22px) saturate(1.45); -webkit-backdrop-filter:blur(22px) saturate(1.45); }
    .header-inner { display:flex; align-items:center; gap:14px; min-height:60px; width:calc(100% - 28px); margin-inline:auto; }
    .brand { display:flex; align-items:center; gap:11px; margin-right:auto; font-weight:700; letter-spacing:-.02em; font-size:.95rem; line-height:1.15; max-width:260px; }
    .brand-mark { flex:none; display:grid; place-items:center; width:35px; height:35px; border-radius:50%; overflow:hidden; background:#dce8f8; box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 7px 20px -12px rgba(63,100,165,.8); }
    .brand-mark svg { width:100%; height:100%; }
    .header-actions { display:flex; align-items:center; gap:8px; }
    .language-select { height:40px; border-radius:999px; border:1px solid var(--glass-stroke); background:var(--glass); box-shadow:var(--glass-inner); padding:0 12px; font-size:.8rem; font-weight:700; cursor:pointer; }

    /* ---------- Hero: the photograph arrives first ---------- */
    .hero { padding:clamp(24px,4vw,48px) 0 0; }
    .hero-stage { position:relative; width:min(1180px,calc(100% - 28px)); margin-inline:auto; }
    .photo { position:relative; overflow:hidden; isolation:isolate; background:linear-gradient(135deg,#d6e4f6,#c3d6ee 45%,#bfe0d3); box-shadow:var(--shadow-strong); }
    :root[data-theme="dark"] .photo { background:linear-gradient(135deg,#27406c,#2a4e78 50%,#2a6a62); }
    .photo > img { position:absolute; inset:0; opacity:0; transition:opacity 1.2s var(--ease),scale 2.2s var(--ease); }
    .photo.has-photo > img { opacity:1; }
    .photo.has-photo .ph { display:none; }
    .photo:hover > img { scale:1.035; }
    .ph { position:absolute; inset:0; display:grid; place-content:center; justify-items:center; gap:10px; padding:24px; text-align:center; color:var(--blue-deep); font-size:.82rem; font-weight:600; opacity:.85; }
    .ph svg { width:48px; height:48px; opacity:.7; }
    .hero-photo { height:clamp(430px,80svh,840px); border-radius:var(--r-hero-a); animation:heroIn 2s var(--ease) both,morph 20s ease-in-out 2s infinite alternate; }
    .hero-tag { position:absolute; left:clamp(16px,4vw,52px); bottom:clamp(16px,4vw,46px); display:grid; gap:2px; padding:14px 26px; border-radius:36px; animation:fadeIn 1.6s ease 1.1s both; }
    .hero-tag strong { font:500 1.2rem var(--serif); }
    .hero-tag span { font-size:.8rem; color:var(--text-muted); }
    .hero-tag span:empty { display:none; }
    .hero-hint { display:flex; justify-content:center; align-items:center; gap:12px; margin-top:clamp(22px,3vw,34px); font:500 clamp(1.3rem,2.2vw,1.7rem) var(--hand); color:var(--text-muted); animation:fadeIn 1.6s ease 1.8s both; }
    .hero-hint i { width:9px; height:9px; border-radius:50%; background:var(--mint-strong); box-shadow:0 0 0 6px var(--soft-green); animation:breathe 4.5s ease-in-out infinite; }

    /* ---------- Quote cards on soft backgrounds ---------- */
    .quote { position:relative; width:min(var(--qw,1160px),calc(100% - 24px)); margin:clamp(40px,7vw,110px) var(--qmr,auto) clamp(40px,7vw,110px) var(--qml,auto); }
    .quote-card { position:relative; isolation:isolate; overflow:hidden; padding:clamp(84px,13vw,190px) clamp(26px,8vw,120px); text-align:center; border-radius:var(--qr); background:var(--qbg); box-shadow:var(--shadow-strong),inset 0 1px 0 rgba(255,255,255,.5); }
    .quote-card i { position:absolute; z-index:-1; border-radius:50%; filter:blur(54px); pointer-events:none; animation:drift 26s ease-in-out infinite alternate; }
    .quote-card i:nth-child(1) { left:-8%; top:-24%; width:46%; aspect-ratio:1; background:var(--o1); }
    .quote-card i:nth-child(2) { right:-10%; bottom:-34%; width:52%; aspect-ratio:1; background:var(--o2); animation-delay:-9s; }
    .quote-card i:nth-child(3) { left:36%; top:34%; width:28%; aspect-ratio:1; background:var(--o3); animation-delay:-16s; }
    .quote-text { margin:0; font:500 clamp(2.1rem,5.4vw,4.4rem)/1.18 var(--hand); color:var(--ink-q); text-wrap:balance; }
    .quote-stroke { display:block; width:min(240px,52%); height:18px; margin:clamp(20px,3vw,36px) auto 0; overflow:visible; }
    .quote-stroke path { fill:none; stroke:var(--line-q); stroke-width:2.2; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; transition:stroke-dashoffset 2.4s var(--ease) var(--stroke-delay,1.2s); }
    .is-written + .quote-stroke path { stroke-dashoffset:0; }
    .q-a { --qbg:var(--grad-a); --qr:clamp(48px,9vw,140px) clamp(32px,5vw,72px) clamp(48px,9vw,140px) clamp(32px,5vw,72px); --o1:rgba(120,150,230,.55); --o2:rgba(190,170,235,.5); --o3:rgba(130,200,180,.45); }
    .q-b { --qbg:var(--grad-b); --qw:940px; --qml:auto; --qmr:clamp(12px,5vw,80px); --qr:clamp(32px,5vw,72px) clamp(52px,10vw,150px) clamp(32px,5vw,72px) clamp(52px,10vw,150px); --o1:rgba(120,200,175,.5); --o2:rgba(150,185,240,.5); --o3:rgba(236,236,170,.5); }
    .q-c { --qbg:var(--grad-c); --qw:1000px; --qml:clamp(12px,6vw,90px); --qmr:auto; --qr:clamp(64px,12vw,170px) clamp(40px,6vw,90px); --o1:rgba(196,170,235,.55); --o2:rgba(250,196,190,.5); --o3:rgba(150,185,240,.45); }
    .q-c .quote-card { text-align:left; }
    .q-c .quote-stroke { margin-left:0; }
    .q-d { --qbg:var(--grad-d); --ink-q:#f4f8ff; --line-q:rgba(214,230,255,.6); --qr:clamp(56px,11vw,170px); --o1:rgba(110,150,235,.5); --o2:rgba(140,120,225,.4); --o3:rgba(100,200,180,.4); margin-bottom:clamp(60px,9vw,130px); }

    /* ---------- Handwriting: text is written in real time ---------- */
    .js [data-write]:not(.is-split) { visibility:hidden; }
    .w { display:inline-block; white-space:nowrap; }
    .js .ch { display:inline-block; opacity:0; filter:blur(5px); transform:translateY(.2em) rotate(-3deg); clip-path:inset(-.4em 100% -.4em -.1em); transition:opacity .7s var(--ease),filter .7s var(--ease),transform .9s var(--ease),clip-path .9s var(--ease); transition-delay:calc(var(--i) * var(--step,45ms)); }
    .js .is-written .ch { opacity:1; filter:none; transform:none; clip-path:inset(-.4em -.4em -.4em -.1em); }

    /* ---------- Quiet fade for ordinary text ---------- */
    .js [data-fade] { opacity:0; transition:opacity 1.6s ease var(--d,0s); }
    .js [data-fade].in { opacity:1; }

    /* ---------- Decoration: ripples, drifting orbs ---------- */
    .ripple { position:absolute; width:var(--s,420px); aspect-ratio:1; pointer-events:none; z-index:-1; }
    .ripple i { position:absolute; inset:0; border-radius:50%; border:1px solid var(--ripple); animation:ripple 10s ease-in-out infinite; }
    .ripple i:nth-child(2) { inset:12%; animation-delay:-3.3s; }
    .ripple i:nth-child(3) { inset:26%; animation-delay:-6.6s; }
    .aura { position:fixed; left:0; top:0; z-index:-1; width:540px; height:540px; margin:-270px 0 0 -270px; border-radius:50%; pointer-events:none; opacity:0; transition:opacity 1.2s ease; background:radial-gradient(circle,var(--aura),transparent 66%); }

    /* ---------- Story about the site ---------- */
    .story .container { position:relative; }
    .story .ripple { left:-8%; top:-10%; --s:clamp(260px,44vw,540px); }
    .story-body { max-width:640px; margin-left:clamp(0px,14vw,210px); }
    .story-body .mid { margin:1.5em 0; font:400 clamp(1.2rem,1.9vw,1.5rem)/1.75 var(--serif); color:var(--text); }

    /* ---------- For whom ---------- */
    .client-head { max-width:700px; }
    .thoughts { display:grid; gap:clamp(14px,2vw,22px); margin-top:clamp(36px,6vw,72px); }
    .thought { width:fit-content; max-width:min(560px,100%); padding:22px 30px; border-radius:44px 44px 44px 16px; font:400 clamp(1.15rem,1.8vw,1.4rem)/1.55 var(--serif); animation:bob 9s ease-in-out infinite; }
    .thought:nth-child(2) { margin-left:clamp(0px,16vw,220px); border-radius:44px 16px 44px 44px; animation-delay:-2.2s; }
    .thought:nth-child(3) { margin-left:clamp(0px,5vw,70px); animation-delay:-4.4s; }
    .thought:nth-child(4) { margin-left:clamp(0px,24vw,330px); border-radius:44px 44px 16px 44px; animation-delay:-6.6s; }
    .client-note { margin:clamp(56px,8vw,110px) auto 0; max-width:22em; text-align:center; font:500 clamp(1.7rem,3.2vw,2.5rem)/1.3 var(--hand); color:var(--blue-deep); }

    /* ---------- Why athletes ---------- */
    .why .container { display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr); gap:clamp(24px,6vw,96px); align-items:center; }
    .why-art { position:relative; aspect-ratio:1; width:min(100%,360px); }
    .why-art i { position:absolute; inset:0; background:linear-gradient(135deg,var(--soft-blue),var(--soft-lav)); border-radius:var(--r-cloud); animation:morph2 14s ease-in-out infinite alternate; }
    .why-art i + i { inset:14% 8% 6% 22%; background:linear-gradient(135deg,var(--soft-green),var(--soft-blue)); animation-duration:18s; animation-delay:-5s; }
    .why-body { max-width:580px; margin-left:auto; }

    /* ---------- About: a life story in four frames ---------- */
    .about-head { max-width:720px; }
    .chapter { display:grid; align-items:center; gap:clamp(24px,5vw,72px); margin-top:clamp(64px,10vw,150px); }
    .chapter h3 { font:500 clamp(1.5rem,2.6vw,2.1rem)/1.25 var(--serif); margin-bottom:14px; }
    .chapter p { font-size:clamp(1.02rem,1.4vw,1.15rem); line-height:1.85; color:var(--text-muted); max-width:46ch; }
    .c1 { grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); }
    .c1 .photo { aspect-ratio:4/5; border-radius:var(--r-leaf); }
    .c2 { grid-template-columns:minmax(0,1fr) minmax(0,.7fr); padding-left:clamp(0px,7vw,100px); }
    .c2 .photo { order:2; aspect-ratio:1; border-radius:50%; }
    .c3 { grid-template-columns:minmax(0,.62fr) minmax(0,1fr); }
    .c3 .photo { aspect-ratio:3/4; border-radius:var(--r-egg); transform:translateY(-6%); }
    .c3 .chap-text { padding-left:clamp(0px,5vw,70px); }
    .c4 { grid-template-columns:1fr; justify-items:end; }
    .c4 .photo { width:min(100%,900px); aspect-ratio:16/10; border-radius:var(--r-cloud); }
    .c4 .chap-text { width:min(520px,92%); margin:calc(-1 * clamp(48px,8vw,110px)) auto 0 0; padding:clamp(24px,4vw,40px); border-radius:44px; justify-self:start; }

    /* ---------- Listening to intuition ---------- */
    .check .container { position:relative; text-align:center; max-width:820px; }
    .check .ripple { left:50%; top:50%; translate:-50% -50%; --s:min(100vw,820px); }
    .check .title { margin-bottom:clamp(28px,4vw,48px); }
    .check-line { margin:0 auto; font:400 clamp(1.5rem,3.6vw,2.7rem)/1.4 var(--serif); letter-spacing:-.01em; }
    .check-line + .check-line { margin-top:clamp(18px,3vw,34px); }
    .check-note { margin:clamp(40px,6vw,76px) auto 0; font:500 clamp(1.5rem,2.6vw,2rem)/1.35 var(--hand); color:var(--text-muted); max-width:26em; }
    .check-note + .check-note { margin-top:10px; color:var(--blue-deep); }

    /* ---------- The fork: it resonated / not yet ---------- */
    .fork .container { display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr); gap:clamp(28px,6vw,88px); align-items:center; }
    .eyes { aspect-ratio:1; width:min(100%,420px); border-radius:50%; box-shadow:0 0 0 14px rgba(255,255,255,.35),0 0 0 15px var(--glass-stroke),var(--shadow-strong); }
    .fork-lead { font:500 clamp(1.6rem,3vw,2.4rem)/1.3 var(--serif); letter-spacing:-.01em; }
    .fork-voice { margin-top:18px; font:500 clamp(1.7rem,3vw,2.3rem)/1.3 var(--hand); color:var(--blue-deep); }
    .paths { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); gap:16px; align-items:start; margin-top:clamp(32px,5vw,56px); }
    .path { display:grid; gap:6px; text-align:left; padding:26px 28px; border-radius:38px; border:1px solid var(--glass-stroke); background:var(--glass-bright); box-shadow:var(--glass-inner),var(--glass-shadow); transition:transform .6s var(--ease),box-shadow .6s var(--ease); }
    .path:hover { transform:translateY(-3px); box-shadow:var(--glass-inner),var(--shadow-strong); }
    .path strong { font:500 1.5rem/1.25 var(--serif); }
    .path span { color:var(--text-muted); font-size:.95rem; }
    .path em { margin-top:10px; font-style:normal; font-weight:650; font-size:.95rem; color:var(--blue-deep); }
    .path-yes { background:linear-gradient(135deg,var(--glass-bright),var(--soft-green)); }
    .path-no { margin-top:clamp(0px,3vw,38px); border-radius:34px; }

    /* ---------- Change: three quiet movements ---------- */
    .change .container { display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:clamp(28px,6vw,96px); align-items:center; }
    .shift { position:relative; aspect-ratio:1; width:min(100%,380px); }
    .shift i { position:absolute; inset:0; background:linear-gradient(135deg,var(--soft-lav),var(--soft-blue)); border-radius:var(--r-egg); animation:morph2 11s ease-in-out infinite alternate; }
    .shift i + i { inset:20%; background:linear-gradient(135deg,var(--soft-green),var(--soft-lav)); animation-duration:15s; animation-delay:-4s; }
    .change-body { max-width:560px; }
    .change2 .container { display:grid; justify-items:center; text-align:center; gap:clamp(8px,2vw,20px); }
    .change2 .lead { margin-inline:auto; }
    .change2 .title { margin-bottom:0; }
    .mm { width:min(100%,460px); height:auto; overflow:visible; margin-bottom:clamp(8px,2vw,24px); }
    .mm .s1, .mm .s2, .mm .s3 { opacity:0; }
    .mm .s1 { animation:mm1 16s ease-in-out infinite; }
    .mm .s2 { animation:mm2 16s ease-in-out infinite; }
    .mm .s3 { animation:mm3 16s ease-in-out infinite; transform-origin:180px 130px; }
    .mm .sway { transform-origin:180px 30px; animation:sway 6s ease-in-out infinite alternate; }
    .mm .wing { transform-origin:180px 125px; animation:flap 3.4s ease-in-out infinite; }
    .support .container { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:clamp(28px,6vw,96px); align-items:center; }
    .support-body { max-width:560px; margin-left:clamp(0px,8vw,120px); }
    .hold { width:min(100%,380px); height:auto; justify-self:center; overflow:visible; }
    .hold .orbit { transform-origin:180px 110px; animation:spin 40s linear infinite; }
    .hold .core { transform-origin:180px 110px; animation:breathe 6s ease-in-out infinite; }

    /* ---------- Invitation and the free first meeting ---------- */
    .invite .container { max-width:760px; text-align:center; }
    .invite .lead { margin:0 auto clamp(28px,4vw,44px); }
    .free .container { display:grid; grid-template-columns:auto minmax(0,1fr); gap:clamp(28px,6vw,80px); align-items:center; max-width:920px; }
    .coin { display:grid; place-content:center; justify-items:center; width:clamp(200px,26vw,280px); aspect-ratio:1; border-radius:50%; text-align:center; background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.9),rgba(255,255,255,0) 42%),linear-gradient(145deg,var(--soft-blue),var(--soft-green)); border:1px solid var(--glass-stroke); box-shadow:var(--glass-inner),var(--shadow-strong); animation:bob 9s ease-in-out infinite; }
    .coin b { font:500 clamp(4rem,8vw,5.6rem)/1 var(--serif); letter-spacing:-.04em; }
    .coin span { color:var(--text-muted); font-size:1rem; }
    .coin em { margin-top:12px; padding:5px 16px; border-radius:999px; background:var(--glass-bright); font:600 1.3rem var(--hand); font-style:normal; color:var(--mint-strong); }

    /* ---------- Contact ---------- */
    .contact-card { display:grid; grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr); gap:clamp(28px,5vw,64px); padding:clamp(28px,6vw,72px); border-radius:clamp(40px,7vw,96px) clamp(28px,4vw,56px) clamp(40px,7vw,96px) clamp(28px,4vw,56px); }
    .contact-card h2 { font:500 clamp(2rem,4vw,3rem)/1.15 var(--serif); letter-spacing:-.02em; margin-bottom:18px; }
    .contact-links { display:grid; gap:10px; margin-top:clamp(24px,4vw,40px); }
    .contact-links h3 { font:500 1.05rem var(--serif); color:var(--text-muted); margin-bottom:2px; }
    .contact-links a { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:14px 22px; border-radius:999px; background:var(--glass-bright); border:1px solid var(--glass-stroke); font-weight:650; font-size:.93rem; transition:transform .6s var(--ease); }
    .contact-links a:hover { transform:translateX(4px); }
    .field { display:block; margin-bottom:16px; }
    .field span { display:block; margin:0 0 8px 10px; font-size:.86rem; color:var(--text-muted); }
    .field input, .field textarea { width:100%; padding:15px 22px; border-radius:30px; border:1px solid var(--border); background:var(--paper); color:var(--text); }
    .field textarea { min-height:132px; resize:vertical; border-radius:28px; }
    .hp { position:absolute!important; left:-9999px!important; width:1px; height:1px; opacity:0; }
    .form-status { min-height:1.6em; margin-top:12px; font-size:.92rem; color:var(--text-muted); }
    .form-status.is-error { color:#b64c56; }
    .form-note { margin-top:10px; font-size:.8rem; line-height:1.6; color:var(--text-muted); }
    .form-sent { display:grid; place-content:center; min-height:260px; text-align:center; font:500 clamp(1.8rem,3.4vw,2.6rem)/1.35 var(--hand); color:var(--blue-deep); }

    /* ---------- FAQ ---------- */
    .faq .container { max-width:860px; }
    .faq-list { margin-top:clamp(28px,4vw,48px); display:grid; gap:12px; }
    .faq-list details { border-radius:32px; background:var(--glass); border:1px solid var(--glass-stroke); padding:0 28px; box-shadow:var(--glass-inner); }
    .faq-list summary { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:22px 0; font-weight:650; cursor:pointer; list-style:none; }
    .faq-list summary::-webkit-details-marker { display:none; }
    .faq-list summary::after { content:""; flex:none; width:22px; height:22px; color:var(--blue-deep); background:linear-gradient(currentColor,currentColor) center/13px 1.8px no-repeat,linear-gradient(currentColor,currentColor) center/1.8px 13px no-repeat; transition:background-size .45s var(--ease),transform .45s var(--ease); }
    .faq-list details[open] summary::after { background-size:13px 1.8px,1.8px 0; transform:rotate(180deg); }
    .faq-list details[open] p { animation:fadeIn .6s ease both; }
    .faq-list p { margin:0 0 24px; color:var(--text-muted); line-height:1.8; max-width:62ch; }

    /* ---------- Notes (appear only when an article is published) ---------- */
    .notes-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:22px; margin-top:clamp(28px,4vw,48px); }
    .blog-card { display:flex; flex-direction:column; overflow:hidden; border-radius:36px; background:var(--glass-bright); border:1px solid var(--glass-stroke); box-shadow:var(--glass-inner),var(--glass-shadow); }
    .blog-cover { display:flex; align-items:flex-end; height:190px; padding:22px; color:#1d3f6e; background:linear-gradient(135deg,#d3def4,#a9bfe8); overflow:hidden; }
    .blog-card:nth-child(3n+2) .blog-cover { background:linear-gradient(135deg,#d6edeb,#8fc9c3); }
    .blog-card:nth-child(3n+3) .blog-cover { background:linear-gradient(135deg,#e3f0d6,#a5d0a9); }
    .blog-illustration { font:400 3.4rem/1 var(--serif); color:var(--blue-deep); opacity:.6; }
    .blog-cover:has(> img) { padding:0; }
    .blog-body { display:flex; flex:1; flex-direction:column; padding:24px 28px 28px; }
    .blog-category { font-size:.78rem; font-weight:700; color:var(--mint-strong); }
    .blog-body h3 { font:500 1.3rem/1.35 var(--serif); margin:8px 0 10px; }
    .blog-body > p { margin:0 0 12px; font-size:.93rem; color:var(--text-muted); }
    .article-link { margin-top:auto; font-weight:700; color:var(--blue-deep); }
    .blog-empty { padding:28px; border-radius:28px; background:var(--glass); color:var(--text-muted); }
    .notes-all { margin-top:26px; }

    /* ---------- Footer ---------- */
    .site-footer { padding:28px 0 44px; }
    .footer-inner { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .footer-inner p { margin:0; color:var(--text-muted); font-size:.86rem; }
    .footer-inner a { color:var(--blue-deep); font-weight:700; font-size:.88rem; }

    /* ---------- Farewell (when "not yet" is chosen) ---------- */
    .farewell { position:fixed; inset:0; z-index:200; display:grid; place-items:center; padding:24px; background:var(--bg); background:color-mix(in srgb,var(--bg) 80%,transparent); backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px); animation:fadeIn .9s ease both; }
    .farewell-card { max-width:540px; padding:clamp(32px,6vw,60px); text-align:center; border-radius:56px; }
    .farewell-card h2 { font:500 clamp(1.8rem,4vw,2.5rem)/1.2 var(--serif); margin-bottom:16px; }
    .farewell-card p { color:var(--text-muted); margin-bottom:28px; }

    /* ---------- Shared with article pages ---------- */
    .scroll-progress { position:fixed; inset:0 0 auto 0; height:3px; z-index:140; transform:scaleX(var(--p,0)); transform-origin:0 50%; background:linear-gradient(90deg,var(--blue),var(--mint-strong)); border-radius:0 3px 3px 0; pointer-events:none; }
    @supports (animation-timeline:scroll()) { .scroll-progress { animation:growBar linear both; animation-timeline:scroll(root block); } }
    @view-transition { navigation:auto; }
    ::view-transition-old(root), ::view-transition-new(root) { animation-duration:.5s; animation-timing-function:var(--ease); }

    /* ---------- Motion ---------- */
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes riseIn { from { opacity:0; translate:0 26px; } to { opacity:1; translate:0 0; } }
    @keyframes growBar { from { transform:scaleX(0); } to { transform:scaleX(1); } }
    @keyframes heroIn { from { opacity:0; scale:1.05; } to { opacity:1; scale:1; } }
    @keyframes morph { from { border-radius:var(--r-hero-a); } to { border-radius:var(--r-hero-b); } }
    @keyframes morph2 { 0% { border-radius:var(--r-cloud); transform:rotate(0); } 100% { border-radius:var(--r-leaf); transform:rotate(24deg); } }
    @keyframes drift { 0% { transform:translate3d(-3%,0,0) scale(1); } 50% { transform:translate3d(5%,4%,0) scale(1.08); } 100% { transform:translate3d(-2%,6%,0) scale(1.02); } }
    @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes breathe { 0%,100% { transform:scale(.92); opacity:.8; } 50% { transform:scale(1.06); opacity:1; } }
    @keyframes ripple { 0%,100% { transform:scale(.94); opacity:.5; } 50% { transform:scale(1.04); opacity:1; } }
    @keyframes flap { 0%,100% { transform:scaleX(1); } 50% { transform:scaleX(.7); } }
    @keyframes sway { from { transform:rotate(-3deg); } to { transform:rotate(3deg); } }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes mm1 { 0% { opacity:0; } 6%,24% { opacity:1; } 32%,100% { opacity:0; } }
    @keyframes mm2 { 0%,26% { opacity:0; } 36%,56% { opacity:1; } 64%,100% { opacity:0; } }
    @keyframes mm3 { 0%,58% { opacity:0; transform:scale(.82); } 72%,92% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(1.04); } }

    /* ---------- Articles chrome helpers ---------- */
    .article-nav { margin-left:auto; }

    /* ---------- Responsive ---------- */
    @media (max-width:900px) {
      .why .container, .fork .container, .change .container, .support .container, .contact-card { grid-template-columns:1fr; }
      .why-art { width:min(60%,260px); }
      .eyes { width:min(78%,340px); margin-inline:auto; }
      .shift { width:min(64%,280px); }
      .support-art { order:2; }
      .support-body { margin-left:0; }
      .story-body { margin-left:0; }
      .free .container { grid-template-columns:1fr; justify-items:center; text-align:center; }
      .free .lead { margin-inline:auto; }
      .c1, .c2, .c3 { grid-template-columns:1fr; padding-left:0; }
      .c1 .photo { width:min(86%,420px); }
      .c2 .photo { order:0; width:min(64%,300px); margin-left:auto; }
      .c3 .photo { width:min(72%,340px); transform:none; }
      .c3 .chap-text { padding-left:0; }
      .c4 .photo { width:100%; aspect-ratio:4/3; }
      .c4 .chap-text { width:92%; margin-top:-48px; justify-self:center; }
      .paths { grid-template-columns:1fr; }
      .path-no { margin-top:0; }
      .thought:nth-child(2), .thought:nth-child(4) { margin-left:8vw; }
    }
    @media (max-width:560px) {
      .container { width:calc(100% - 32px); }
      .brand { max-width:150px; font-size:.86rem; }
      .language-select { padding:0 6px; }
      .hero-photo { height:clamp(420px,72svh,620px); --r-hero-a:46% 40% 44% 42% / 30% 28% 32% 30%; --r-hero-b:40% 46% 40% 46% / 28% 32% 28% 32%; }
      .quote-card i { filter:blur(36px); }
      .glass, .site-header, .farewell { -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
    }
    @media (prefers-reduced-motion:reduce) {
      html { scroll-behavior:auto; }
      *, *::before, *::after { animation-duration:.01ms!important; animation-iteration-count:1!important; animation-delay:0s!important; transition-duration:.01ms!important; transition-delay:0s!important; }
      .mm .s1, .mm .s2 { display:none; }
      .mm .s3 { opacity:1; }
      .quote-stroke path { stroke-dashoffset:0; }
      .scroll-progress { animation:none!important; }
    }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <a class="skip" href="#main" data-i18n="skip"></a>
  <header class="site-header" id="top">
    <div class="header-inner">
      <a class="brand" href="#top" data-i18n-aria="brandAria"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" width="35" height="35" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><rect width="48" height="14" fill="#cfe0f5"/><rect y="14" width="48" height="10" fill="#dce8f8"/><rect y="24" width="48" height="8" fill="#e8ecf9"/><circle cx="37" cy="11" r="4.6" fill="#fff" opacity=".85"/><path d="M-2 31 13 12l8 9 8-12 21 22z" fill="#aab9e4"/><path d="M9.7 16 13 12l3.6 4-1.8-1.1-1.6 1.7-1.6-1.7zM25.9 13.6 29 9l4.6 4.6-2.3-1.2-2.1 2-1.6-1.9z" fill="#fff" opacity=".93"/><path d="M-2 31v-4l8-5 9 9zM19 31l11-9 10 6 10-4v7z" fill="#7f9fd3"/><rect y="31" width="48" height="17" fill="#86c4bc"/><rect y="31" width="48" height="6" fill="#c3e2e0" opacity=".55"/><path d="M12 34.5h9M27 37.5h11M8 40h7" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".6"/><path d="M-2 48v-8c8-4 15-1 22 3 8 4 18 3 30-2v7z" fill="#8ec99b"/><path d="M14 48c10-3 22-2 36-7v7z" fill="#64aa8b"/><path d="M36 46.5l-.6-4.2M39 46.5l.3-5M42 46.5l1.3-4" stroke="#4f9a7a" stroke-width="1" stroke-linecap="round" fill="none"/></svg></span><span data-i18n="brand"></span></a>
      <div class="header-actions">
        <label class="sr-only" for="language" data-i18n="languageLabel"></label>
        <select class="language-select" id="language">
          <option value="ru" lang="ru">RU</option><option value="en" lang="en">EN</option><option value="fr" lang="fr">FR</option>
        </select>
        <button class="icon-button" type="button" id="theme-toggle" data-i18n-aria="themeDark">
          <svg class="theme-icon-moon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.6 15.2A8.5 8.5 0 0 1 8.8 3.4 8.5 8.5 0 1 0 20.6 15.2Z"/></svg>
          <svg class="theme-icon-sun" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <!-- 1. The photograph arrives first -->
    <section class="hero" id="hero">
      <h1 class="sr-only" data-i18n="meta.title"></h1>
      <div class="hero-stage">
        <figure class="photo hero-photo">
          <img data-photo="portrait" data-i18n-alt="hero.alt" alt="" fetchpriority="high" decoding="async">
          <div class="ph" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="32" cy="22" r="10"/><path d="M10 58c1-14 9-22 22-22s21 8 22 22"/></svg><span data-i18n="photoSoon"></span></div>
        </figure>
        <div class="hero-tag glass"><strong data-i18n="portraitName"></strong><span data-i18n="portraitJob"></span></div>
      </div>
      <p class="hero-hint"><i aria-hidden="true"></i><span data-i18n="hero.hint"></span></p>
    </section>

    <!-- 2. Her quote -->
    <section class="quote q-a">
      <div class="quote-card"><i></i><i></i><i></i>
        <blockquote class="quote-text" data-write data-i18n="quotes.a"></blockquote>
        <svg class="quote-stroke" viewBox="0 0 300 18" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M2 11 C40 2 72 17 112 9 S190 3 232 10 S282 15 298 7"/></svg>
      </div>
    </section>

    <!-- 3. About this site: intuition in sport -->
    <section class="sec story" id="story" aria-labelledby="story-title">
      <div class="container">
        <div class="ripple" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="story-body">
          <h2 class="title" id="story-title" data-fade data-i18n="story.title"></h2>
          <p class="lead" data-fade style="--d:.15s" data-i18n="story.p1"></p>
          <p class="mid" data-fade style="--d:.1s" data-i18n="story.p2"></p>
          <p class="lead" data-fade style="--d:.1s" data-i18n="story.p3"></p>
        </div>
      </div>
    </section>

    <!-- 4. For the person who is drawn here -->
    <section class="sec client" id="client" aria-labelledby="client-title">
      <div class="container">
        <div class="client-head"><h2 class="title" id="client-title" data-fade data-i18n="client.title"></h2></div>
        <div class="thoughts">
          <p class="thought glass" data-fade data-i18n="client.l1"></p>
          <p class="thought glass" data-fade style="--d:.2s" data-i18n="client.l2"></p>
          <p class="thought glass" data-fade style="--d:.1s" data-i18n="client.l3"></p>
          <p class="thought glass" data-fade style="--d:.3s" data-i18n="client.l4"></p>
        </div>
        <p class="client-note" data-fade data-i18n="client.note"></p>
      </div>
    </section>

    <!-- 5. Why she works with athletes -->
    <section class="sec why" id="why" aria-labelledby="why-title">
      <div class="container">
        <div class="why-art" aria-hidden="true"><i></i><i></i></div>
        <div class="why-body">
          <h2 class="title" id="why-title" data-fade data-i18n="why.title"></h2>
          <p class="lead" data-fade style="--d:.15s" data-i18n="why.text"></p>
        </div>
      </div>
    </section>

    <div class="farewell-card glass">
      <h2 id="farewell-title" data-i18n="fork.farewellTitle"></h2>

      <button class="button button-outline" type="button" id="farewell-back" data-i18n="fork.farewellBack"></button>

  <script>
    'use strict';
    // Contact channels and the form endpoint are injected by scripts/build.py from content/site.json.
    const SETTINGS = { email:'', whatsapp:'', telegram:'', bookingUrl:'', formEndpoint:'' };
    const translations = { ru:{}, en:{}, fr:{} };
    // @@CMS_INJECTION@@

    const $ = (selector, scope) => (scope || document).querySelector(selector);
    const $$ = (selector, scope) => [...(scope || document).querySelectorAll(selector)];
    const root = document.documentElement;
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const hasObserver = 'IntersectionObserver' in window;
    const langSelect = $('#language');
    const themeButton = $('#theme-toggle');
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    let lang = 'ru';

    function store(key, value) { try { localStorage.setItem(key, value); } catch (_) {} }
    function retrieve(key) { try { return localStorage.getItem(key); } catch (_) { return null; } }
    function t(key) {
      const own = translations[lang][key];
      if (typeof own === 'string') return own;
      const fallback = translations.ru[key];
      return typeof fallback === 'string' ? fallback : '';
    }

    /* ---------- Theme ---------- */
    function syncTheme() {
      const dark = root.dataset.theme === 'dark';
      themeButton.setAttribute('aria-label', t(dark ? 'themeLight' : 'themeDark'));
      themeButton.title = t(dark ? 'themeLight' : 'themeDark');
      themeButton.setAttribute('aria-pressed', String(dark));
      $('#theme-color').content = dark ? '#0e1f34' : '#f5f9fc';
    }
    themeButton.addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      store('sport-site-theme', next);
      syncTheme();
    });
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
      if (retrieve('sport-site-theme') === null) { root.dataset.theme = event.matches ? 'dark' : 'light'; syncTheme(); }
    });

    /* ---------- Handwriting: each quote is written letter by letter ---------- */
    function splitWrite(element) {
      const text = t(element.dataset.i18n).trim();
      const readable = document.createElement('span');
      readable.className = 'sr-only';
      readable.textContent = text;
      const visual = document.createElement('span');
      visual.setAttribute('aria-hidden', 'true');
      let count = 0;
      text.split('\n').forEach((line, lineIndex) => {
        if (lineIndex) visual.append(document.createElement('br'));
        line.split(/[^\S\u00a0]+/).filter(Boolean).forEach((word, wordIndex) => {
          if (wordIndex) visual.append(' ');
          const wrapper = document.createElement('span');
          wrapper.className = 'w';
          for (const character of word) {
            const letter = document.createElement('span');
            letter.className = 'ch';
            letter.style.setProperty('--i', count++);
            letter.textContent = character;
            wrapper.append(letter);
          }
          visual.append(wrapper);
        });
      });
      element.replaceChildren(readable, visual);
      const step = Math.max(16, Math.min(54, 3000 / Math.max(count, 1)));
      element.style.setProperty('--step', step.toFixed(1) + 'ms');
      element.parentElement.style.setProperty('--stroke-delay', Math.round(count * step + 500) + 'ms');   // the flourish is drawn last
      element.classList.add('is-split');
      if (reduceMotion || !hasObserver) element.classList.add('is-written');
    }
    function watch(selector, className, options) {
      const nodes = $$(selector);
      if (!hasObserver || (reduceMotion && className === 'is-written')) { nodes.forEach(node => node.classList.add(className)); return; }
      const observer = new IntersectionObserver(entries => entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add(className);
        observer.unobserve(entry.target);
      }), options);
      nodes.forEach(node => observer.observe(node));
    }

    /* ---------- Language ---------- */
    function applyLanguage(next) {
      lang = translations[next] ? next : 'ru';
      root.lang = lang;
      langSelect.value = lang;
      document.title = t('meta.fullTitle');
      $('meta[name="description"]').content = t('meta.description');
      $('meta[property="og:title"]').content = t('meta.fullTitle');
      $('meta[property="og:description"]').content = t('meta.description');
      $$('[data-i18n]').forEach(node => { node.textContent = t(node.dataset.i18n); });
      $$('[data-i18n-aria]').forEach(node => node.setAttribute('aria-label', t(node.dataset.i18nAria)));
      $$('[data-i18n-alt]').forEach(node => { node.alt = t(node.dataset.i18nAlt); });
      $$('[data-faq]').forEach(node => { node.hidden = !t('faq.q' + node.dataset.faq).trim(); });
      $$('[data-post-lang]').forEach(node => { node.hidden = node.dataset.postLang !== lang; });
      const notes = $('#notes');
      if (notes) notes.hidden = !(CMS_VISIBLE_POSTS[lang] > 0);
      const allLink = $('#notes-all');
      if (allLink) allLink.href = lang + '/articles/';
      $('#form-status').textContent = '';
      syncTheme();
      $$('[data-write]').forEach(splitWrite);
    }
    const savedLang = retrieve('sport-site-lang');
    const deviceLang = (navigator.language || 'ru').slice(0, 2).toLowerCase();
    applyLanguage(translations[savedLang] ? savedLang : (translations[deviceLang] ? deviceLang : 'ru'));
    langSelect.addEventListener('change', () => { store('sport-site-lang', langSelect.value); applyLanguage(langSelect.value); });
    $('#year').textContent = String(new Date().getFullYear());

    watch('[data-write]', 'is-written', { threshold: .4, rootMargin: '0px 0px -8% 0px' });
    watch('[data-fade]', 'in', { threshold: .15, rootMargin: '0px 0px -6% 0px' });

    /* ---------- Photos: placeholders stay until a real image loads ---------- */
    $$('.photo').forEach(frame => {
      const image = $('img', frame);
      if (!image || !image.getAttribute('src')) return;
      const loaded = () => { if (image.naturalWidth > 0) frame.classList.add('has-photo'); };
      image.addEventListener('load', loaded);
      image.addEventListener('error', () => frame.classList.remove('has-photo'));
      if (image.complete) loaded();
    });

    /* ---------- A soft light that follows the pointer ---------- */
    if (!reduceMotion && matchMedia('(hover: hover) and (pointer: fine)').matches) {
      const aura = $('.aura');
      let x = innerWidth / 2, y = innerHeight / 3, targetX = x, targetY = y, frame = 0;
      const follow = () => {
        x += (targetX - x) * .08; y += (targetY - y) * .08;
        aura.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
        frame = Math.abs(targetX - x) + Math.abs(targetY - y) > .5 ? requestAnimationFrame(follow) : 0;
      };
      addEventListener('pointermove', event => {
        targetX = event.clientX; targetY = event.clientY; aura.style.opacity = '1';
        if (!frame) frame = requestAnimationFrame(follow);
      }, { passive: true });
    }

    /* ---------- The fork: "not yet" closes the page gently ---------- */
    const farewell = $('#farewell');
    const frozen = ['header', 'main', 'footer'].map(selector => $(selector));
    function setFarewell(open) {
      farewell.hidden = !open;
      frozen.forEach(node => { if (node) node.inert = open; });
      if (open) farewell.focus(); else $('#close-page').focus({ preventScroll: true });
    }
    $('#close-page').addEventListener('click', () => {
      window.close();                                    // works only for tabs opened by a script
      setTimeout(() => { if (!window.closed) setFarewell(true); }, 250);
    });
    $('#farewell-back').addEventListener('click', () => setFarewell(false));
    addEventListener('keydown', event => { if (event.key === 'Escape' && !farewell.hidden) setFarewell(false); });

    /* ---------- Contact links: only genuinely configured channels are shown ---------- */
    const links = {
      email: EMAIL_RE.test(SETTINGS.email.trim()) ? 'mailto:' + SETTINGS.email.trim() : '',
      whatsapp: /^\d{7,15}$/.test(SETTINGS.whatsapp.trim()) ? 'https://wa.me/' + SETTINGS.whatsapp.trim() : '',
      telegram: /^[A-Za-z0-9_]{5,32}$/.test(SETTINGS.telegram.trim()) ? 'https://t.me/' + SETTINGS.telegram.trim() : '',
      booking: /^https:\/\//i.test(SETTINGS.bookingUrl.trim()) ? SETTINGS.bookingUrl.trim() : ''
    };
    Object.entries(links).forEach(([key, url]) => {
      const link = $('#contact-' + key);
      if (link && url) { link.href = url; link.hidden = false; }
    });
    $('.contact-links').hidden = !Object.values(links).some(Boolean);

    /* ---------- Contact form: delivered to the inbox by a form service ---------- */
    const form = $('#contact-form');
    const statusLine = $('#form-status');
    const sendButton = $('#form-send');
    const endpoint = /^https:\/\//i.test(SETTINGS.formEndpoint.trim()) ? SETTINGS.formEndpoint.trim() : '';
    function say(key, isError) { statusLine.textContent = key ? t(key) : ''; statusLine.classList.toggle('is-error', !!isError); }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const data = new FormData(form);
      if (data.get('_gotcha')) return;                                  // honeypot: only bots fill it in
      const name = String(data.get('name') || '').trim();
      const contact = String(data.get('contact') || '').trim();
      const message = String(data.get('message') || '').trim();
      if (!name || !contact) {
        say('formRequired', true);
        form.elements.namedItem(name ? 'contact' : 'name').focus();
        return;
      }
      const payload = { name, contact, message, language: lang, _subject: t('formSubject') + ' — ' + name };
      if (EMAIL_RE.test(contact)) { payload.email = contact; payload._replyto = contact; }
      if (!endpoint) {                                                  // no form service configured: use the mail client
        if (links.email) {
          location.href = links.email + '?subject=' + encodeURIComponent(payload._subject) + '&body=' + encodeURIComponent(name + ' — ' + contact + '\n\n' + message);
          say('formMailto');
        } else say('formUnset', true);
        return;
      }
      sendButton.disabled = true;
      say('formSending');
      try {
        const response = await fetch(endpoint, { method:'POST', headers:{ 'Content-Type':'application/json', 'Accept':'application/json' }, body:JSON.stringify(payload) });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        form.reset();
        form.hidden = true;
        $('#form-sent').hidden = false;
      } catch (_) {
        say('formError', true);
        sendButton.disabled = false;
      }
    });
  </script>
</body>
</html>
