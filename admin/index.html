<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Панель управления · Sport Intuitive</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
/* Панель: тихая, светлая, без украшений. Один акцент, тонкие линии, ничего не «парит». */
:root{--bg:#f7f5f0;--card:#fff;--soft:#f1eee6;--ink:#14263a;--muted:#667a8c;--line:#e3ded2;--blue:#2f6fb3;--blue-d:#245f9c;--green:#1f7a67;--hi:#8dbdf0;--mint:#6fd2b8;--warn:#a85a00;--bad:#b3261e;--sun:#ffd23f;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--serif:"Source Serif 4",Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html{scroll-padding-top:110px}
body{margin:0;font:15px/1.55 var(--sans);color:var(--ink);background:var(--bg);padding-bottom:88px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--blue-d)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---- верх и вкладки ---- */
.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.top-in{width:min(1040px,100%);margin:0 auto;padding:10px clamp(14px,3vw,24px) 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.brand{font:600 1.05rem/1.2 var(--serif)}.brand small{font:500 .8rem var(--sans);color:var(--muted);margin-left:10px}
.grow{flex:1}
.top a.lnk,.top button.lnk{color:var(--muted);background:none;border:0;cursor:pointer;font-size:.88rem;text-decoration:none;padding:6px 8px;border-radius:6px}
.top a.lnk:hover,.top button.lnk:hover{color:var(--ink);background:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;color:var(--muted)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:#b5c0c9}
.chip.ok::before{background:var(--green)}.chip.work::before{background:var(--sun);animation:pulse 1.1s infinite}.chip.bad::before{background:var(--bad)}
@keyframes pulse{50%{opacity:.25}}
.tabs{width:min(1040px,100%);margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 clamp(14px,3vw,24px);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:11px 12px 10px;color:var(--muted);font-weight:600}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.tabs .n{min-width:20px;padding:0 6px;border-radius:10px;background:var(--sun);color:#111;font-size:.74rem;font-weight:800;text-align:center;line-height:20px}
.tabs .n.green{background:var(--green);color:#fff}

/* ---- содержимое ---- */
main{width:min(1040px,100%);margin:0 auto;padding:clamp(18px,3vw,32px) clamp(14px,3vw,24px)}
h1{font:600 clamp(1.5rem,3vw,1.9rem)/1.2 var(--serif);margin:0 0 6px}
h2{font:600 1.1rem/1.3 var(--serif);margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 18px;max-width:64ch}
.note{padding:12px 16px;margin:0 0 16px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px}
.note.ok{border-left-color:var(--green)}.note.warn{border-left-color:var(--sun);background:#fffbea}.note.bad{border-left-color:var(--bad);background:#fdf1f0}
.note ul{margin:6px 0 0;padding-left:20px}
.notice-wrap{width:min(1040px,100%);margin:0 auto;padding:18px clamp(14px,3vw,24px) 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.box>h2:first-child{margin-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.muted{color:var(--muted);font-size:.9rem}

/* ---- кнопки: одна тёмная, остальные контурные ---- */
button.btn,a.btn,label.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;transition:background-color .15s,border-color .15s}
button.btn:hover,a.btn:hover,label.btn:hover{background:#27415c;border-color:#27415c}
button.btn.ghost,a.btn.ghost,label.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
button.btn.ghost:hover,a.btn.ghost:hover,label.btn.ghost:hover{background:var(--soft);border-color:#cfc9ba}
button.btn.danger{background:#fff;color:var(--bad);border-color:var(--line)}
button.btn.danger:hover{background:#fdf1f0;border-color:#e6b9b5}
button.btn.small,label.btn.small,a.btn.small{padding:6px 12px;font-size:.86rem}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}

/* ---- фотографии: семь строк ---- */
.photo-list{display:grid;gap:10px;margin-top:14px}
.photo-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.photo-row.drop{border-color:var(--blue);background:#f2f7fc}
.thumb{width:72px;height:90px;border-radius:6px;background:var(--soft);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.78rem}
.thumb img{width:100%;height:100%;object-fit:cover}
.photo-row h3{margin:0;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.photo-row p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.num{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--sun);color:#111;font:800 .85rem/1 var(--sans)}
.tag{font-size:.74rem;font-weight:600;padding:1px 8px;border-radius:8px;background:var(--soft);color:var(--muted)}
.tag.new{background:#fff3cf;color:var(--warn)}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
details.more{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 16px}
details.more>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+";display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--blue-d);font-weight:800}
details.more[open]>summary::before{content:"–"}
details.more .inner{padding:0 16px 16px}

/* ---- тексты ---- */
.bar2{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.bar2 input[type=search]{flex:1;min-width:220px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#fff}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
details.sec>summary{cursor:pointer;padding:14px 18px;font-weight:650;display:flex;gap:12px;align-items:center;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);margin:0 4px 0 2px;transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(45deg)}
details.sec>summary .go{margin-left:auto;font-weight:500;font-size:.84rem}
.dot{background:var(--sun);color:#111;font-size:.74rem;padding:0 8px;font-weight:800;border-radius:10px;line-height:18px}
.flds{padding:2px 18px 18px;display:grid;gap:16px}
.fld{border-left:3px solid transparent;padding-left:12px}
.fld.chg{border-left-color:var(--sun)}
.fld label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;margin-bottom:5px}
.fld .req{color:var(--bad)}
.fld .undo{margin-left:auto;font-weight:500;font-size:.8rem;background:none;border:0;color:var(--blue-d);cursor:pointer;padding:2px 8px;border-radius:6px}
.fld .undo:hover{background:var(--soft)}
.fld .hint{font-size:.82rem;color:var(--muted);margin:5px 0 0}
.fld input[type=text],.fld textarea,.fld input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.fld textarea{resize:vertical;line-height:1.6}
.fld input:focus,.fld textarea:focus{border-color:var(--blue);outline:2px solid rgba(47,111,179,.15);outline-offset:0}
.group{margin-bottom:16px}
.group .flds{padding:0;max-width:720px}
.chk{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--green)}

/* ---- страница: разделы и блоки ---- */
.subh{font:600 1.02rem/1.3 var(--serif);margin:22px 0 10px;color:var(--ink)}
h2.subh:first-of-type{margin-top:6px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.pcard.fixed{background:#fbfaf6}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 12px}
.ptitle{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;text-align:left;padding:8px 4px;font-weight:650;font-size:1rem;color:var(--ink)}
.ptitle::before{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);margin:0 4px 0 2px;transition:transform .15s}
.ptitle[aria-expanded=true]::before{transform:rotate(45deg)}
.ptitle small{font-weight:500;color:var(--muted);font-size:.8rem}
.phead .go{font-size:.84rem}
.ctl{display:inline-flex;align-items:center;gap:6px}
.pos{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:600}
button.mini{min-width:36px;padding:5px 9px}
.pbody{padding:2px 18px 18px;border-top:1px solid var(--line)}
.blk{border:1px solid var(--line);border-radius:10px;background:#fcfbf8;margin:12px 0;padding:12px 14px}
.bhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:10px}
.bhead .bname{font-weight:650}
.bhead .bprev{flex:1;min-width:100px;color:var(--muted);font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 0}
.gap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0}
.gap>.btn{opacity:.78}.gap>.btn:hover,.gap>.btn:focus-visible{opacity:1}
.gapmenu{display:inline-flex;flex-wrap:wrap;gap:6px}
.grip{border:0;background:none;cursor:grab;color:var(--muted);font-size:1.1rem;line-height:1;padding:4px 6px;border-radius:6px}
.grip:hover{background:var(--soft)}
.dragging{opacity:.45}
.drop-before{box-shadow:0 -3px 0 var(--blue)}
.drop-after{box-shadow:0 3px 0 var(--blue)}
.strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px}
.strip .chipbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.84rem;font-weight:600;color:var(--ink)}
.strip .chipbtn:hover{background:var(--soft)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(20,38,58,.55);display:grid;place-items:center;padding:16px}
.mbox{background:#fff;border-radius:12px;max-width:760px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:16px 18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.mhead h2{margin:0;font-size:1.1rem}
.lrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
.pitem{border:2px solid var(--line);border-radius:10px;background:#fff;padding:0;cursor:pointer;overflow:hidden;text-align:left}
.pitem.on{border-color:var(--blue)}.pitem img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.pitem span{display:block;padding:4px 8px;font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptiles{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.ptile{width:170px}.plabel{font-size:.82rem;font-weight:600;margin-bottom:6px}
.pframe{width:100%;background:var(--soft);border-radius:8px;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.8rem;position:relative}
.pframe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.ptile .acts{justify-content:flex-start;margin-top:8px}
.cframe{position:relative;margin:12px auto;overflow:hidden;border-radius:8px;background:var(--soft);cursor:grab;touch-action:none}
.cframe.grab{cursor:grabbing}
.cframe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;user-select:none;pointer-events:none}
.crow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:10px 0}
.crow input[type=range]{flex:1;min-width:140px;max-width:300px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.ltile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;align-content:start}
.lthumb{aspect-ratio:4/5;background:var(--soft);border-radius:6px;overflow:hidden}.lthumb img{width:100%;height:100%;object-fit:cover;display:block}
.lmeta{display:grid;gap:3px;font-size:.82rem;color:var(--muted);word-break:break-all}.lmeta b{color:var(--ink);font-size:.86rem}.lmeta .use{color:var(--green)}
.libdrop{outline:3px dashed var(--blue);outline-offset:4px}
.fld select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.fld input[type=search]{width:100%}

/* ---- заявки ---- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.filters .pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 12px;font-weight:600;cursor:pointer}
.filters .pill:hover{background:var(--soft)}
.filters .pill[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters .pill b{font-weight:700;font-size:.78rem;background:rgba(20,38,58,.08);border-radius:10px;padding:0 7px}
.filters .pill[aria-pressed=true] b{background:rgba(255,255,255,.2)}
.filters input[type=search]{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.rq{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;display:grid;gap:10px}
.rq.is-new{border-left:3px solid var(--green)}
.rq-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.rq-head b{font-size:1.02rem}
.rq-head .when{margin-left:auto;color:var(--muted);font-size:.84rem}
.rq-contact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rq-contact code{font-size:.92rem;word-break:break-all}
.rq-msg{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border-radius:8px;padding:10px 12px;line-height:1.6}
.rq-msg.empty{color:var(--muted);font-style:italic}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--soft);border-radius:8px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,38,58,.12)}
.seg button[data-s=new][aria-pressed=true]{background:var(--green);color:#fff}
.seg button[data-s=work][aria-pressed=true]{background:var(--sun);color:#111}
.rq textarea{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:40px;resize:vertical}
.rq-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 14px;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:.85rem}
code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:.9em}
.login{max-width:680px}
.login ol{padding-left:22px}.login li{margin-bottom:8px}
.login input[type=password],.login input[type=text]{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;margin:6px 0 14px;background:#fff}
.pub{max-width:760px}

/* ---- панель сохранения: простая полоса внизу ---- */
.save{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px max(clamp(14px,3vw,24px),calc((100vw - 1040px) / 2 + 24px))}
.save .msg{font-weight:600}.save .msg small{display:block;font-weight:400;color:var(--muted)}
@media (max-width:620px){.phead .go{display:none}.pbody{padding:2px 12px 14px}.brand small{display:none}.photo-row{grid-template-columns:56px minmax(0,1fr)}.thumb{width:56px;height:70px}.photo-row .acts{grid-column:1/-1;justify-content:flex-start}.save .row{width:100%;margin:0}.save .btn{flex:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function (root) {
'use strict';
/* ================= core: GitHub access, state, saving (no DOM here, so it can be tested) ================= */
const API = 'https://api.github.com';
const LS = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const S = { schema: null, token: '', repo: '', branch: 'main', site: {}, home: {}, page: { sections: [] }, uid: 0, raw: {}, orig: { site: {}, home: {}, page: { sections: [] } },
            pending: {}, tab: 'photos', lang: 'en', filter: '', run: null, busy: '', notice: null, dirty: 0,
            open: new Set(), req: { items: null, loaded: false, loading: false, error: '', code: '', keyProblem: '', filter: 'new', q: '' } };
const clone = o => JSON.parse(JSON.stringify(o));
S.lib = { items: null, loading: false, error: '' }; S.deleted = new Set();
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const getv = (obj, group, name) => ((obj && obj[group] && obj[group][name]) || '');
function setv(obj, group, name, value) { if (!obj[group]) obj[group] = {}; obj[group][name] = value; }

function ghError(status, message) { const e = new Error(message || ''); e.status = status; return e; }
function explain(e) {
  if (e.conflict) return 'Сайт уже изменили в другом месте (например, в Pages CMS). Чтобы ничего не затереть, ничего не сохранено. Обновите страницу и повторите правки.';
  if (e.status === 401) return 'GitHub не принял токен: он неверный или истёк. Войдите заново с новым токеном.';
  if (e.status === 403) return 'У токена не хватает прав. Нужны: Contents — Read and write, Actions — Read-only.';
  if (e.status === 404) return 'Репозиторий или файл не найден. Проверьте, что токен выдан именно на репозиторий сайта.';
  if (e.status === 409 || e.status === 422) return 'GitHub отклонил сохранение: сайт уже изменился. Обновите страницу и повторите правки.';
  return e.message || 'Что-то пошло не так.';
}

async function gh(path, opts) {
  const o = opts || {};
  const headers = { Authorization: 'Bearer ' + S.token, 'X-GitHub-Api-Version': '2022-11-28',
                    Accept: o.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json' };
  if (o.body) headers['Content-Type'] = 'application/json';
  let r;
  try {
    r = await fetch(API + path, { method: o.method || 'GET', headers, body: o.body ? JSON.stringify(o.body) : undefined, cache: 'no-store' });
  } catch (e) { throw ghError(0, 'Нет связи с GitHub. Проверьте интернет и попробуйте ещё раз.'); }
  if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch (e) {} throw ghError(r.status, m); }
  if (o.raw) return r.text();
  return r.status === 204 ? null : r.json();
}
const readFile = path => gh(`/repos/${S.repo}/contents/${enc(path)}?ref=${encodeURIComponent(S.branch)}`, { raw: true });

async function loadAll() {

  };

    el('header', { class: 'top' }, el('div', { class: 'top-in', style: 'padding-bottom:12px' }, el('div', { class: 'brand' }, brand, el('small', {}, 'Панель управления')))),
    el('main', { class: 'login' }, el('h1', {}, 'Вход'),
      el('p', { class: 'lead' }, 'Панель работает через ваш GitHub: правки сохраняются в репозитории сайта, а сайт обновляется сам. Войти нужно один раз на каждом устройстве.'),
      message ? el('div', { class: 'note bad' }, message) : null,
      el('div', { class: 'box' }, el('h2', {}, 'Как получить ключ доступа (токен)'),
        el('ol', {},
          el('li', {}, 'Откройте ', el('a', { href: 'https://github.com/settings/personal-access-tokens/new', target: '_blank', rel: 'noopener' }, 'страницу создания токена на GitHub ↗'), ' и войдите в свой аккаунт.'),
          el('li', {}, 'Название: «Панель сайта». Срок действия: самый длинный. Запишите в календарь, когда он закончится.'),
          el('li', {}, 'В разделе ', el('code', {}, 'Repository access'), ' выберите ', el('code', {}, 'Only select repositories'), ' и отметьте репозиторий сайта.'),
          el('li', {}, 'В разделе ', el('code', {}, 'Repository permissions'), ' поставьте ', el('code', {}, 'Contents: Read and write'), ' и ', el('code', {}, 'Actions: Read-only'), '.'),
          el('li', {}, 'Нажмите ', el('code', {}, 'Generate token'), ', скопируйте ключ (он показывается один раз) и вставьте ниже.')),
        el('label', { for: 'token' }, el('strong', {}, 'Токен')), token,
        S.schema && S.schema.repo ? null : [el('label', { for: 'repo' }, el('strong', {}, 'Репозиторий')), repo],
        el('button', { class: 'btn', onclick: go }, 'Войти'),
        el('p', { class: 'muted', style: 'margin-bottom:0' }, 'Токен хранится только в этом браузере и даёт доступ лишь к одному репозиторию. Кнопка «Выйти» стирает его. Если что-то пошло не так, токен можно отозвать на GitHub в один клик.'))));
  token.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

async function boot() {
  try { S.schema = await (await fetch('schema.json', { cache: 'no-store' })).json(); }
  catch (e) { app.replaceChildren(el('main', {}, el('div', { class: 'note bad' }, 'Не удалось загрузить настройки панели (schema.json). Панель работает только на опубликованном сайте, а не при открытии файла с диска.'))); return; }
  S.repo = S.schema.repo || LS.get('si-admin-repo'); S.branch = S.schema.branch || 'main';
  S.token = LS.get('si-admin-token');
  if (S.token && S.repo) enter(); else renderLogin('');
}
window.addEventListener('beforeunload', e => { if (S.dirty || S.busy) { e.preventDefault(); e.returnValue = ''; } });
boot();
})(typeof window !== 'undefined' ? window : globalThis);
</script>
