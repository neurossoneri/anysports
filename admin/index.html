<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Панель управления · Sport Intuitive</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
/* Панель в стиле сайта: тёплый песок, холодные синий и зелёный, мягкие формы, кнопки «парят» над страницей. */
:root{--abyss:#06121e;--deep:#0c2a3d;--bg:#eee9dd;--card:#fffdf9;--soft:#f5f0e4;--ink:#10243a;--muted:#5a7084;--blue:#2f6fb3;--blue-d:#245f9c;--green:#1f8a74;--hi:#8dbdf0;--mint:#6fd2b8;--line:rgba(16,36,58,.14);--warn:#a85a00;--bad:#b3261e;--sun:#ffd23f;
  --shadow:0 22px 44px -28px rgba(6,18,30,.5),0 4px 12px -6px rgba(6,18,30,.16);--float:0 1px 0 rgba(255,255,255,.35) inset,0 14px 26px -14px rgba(6,18,30,.5),0 3px 8px -3px rgba(6,18,30,.22);--float-hi:0 1px 0 rgba(255,255,255,.4) inset,0 22px 34px -14px rgba(6,18,30,.55),0 8px 14px -6px rgba(6,18,30,.25);
  --ease:cubic-bezier(.16,1,.3,1);--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--serif:"Source Serif 4",Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html{scroll-padding-top:130px}
body{margin:0;font:16px/1.55 var(--sans);color:var(--ink);padding-bottom:130px;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 520px at 100% -8%,rgba(47,111,179,.11),transparent 62%),radial-gradient(760px 460px at -8% 0%,rgba(31,138,116,.09),transparent 62%),var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--blue-d)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- верхняя панель и вкладки ---- */
.top{position:sticky;top:0;z-index:50;background:rgba(6,18,30,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#e8f0f7;box-shadow:0 14px 30px -22px rgba(0,0,0,.8)}
.top-in{width:min(1120px,100%);margin:0 auto;padding:12px clamp(14px,3vw,28px) 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brand{font:600 1.18rem/1.2 var(--serif);letter-spacing:.01em}.brand small{font:500 .82rem var(--sans);color:var(--hi);margin-left:10px;letter-spacing:0}
.grow{flex:1}
.top a.lnk,.top button.lnk{color:#cfe3f7;background:none;border:0;cursor:pointer;font-size:.92rem;text-decoration:none;padding:7px 12px;border-radius:999px;transition:background-color .25s}
.top a.lnk:hover,.top button.lnk:hover{background:rgba(141,189,240,.14);color:#fff}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 13px;font-size:.84rem;font-weight:650;background:rgba(141,189,240,.13);color:#cfe3f7;border-radius:999px}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:#7d93a5}
.chip.ok::before{background:var(--mint)}.chip.work::before{background:var(--sun);animation:pulse 1.1s infinite}.chip.bad::before{background:#ff7b72}
@keyframes pulse{50%{opacity:.25}}
.tabs{width:min(1120px,100%);margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px clamp(14px,3vw,28px) 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;display:inline-flex;align-items:center;gap:9px;border:0;cursor:pointer;padding:10px 18px;border-radius:999px;background:transparent;color:#a9c3d8;font-weight:650;transition:background-color .3s,color .3s,transform .4s var(--ease)}
.tabs button:hover{color:#fff;background:rgba(141,189,240,.12)}
.tabs button[aria-selected=true]{color:#fff;background:linear-gradient(110deg,#2b66ab,#2a8f86 62%,#2f9a7e);box-shadow:0 12px 22px -12px rgba(31,138,116,.9)}
.tabs .n{min-width:22px;padding:1px 7px;border-radius:999px;background:var(--sun);color:#111;font-size:.76rem;font-weight:800;text-align:center}
.tabs .n.green{background:var(--mint)}

/* ---- содержимое ---- */
main{width:min(1120px,100%);margin:0 auto;padding:clamp(20px,3.4vw,40px) clamp(14px,3vw,28px)}
h1{font:600 clamp(1.7rem,3.2vw,2.3rem)/1.15 var(--serif);letter-spacing:-.01em;margin:0 0 8px}
h2{font:600 1.25rem/1.25 var(--serif);margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 24px;max-width:62ch}
.note{padding:14px 18px;margin:0 0 18px;background:var(--card);border-radius:16px;border:1px solid var(--line);border-left:5px solid var(--blue);box-shadow:var(--shadow)}
.note.ok{border-left-color:var(--green)}.note.warn{border-left-color:var(--sun);background:#fff9e0}.note.bad{border-left-color:var(--bad);background:#fdeceb}
.note ul{margin:6px 0 0;padding-left:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px}
.box>h2:first-child{margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.muted{color:var(--muted);font-size:.92rem}

/* ---- кнопки: мягкие, «парят» над страницей ---- */
button.btn,a.btn,label.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;color:#fff;padding:11px 22px;font-weight:650;cursor:pointer;text-decoration:none;text-align:center;
  background:linear-gradient(110deg,#2b66ab,#2a8f86 62%,#2f9a7e);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 16px 28px -14px rgba(31,138,116,.8),0 5px 12px -5px rgba(43,102,171,.5);transition:transform .45s var(--ease),box-shadow .45s var(--ease),filter .25s}
button.btn:hover,a.btn:hover,label.btn:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 1px 0 rgba(255,255,255,.36) inset,0 24px 36px -14px rgba(31,138,116,.85),0 8px 16px -6px rgba(43,102,171,.55)}
button.btn:active,a.btn:active,label.btn:active{transform:translateY(0) scale(.985);transition-duration:.1s}
button.btn.ghost,a.btn.ghost,label.btn.ghost{background:#fff;color:var(--blue-d);border-color:var(--line);box-shadow:var(--float)}
button.btn.ghost:hover,a.btn.ghost:hover,label.btn.ghost:hover{background:#fff;filter:none;box-shadow:var(--float-hi)}
button.btn.danger{background:#fff;color:var(--bad);border-color:rgba(179,38,30,.35);box-shadow:var(--float)}
button.btn.danger:hover{background:#fff;filter:none;box-shadow:var(--float-hi)}
button.btn.small,label.btn.small,a.btn.small{padding:7px 15px;font-size:.88rem}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important;filter:none!important}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}

/* ---- фотографии ---- */
.map{display:grid;gap:8px;margin:0 0 22px}
.map-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px;background:rgba(255,253,249,.7);border:1px solid var(--line);border-radius:14px}
.map-row b{min-width:150px;font-size:.9rem}
.mp{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:4px 12px 4px 5px;font-size:.84rem;cursor:pointer;box-shadow:0 8px 16px -12px rgba(6,18,30,.6);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.mp:hover{transform:translateY(-2px);box-shadow:0 14px 20px -12px rgba(6,18,30,.6)}
.mp i{font:800 .85rem/1 var(--sans);font-style:normal;min-width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--sun);color:#111}
.mp.empty{color:var(--muted)}.mp.empty i{background:#e3dccb}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.card.drop{outline:3px dashed var(--blue);outline-offset:-3px}
.card.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--sun),var(--shadow)}100%{box-shadow:var(--shadow)}}
.pic{position:relative;aspect-ratio:4/5;background:linear-gradient(135deg,#0f3148,#1d5f5b);display:grid;place-items:center;color:var(--hi);overflow:hidden;font-size:.9rem}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.num{position:absolute;left:12px;top:12px;z-index:2;background:var(--sun);color:#111;font:800 1.05rem/1 var(--sans);padding:9px 15px;border-radius:999px;box-shadow:0 10px 20px -8px rgba(0,0,0,.55)}
.tag{position:absolute;right:12px;bottom:12px;z-index:2;background:var(--green);color:#fff;font-size:.78rem;font-weight:700;padding:5px 12px;border-radius:999px;box-shadow:0 8px 16px -8px rgba(0,0,0,.5)}
.tag.new{background:var(--warn)}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:1.05rem}.card p{margin:0;color:var(--muted);font-size:.88rem}
.card .acts{margin-top:auto;padding-top:12px;display:flex;gap:8px;flex-wrap:wrap}
details.more{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 22px;box-shadow:var(--shadow)}
details.more>summary{cursor:pointer;padding:14px 18px;font-weight:650;list-style:none;display:flex;align-items:center;gap:10px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+";display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--blue-d);font-weight:800;transition:transform .3s var(--ease)}
details.more[open]>summary::before{content:"–"}
details.more .inner{padding:0 18px 18px}
.quick select{padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:240px;max-width:100%}
.box.drop{outline:3px dashed var(--blue);outline-offset:-3px}

/* ---- тексты ---- */
.bar2{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:18px}
.bar2 input[type=search]{flex:1;min-width:220px;padding:12px 18px;border:1px solid var(--line);border-radius:999px;background:#fff;box-shadow:var(--float)}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;box-shadow:var(--shadow)}
details.sec>summary{cursor:pointer;padding:16px 20px;font-weight:700;display:flex;gap:12px;align-items:center;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"";width:9px;height:9px;border-right:2.2px solid var(--blue);border-bottom:2.2px solid var(--blue);transform:rotate(-45deg);transition:transform .25s var(--ease);margin:0 4px 0 2px}
details.sec[open]>summary::before{transform:rotate(45deg)}
details.sec>summary .go{margin-left:auto;font-weight:600;font-size:.85rem}
.dot{background:var(--sun);color:#111;font-size:.75rem;padding:1px 9px;font-weight:800;border-radius:999px}
.flds{padding:4px 20px 20px;display:grid;gap:18px}
.fld{border-left:3px solid transparent;padding-left:12px}
.fld.chg{border-left-color:var(--sun)}
.fld label{display:flex;align-items:center;gap:8px;font-weight:650;font-size:.92rem;margin-bottom:5px}
.fld .req{color:var(--bad)}
.fld .undo{margin-left:auto;font-weight:600;font-size:.8rem;background:none;border:0;color:var(--blue-d);cursor:pointer;padding:2px 8px;border-radius:999px}
.fld .undo:hover{background:var(--soft)}
.fld .hint{font-size:.82rem;color:var(--muted);margin:5px 0 0}
.fld input[type=text],.fld textarea,.fld input[type=search]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.fld textarea{resize:vertical;line-height:1.6}
.fld input:focus,.fld textarea:focus{border-color:var(--blue);outline:3px solid rgba(47,111,179,.18);outline-offset:0}
.group{margin-bottom:18px}
.group .flds{padding:0;max-width:760px}
.chk{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:18px;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--green)}

/* ---- заявки ---- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px}
.filters .pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 16px;font-weight:650;cursor:pointer;box-shadow:var(--float);transition:transform .35s var(--ease)}
.filters .pill:hover{transform:translateY(-2px)}
.filters .pill[aria-pressed=true]{background:linear-gradient(110deg,#2b66ab,#2a8f86 62%,#2f9a7e);color:#fff;border-color:transparent}
.filters .pill b{font-weight:800;font-size:.8rem;background:rgba(16,36,58,.1);border-radius:999px;padding:0 8px}
.filters .pill[aria-pressed=true] b{background:rgba(255,255,255,.25)}
.filters input[type=search]{flex:1;min-width:180px;padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:#fff}
.rq{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px;display:grid;gap:10px}
.rq.is-new{border-left:6px solid var(--green)}
.rq-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.rq-head b{font-size:1.08rem}
.rq-head .when{margin-left:auto;color:var(--muted);font-size:.86rem}
.rq-contact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rq-contact code{background:var(--soft);padding:3px 10px;border-radius:999px;font-size:.92rem;word-break:break-all}
.rq-msg{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border-radius:14px;padding:12px 14px;line-height:1.6}
.rq-msg.empty{color:var(--muted);font-style:italic}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--soft);border-radius:999px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:650;color:var(--muted);transition:background-color .25s,color .25s}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 8px 16px -10px rgba(6,18,30,.6)}
.seg button[data-s=new][aria-pressed=true]{background:var(--green);color:#fff}
.seg button[data-s=work][aria-pressed=true]{background:var(--sun);color:#111}
.rq textarea{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-height:44px;resize:vertical}
.rq-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pill-tag{font-size:.76rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 14px;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2b66ab,#2f9a7e);color:#fff;font-weight:800;box-shadow:0 10px 18px -10px rgba(31,138,116,.9)}
code{background:var(--soft);padding:1px 7px;border-radius:8px;font-size:.9em}
.login{max-width:720px}
.login ol{padding-left:22px}.login li{margin-bottom:10px}
.login input[type=password],.login input[type=text]{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:12px;margin:6px 0 16px;background:#fff}
.pub{max-width:820px}

/* ---- панель сохранения: парит над страницей ---- */
.save{position:fixed;left:50%;bottom:16px;z-index:60;width:min(900px,calc(100% - 24px));transform:translateX(-50%);background:rgba(6,18,30,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#e8f0f7;border-radius:22px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:12px 14px 12px 22px;box-shadow:0 30px 50px -22px rgba(0,0,0,.75),0 8px 18px -8px rgba(0,0,0,.45);animation:rise .5s var(--ease)}
@keyframes rise{from{opacity:0;transform:translate(-50%,18px)}}
.save .msg{font-weight:650}.save .msg small{display:block;font-weight:400;color:var(--hi)}
.save .btn.ghost{background:transparent;color:#cfe3f7;border-color:rgba(141,189,240,.4);box-shadow:none}
.save .btn.ghost:hover{background:rgba(141,189,240,.14)}
@media (max-width:620px){.brand small{display:none}.save{padding:12px}.save .row{width:100%;margin:0}.save .btn{flex:1}.map-row b{min-width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function (root) {
'use strict';
/* ================= core: GitHub access, state, saving (no DOM here, so it can be tested) ================= */
const API = 'https://api.github.com';
const LS = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const S = { schema: null, token: '', repo: '', branch: 'main', site: {}, home: {}, raw: {}, orig: { site: {}, home: {} },
            pending: {}, tab: 'photos', lang: 'en', filter: '', run: null, busy: '', notice: null, dirty: 0,
            open: new Set(), req: { items: null, loaded: false, loading: false, error: '', code: '', keyProblem: '', filter: 'new', q: '' } };
const clone = o => JSON.parse(JSON.stringify(o));
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const getv = (obj, group, name) => ((obj && obj[group] && obj[group][name]) || '');
function setv(obj, group, name, value) { if (!obj[group]) obj[group] = {}; obj[group][name] = value; }

function ghError(status, message) { const e = new Error(message || ''); e.status = status; return e; }
function explain(e) {
  if (e.conflict) return 'Сайт уже изменили в другом месте (например, в Pages CMS). Чтобы ничего не затереть, ничего не сохранено. Обновите страницу и повторите правки.';
  if (e.status === 401) return 'GitHub не принял токен: он неверный или истёк. Войдите заново с новым токеном.';
  if (e.status === 403) return 'У токена не хватает прав. Нужны: Contents — Read and write, Actions — Read-only.';
  if (e.status === 404) return 'Репозиторий или файл не найден. Проверьте, что токен выдан именно на репозиторий сайта.';
  if (e.status === 409 || e.status === 422) return 'GitHub отклонил сохранение: сайт уже изменился. Обновите страницу и повторите правки.';
  return e.message || 'Что-то пошло не так.';
}

async function gh(path, opts) {
  const o = opts || {};
  const headers = { Authorization: 'Bearer ' + S.token, 'X-GitHub-Api-Version': '2022-11-28',
                    Accept: o.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json' };
  if (o.body) headers['Content-Type'] = 'application/json';
  let r;
  try {
    r = await fetch(API + path, { method: o.method || 'GET', headers, body: o.body ? JSON.stringify(o.body) : undefined, cache: 'no-store' });
  } catch (e) { throw ghError(0, 'Нет связи с GitHub. Проверьте интернет и попробуйте ещё раз.'); }
  if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch (e) {} throw ghError(r.status, m); }
  if (o.raw) return r.text();
  return r.status === 204 ? null : r.json();
}
const readFile = path => gh(`/repos/${S.repo}/contents/${enc(path)}?ref=${encodeURIComponent(S.branch)}`, { raw: true });

async function loadAll() {
  const langs = S.schema.langs;
  const paths = ['content/site.json', ...langs.map(l => `content/home_${l}.json`)];
  const texts = await Promise.all(paths.map(readFile));
  S.raw = {}; paths.forEach((p, i) => { S.raw[p] = texts[i]; });
  S.site = JSON.parse(texts[0]);
  S.home = {}; langs.forEach((l, i) => { S.home[l] = JSON.parse(texts[i + 1]); });
  S.orig = { site: clone(S.site), home: clone(S.home) };
}

const photoFields = () => S.schema.photos.map(p => p.field);
const textChanged = (lang, sec, f) => getv(S.home[lang], sec, f) !== getv(S.orig.home[lang], sec, f);
const contactChanged = name => String(S.site[name] ?? '') !== String(S.orig.site[name] ?? '');
const photoChanged = field => String(S.site[field] || '') !== String(S.orig.site[field] || '');
const readyChanged = () => !!S.site.publish_ready !== !!S.orig.site.publish_ready;

/** Everything that differs from what is saved on GitHub, grouped for the UI and the commit message. */
function changes() {
  const out = { text: {}, textCount: 0, contacts: [], photos: [], ready: readyChanged() };
  for (const lang of S.schema.langs) for (const sec of S.schema.sections) for (const f of sec.fields) {
    if (textChanged(lang, sec.name, f.name)) { out.text[lang] = (out.text[lang] || 0) + 1; out.textCount++; }
  }

/** Shrinks a photo in the browser (WebP, long side up to 2000 px, about 450 KB) so the site stays fast on phones. */
async function prepareImage(file) {
  let bitmap;
  try { bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { throw new Error('Не удалось открыть файл. Подойдут JPG, PNG или WebP.'); }

  const render = (longSide, type, quality) => {
    const k = Math.min(1, longSide / Math.max(source.width, source.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(source.width * k); canvas.height = Math.round(source.height * k);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    return new Promise(resolve => canvas.toBlob(resolve, type, quality));

  for (const side of [2000, 1600, 1280]) {
    for (const q of [.86, .78, .7, .6]) {
      let blob = await render(side, 'image/webp', q);
      ext = 'webp';
      if (!blob || blob.type !== 'image/webp') { blob = await render(side, 'image/jpeg', q); ext = 'jpg'; }
      best = blob;
      if (blob && blob.size <= 450 * 1024) return { blob, ext, source };

  if (!best) throw new Error('Не удалось подготовить фото. Попробуйте другой файл.');

}

      el('input', { type: 'search', placeholder: 'Найти по имени, контакту, тексту…', value: q.q, 'aria-label': 'Поиск по заявкам', oninput: e => { q.q = e.target.value; paintList(); } }));
    paintTabs();
  };
  const paintList = () => {
    const needle = q.q.trim().toLowerCase();
    const items = q.items.filter(r => (q.filter === 'all' || r.status === q.filter) && (!needle || [r.name, r.contact, r.message, r.note].join(' ').toLowerCase().includes(needle)));
    list.replaceChildren(...(items.length ? items.map(r => requestCard(r, paintCounts)) : [el('div', { class: 'box muted' },
      q.items.length ? 'В этой подборке заявок нет.' : 'Пока ни одной заявки. Когда кто-то отправит форму на сайте, сообщение появится здесь и придёт вам на почту.')]));
  };
  const paintCounts = () => { pills.querySelectorAll('button.pill').forEach((b, i) => { b.querySelector('b').textContent = String(counts()[i][2]); }); paintTabs(); };
  paintPills(); paintList();

  const add = () => {
    const name = el('input', { type: 'text', id: 'add-name', placeholder: 'Имя', maxlength: 120 });
    const contact = el('input', { type: 'text', id: 'add-contact', placeholder: 'Email, Telegram или телефон', maxlength: 160 });
    const message = el('textarea', { id: 'add-message', rows: 3, placeholder: 'О чём человек написал', maxlength: 4000 });
    const info = el('p', { class: 'muted', role: 'status' });
    return el('details', { class: 'more' }, el('summary', {}, 'Добавить заявку вручную (если написали в Telegram, WhatsApp или позвонили)'),
      el('div', { class: 'inner' }, el('div', { class: 'fld' }, name), el('div', { class: 'fld' }, contact), el('div', { class: 'fld' }, message),
        el('div', { class: 'row', style: 'margin-top:0' }, el('button', { class: 'btn small', onclick: async () => {
          if (!name.value.trim()) { info.textContent = 'Напишите хотя бы имя.'; return; }
          info.textContent = 'Добавляю…';
          try { await inboxCall('add', { name: name.value, contact: contact.value, message: message.value, status: 'work' }); q.loaded = false; q.filter = 'work'; fetchRequests(); }
          catch (e) { info.textContent = e.message; }
        } }, 'Добавить'), info)));
  };
  const csv = () => {
    const a = el('a', { href: URL.createObjectURL(new Blob([csvOf(q.items)], { type: 'text/csv;charset=utf-8' })), download: 'zayavki-' + new Date().toISOString().slice(0, 10) + '.csv' });
    document.body.append(a); a.click(); a.remove();
  };
  return el('div', {}, ...head,
    el('div', { class: 'row', style: 'margin:0 0 16px' }, el('button', { class: 'btn ghost small', onclick: () => { q.loaded = false; fetchRequests(); } }, 'Обновить'),
      el('button', { class: 'btn ghost small', disabled: !q.items.length, onclick: csv }, 'Скачать таблицей (CSV)')),
    pills, list, add());
}

/* ---------- settings ---------- */
function settingField(f) {
  const id = 'c-' + f.name, [label, hint] = FRIENDLY[f.name] || [f.label, f.description || ''];
  const input = el('input', { id, type: 'text', value: String(S.site[f.name] ?? ''), autocomplete: 'off' });
  const wrap = el('div', { class: 'fld' + (contactChanged(f.name) ? ' chg' : '') }, el('label', { for: id }, label), input, hint ? el('p', { class: 'hint' }, hint) : null);
  input.addEventListener('input', () => { S.site[f.name] = input.value; wrap.classList.toggle('chg', contactChanged(f.name)); paintBar(); });
  input.addEventListener('change', () => {          // tidy up the typical mistakes
    let v = input.value.trim();
    if (f.name === 'whatsapp') v = v.replace(/\D/g, '');
    if (f.name === 'telegram') v = v.replace(/^https?:\/\/t\.me\//i, '').replace(/^@/, '');
    input.value = v; S.site[f.name] = v; wrap.classList.toggle('chg', contactChanged(f.name)); paintBar();
  });
  return wrap;
}
function panelSettings() {
  const left = new Map(S.schema.contacts.map(f => [f.name, f]));
  const groups = SETTING_GROUPS.map(([title, names]) => {
    const fields = names.map(n => { const f = left.get(n); left.delete(n); return f; }).filter(Boolean);
    return fields.length ? el('div', { class: 'box group' }, el('h2', {}, title), el('div', { class: 'flds' }, fields.map(settingField))) : null;
  });
  if (left.size) groups.push(el('div', { class: 'box group' }, el('h2', {}, 'Прочее'), el('div', { class: 'flds' }, [...left.values()].map(settingField))));
  const box = el('input', { type: 'checkbox', id: 'ready', checked: !!S.site.publish_ready, onchange: e => { S.site.publish_ready = e.target.checked; paintBar(); } });
  return el('div', { class: 'pub' }, el('h1', {}, 'Настройки'),
    el('p', { class: 'lead' }, 'Название сайта, ваши контакты и публикация. Меняйте только то, что нужно: остальное уже настроено.'),
    ...groups,
    el('label', { class: 'chk', for: 'ready' }, box, el('span', {}, el('strong', {}, 'Показывать сайт поисковикам (Google и другие)'),
      el('br'), 'Включайте, только когда заполнены имя, контакты и форма, а на фото нет водяных знаков и есть права на публикацию. Пока галочки нет, сайт закрыт от поисковиков, но открывается по ссылке. После включения подписи с номерами на пустых местах для фото пропадут (по ссылке с «?photos» номера видны всегда).')),
    el('div', { class: 'box' }, el('h2', {}, 'Ссылки'),
      el('div', { class: 'row', style: 'margin-top:0' }, el('a', { class: 'btn small', href: '../', target: '_blank', rel: 'noopener' }, 'Открыть сайт ↗'),
        el('a', { class: 'btn ghost small', href: '../?photos', target: '_blank', rel: 'noopener' }, 'Сайт с номерами фото ↗'),
        S.run && S.run.url ? el('a', { class: 'btn ghost small', href: S.run.url, target: '_blank', rel: 'noopener' }, 'Журнал сборки ↗') : null,
        el('a', { class: 'btn ghost small', href: 'https://app.pagescms.org/', target: '_blank', rel: 'noopener' }, 'Статьи (Pages CMS) ↗')),
      el('p', { class: 'muted', style: 'margin-bottom:0' }, 'Статьи («Заметки») пока пишутся в Pages CMS. Раздел появится на сайте, когда будет опубликована хотя бы одна статья. Сайт хранится в ',
        el('a', { href: 'https://github.com/' + S.repo, target: '_blank', rel: 'noopener' }, S.repo), ', ветка ', el('code', {}, S.branch), '. Каждое сохранение — обычный коммит, его можно откатить в истории GitHub.')));
}

const TABS = [['photos', 'Фотографии', 'photos'], ['texts', 'Тексты', 'texts'], ['requests', 'Заявки', 'mail'], ['settings', 'Настройки', 'gear']];
function renderPanel() {
  panel.replaceChildren(S.tab === 'photos' ? panelPhotos() : S.tab === 'texts' ? panelTexts() : S.tab === 'requests' ? panelRequests() : panelSettings());
  paintTabs();
}

/* ---------- shell and login ---------- */
function logout(message) {
  LS.del('si-admin-token'); LS.del(INBOX_KEY); S.token = ''; S.dirty = 0;
  renderLogin(message || '');
}
function shell() {
  chip = el('span', { class: 'chip', hidden: true });
  noticeBox = el('div'); panel = el('main'); saveBar = el('footer', { class: 'save', hidden: true });
  tabsBar = el('nav', { class: 'tabs', role: 'tablist', 'aria-label': 'Разделы' }, TABS.map(([id, label, ic]) =>
    el('button', { role: 'tab', 'data-tab': id, onclick: () => { S.tab = id; try { history.replaceState(null, '', '#' + id); } catch (e) {} renderPanel(); scrollTo(0, 0); } }, icon(ic), label)));
  app.replaceChildren(
    el('header', { class: 'top' }, el('div', { class: 'top-in' }, el('div', { class: 'brand' }, S.schema.brand, el('small', {}, 'Панель управления')), chip, el('span', { class: 'grow' }),
      el('a', { class: 'lnk', href: '../', target: '_blank', rel: 'noopener' }, 'Открыть сайт ↗'),
      el('button', { class: 'lnk', onclick: () => { if (!S.dirty || confirm('Есть несохранённые правки. Выйти без сохранения?')) { S.dirty = 0; logout(); } } }, 'Выйти')),
      tabsBar),
    el('div', { style: 'width:min(1120px,100%);margin:0 auto;padding:18px clamp(14px,3vw,28px) 0' }, noticeBox), panel, saveBar);
}

async function enter() {
  app.replaceChildren(el('main', {}, el('p', { class: 'lead' }, 'Загружаю…')));
  try {
    const repo = await gh('/repos/' + S.repo);
    if (repo.permissions && !repo.permissions.push) throw ghError(403, '');
    await loadAll();
  } catch (e) {
    if (e.status === 401 || e.status === 403 || e.status === 404) return logout(explain(e));
    app.replaceChildren(el('main', {}, el('div', { class: 'note bad' }, explain(e)), el('button', { class: 'btn', onclick: enter }, 'Повторить')));
    return;
  }
  const wanted = TABS.find(t => '#' + t[0] === location.hash);
  if (wanted) S.tab = wanted[0];
  shell(); renderPanel(); paintBar();
  latestRun().then(paintChip);
  if (inboxUrl() && inboxKey()) fetchRequests();       // so the number of new requests shows on the tab
}

function renderLogin(message) {
  const brand = (S.schema && S.schema.brand) || 'Sport Intuitive';
  const token = el('input', { type: 'password', id: 'token', autocomplete: 'off', placeholder: 'github_pat_…' });
  const repo = el('input', { type: 'text', id: 'repo', value: S.repo, placeholder: 'ваш-логин/название-репозитория', autocomplete: 'off' });
  const go = () => {
    const t = token.value.trim(), r = (S.schema && S.schema.repo) || repo.value.trim();
    if (!t || !/^[\w.-]+\/[\w.-]+$/.test(r)) { renderLogin('Вставьте токен и укажите репозиторий в виде «логин/название».'); return; }
    S.token = t; S.repo = r; LS.set('si-admin-token', t); LS.set('si-admin-repo', r);
    enter();
  };
  app.replaceChildren(
    el('header', { class: 'top' }, el('div', { class: 'top-in', style: 'padding-bottom:12px' }, el('div', { class: 'brand' }, brand, el('small', {}, 'Панель управления')))),
    el('main', { class: 'login' }, el('h1', {}, 'Вход'),
      el('p', { class: 'lead' }, 'Панель работает через ваш GitHub: правки сохраняются в репозитории сайта, а сайт обновляется сам. Войти нужно один раз на каждом устройстве.'),
      message ? el('div', { class: 'note bad' }, message) : null,
      el('div', { class: 'box' }, el('h2', {}, 'Как получить ключ доступа (токен)'),
        el('ol', {},
          el('li', {}, 'Откройте ', el('a', { href: 'https://github.com/settings/personal-access-tokens/new', target: '_blank', rel: 'noopener' }, 'страницу создания токена на GitHub ↗'), ' и войдите в свой аккаунт.'),
          el('li', {}, 'Название: «Панель сайта». Срок действия: самый длинный. Запишите в календарь, когда он закончится.'),
          el('li', {}, 'В разделе ', el('code', {}, 'Repository access'), ' выберите ', el('code', {}, 'Only select repositories'), ' и отметьте репозиторий сайта.'),
          el('li', {}, 'В разделе ', el('code', {}, 'Repository permissions'), ' поставьте ', el('code', {}, 'Contents: Read and write'), ' и ', el('code', {}, 'Actions: Read-only'), '.'),
          el('li', {}, 'Нажмите ', el('code', {}, 'Generate token'), ', скопируйте ключ (он показывается один раз) и вставьте ниже.')),
        el('label', { for: 'token' }, el('strong', {}, 'Токен')), token,
        S.schema && S.schema.repo ? null : [el('label', { for: 'repo' }, el('strong', {}, 'Репозиторий')), repo],
        el('button', { class: 'btn', onclick: go }, 'Войти'),
        el('p', { class: 'muted', style: 'margin-bottom:0' }, 'Токен хранится только в этом браузере и даёт доступ лишь к одному репозиторию. Кнопка «Выйти» стирает его. Если что-то пошло не так, токен можно отозвать на GitHub в один клик.'))));
  token.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

async function boot() {
  try { S.schema = await (await fetch('schema.json', { cache: 'no-store' })).json(); }
  catch (e) { app.replaceChildren(el('main', {}, el('div', { class: 'note bad' }, 'Не удалось загрузить настройки панели (schema.json). Панель работает только на опубликованном сайте, а не при открытии файла с диска.'))); return; }
  S.repo = S.schema.repo || LS.get('si-admin-repo'); S.branch = S.schema.branch || 'main';
  S.token = LS.get('si-admin-token');
  if (S.token && S.repo) enter(); else renderLogin('');
}
window.addEventListener('beforeunload', e => { if (S.dirty || S.busy) { e.preventDefault(); e.returnValue = ''; } });
boot();
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
