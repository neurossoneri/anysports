<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f9fbfd">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2032%2032%27%3E%3Cdefs%3E%3ClinearGradient%20id=%27g%27%20x1=%270%27%20y1=%270%27%20x2=%271%27%20y2=%271%27%3E%3Cstop%20offset=%270%27%20stop-color=%27%234c8df6%27/%3E%3Cstop%20offset=%271%27%20stop-color=%27%238a5cf5%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width=%2732%27%20height=%2732%27%20rx=%279%27%20fill=%27url(%23g)%27/%3E%3Crect%20x=%278%27%20y=%2711%27%20width=%2716%27%20height=%273.4%27%20rx=%271.7%27%20fill=%27%23fff%27/%3E%3Crect%20x=%278%27%20y=%2718%27%20width=%2710%27%20height=%273.4%27%20rx=%271.7%27%20fill=%27%23fff%27/%3E%3C/svg%3E">
<title>Панель управления · Sport Intuitive</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
/* docs-look-v1: панель в духе интерфейса Google Docs / Drive 2026 (Material 3 Expressive).
   Холодный светлый фон, белые карточки с крупными скруглениями, один синий акцент, кнопки-«таблетки»,
   вкладки в «таблетке», как панель инструментов в Docs. Поверх страницы парит только полоса сохранения.
   Цвета: синий = действие, жёлтый = не сохранено, зелёный = новая заявка / готово, красный = ошибка. */
:root{--bg:#f9fbfd;--card:#fff;--soft:#f0f4f9;--bar:#edf2fa;--ink:#1f1f1f;--muted:#444746;--line:#dadce0;--outline:#747775;
  --blue:#0b57d0;--blue-h:#0a4cb8;--blue-c:#d3e3fd;--blue-t:#e8f0fe;--on-blue:#041e49;
  --green:#146c2e;--green-c:#c4eed0;--green-t:#e6f4ea;--on-green:#072711;
  --sun:#fbbc04;--sun-c:#ffe083;--on-sun:#3d2b00;--warn-t:#fef7e0;
  --bad:#b3261e;--bad-t:#fce8e6;--bad-c:#f9dedc;--on-bad:#410e0b;
  --hand:"Caveat","Segoe Script",cursive;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --ui:"Google Sans Text","Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --gut:clamp(14px,3vw,24px);--lift:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:132px}
body{margin:0;font:400 15px/1.55 var(--ui);color:var(--ink);background:var(--bg);padding-bottom:112px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--blue)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:.9em}

/* ---- верх: название, статус и вкладки-«таблетка» ---- */
.top{position:sticky;top:0;z-index:50;background:var(--bg);box-shadow:0 1px 0 #e8eaed}
.top-in{width:min(1040px,100%);margin:0 auto;padding:12px var(--gut) 6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.brand{display:flex;align-items:center;gap:12px;font:500 1.125rem/1.2 var(--ui);color:var(--ink)}
.brand::before{content:"";flex:none;width:36px;height:36px;background:url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2032%2032%27%3E%3Cdefs%3E%3ClinearGradient%20id=%27g%27%20x1=%270%27%20y1=%270%27%20x2=%271%27%20y2=%271%27%3E%3Cstop%20offset=%270%27%20stop-color=%27%234c8df6%27/%3E%3Cstop%20offset=%271%27%20stop-color=%27%238a5cf5%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width=%2732%27%20height=%2732%27%20rx=%279%27%20fill=%27url(%23g)%27/%3E%3Crect%20x=%278%27%20y=%2711%27%20width=%2716%27%20height=%273.4%27%20rx=%271.7%27%20fill=%27%23fff%27/%3E%3Crect%20x=%278%27%20y=%2718%27%20width=%2710%27%20height=%273.4%27%20rx=%271.7%27%20fill=%27%23fff%27/%3E%3C/svg%3E") center/contain no-repeat}
.brand small{font:400 .875rem var(--ui);color:var(--muted);margin-left:2px}
.grow{flex:1}
.top a.lnk,.top button.lnk{display:inline-flex;align-items:center;min-height:36px;padding:0 16px;border:0;border-radius:999px;background:none;color:var(--blue);font:500 .875rem var(--ui);cursor:pointer;text-decoration:none}
.top button.lnk{color:var(--muted)}
.top a.lnk:hover,.top button.lnk:hover{background:rgba(31,31,31,.08);text-decoration:none}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:28px;padding:0 12px;border-radius:999px;background:var(--bar);font-size:.8125rem;color:var(--muted)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:#9aa0a6}
.chip.ok::before{background:var(--green)}.chip.work::before{background:var(--sun);animation:pulse 1.1s infinite}.chip.bad::before{background:var(--bad)}
@keyframes pulse{50%{opacity:.25}}
.tabs{display:flex;gap:2px;width:max-content;max-width:calc(100% - 2 * var(--gut));margin:4px 0 12px max(var(--gut),calc((100% - 1040px) / 2 + var(--gut)));padding:4px;background:var(--bar);border-radius:999px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;flex:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 18px 0 14px;border:0;border-radius:999px;background:none;color:var(--muted);font:500 .9375rem var(--ui);cursor:pointer;transition:background-color .15s}
.tabs button::before{content:"";width:20px;height:20px;background:currentColor;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.tabs button:hover{background:rgba(31,31,31,.08);color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--blue-c);color:var(--on-blue)}
.tabs [data-tab=photos]{--ic:url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%3E%3Cpath%20fill=%27%23000%27%20d=%27M21%2019V5c0-1.1-.9-2-2-2H5c-1.1%200-2%20.9-2%202v14c0%201.1.9%202%202%202h14c1.1%200%202-.9%202-2zM8.5%2013.5l2.5%203.01L14.5%2012l4.5%206H5l3.5-4.5z%27/%3E%3C/svg%3E")}
.tabs [data-tab=texts]{--ic:url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%3E%3Cpath%20fill=%27%23000%27%20d=%27M14%202H6c-1.1%200-1.99.9-1.99%202L4%2020c0%201.1.89%202%201.99%202H18c1.1%200%202-.9%202-2V8l-6-6zm2%2016H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5%209H13z%27/%3E%3C/svg%3E")}
.tabs [data-tab=privacy]{--ic:url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%3E%3Cpath%20fill=%27%23000%27%20d=%27M12%201L3%205v6c0%205.55%203.84%2010.74%209%2012%205.16-1.26%209-6.45%209-12V5l-9-4z%27/%3E%3C/svg%3E")}
.tabs [data-tab=requests]{--ic:url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%3E%3Cpath%20fill=%27%23000%27%20d=%27M19%203H4.99c-1.11%200-1.98.89-1.98%202L3%2019c0%201.1.88%202%201.99%202H19c1.1%200%202-.9%202-2V5c0-1.11-.9-2-2-2zm0%2012h-4c0%201.66-1.35%203-3%203s-3-1.34-3-3H4.99V5H19v10z%27/%3E%3C/svg%3E")}
.tabs [data-tab=settings]{--ic:url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%3E%3Cpath%20fill=%27%23000%27%20d=%27M19.14%2012.94c.04-.3.06-.61.06-.94%200-.32-.02-.64-.07-.94l2.03-1.58a.49.49%200%2000.12-.61l-1.92-3.32a.488.488%200%2000-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484%200%2000-.48-.41h-3.84c-.24%200-.43.17-.47.41l-.36%202.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47%200-.59.22L2.74%208.87c-.12.21-.08.47.12.61l2.03%201.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03%201.58a.49.49%200%2000-.12.61l1.92%203.32c.12.22.37.29.59.22l2.39-.96c.5.38%201.03.7%201.62.94l.36%202.54c.05.24.24.41.48.41h3.84c.24%200%20.44-.17.47-.41l.36-2.54c.59-.24%201.13-.56%201.62-.94l2.39.96c.22.08.47%200%20.59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12%2015.6c-1.98%200-3.6-1.62-3.6-3.6s1.62-3.6%203.6-3.6%203.6%201.62%203.6%203.6-1.62%203.6-3.6%203.6z%27/%3E%3C/svg%3E")}
.tabs .n{min-width:20px;padding:0 6px;border-radius:10px;background:var(--sun-c);color:var(--on-sun);font-size:.75rem;font-weight:700;text-align:center;line-height:20px}
.tabs .n.green{background:var(--green);color:#fff}

/* ---- содержимое ---- */
main{width:min(1040px,100%);margin:0 auto;padding:clamp(12px,2.5vw,24px) var(--gut) 32px}
h1{font:400 clamp(1.625rem,3vw,2rem)/1.25 var(--ui);margin:4px 0 8px}
h2{font:500 1.125rem/1.35 var(--ui);margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 20px;max-width:68ch}
.muted{color:var(--muted);font-size:.875rem}
.notice-wrap{width:min(1040px,100%);margin:0 auto;padding:8px var(--gut) 0}
.note{padding:14px 20px;margin:0 0 16px;background:var(--blue-t);color:var(--on-blue);border-radius:16px}
.note.ok{background:var(--green-t);color:var(--on-green)}.note.warn{background:var(--warn-t);color:var(--on-sun)}.note.bad{background:var(--bad-t);color:var(--on-bad)}
.note ul{margin:6px 0 0;padding-left:20px}
.note a{color:inherit;text-decoration:underline}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 24px;margin-bottom:16px}
.box>h2:first-child{margin-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.subh{font:500 1rem/1.3 var(--ui);margin:24px 0 10px;color:var(--ink)}
h2.subh:first-of-type{margin-top:8px}

/* ---- кнопки: синяя «таблетка» (главное действие), остальные контурные ---- */
button.btn,a.btn,label.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 24px;border:1px solid var(--blue);border-radius:999px;background:var(--blue);color:#fff;font:500 .9375rem var(--ui);letter-spacing:.01em;text-align:center;text-decoration:none;cursor:pointer;transition:background-color .15s,box-shadow .15s}
button.btn:hover,a.btn:hover,label.btn:hover{background:var(--blue-h);border-color:var(--blue-h);box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);text-decoration:none}
button.btn.ghost,a.btn.ghost,label.btn.ghost{background:transparent;color:var(--blue);border-color:var(--outline)}
button.btn.ghost:hover,a.btn.ghost:hover,label.btn.ghost:hover{background:rgba(11,87,208,.08);border-color:var(--outline);box-shadow:none}
button.btn.danger{background:transparent;color:var(--bad);border-color:var(--outline)}
button.btn.danger:hover{background:var(--bad-t);border-color:var(--outline);box-shadow:none}
button.btn.small,label.btn.small,a.btn.small{min-height:32px;padding:0 16px;font-size:.8125rem}
button.btn.mini{min-width:36px;padding:0 10px;color:var(--muted)}
button:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}

/* ---- поля: контурные, при выборе синяя рамка; поиск — «таблетка», как в Docs и Drive ---- */
.fld input[type=text],.fld input[type=password],.fld textarea,.fld select,.login input[type=password],.login input[type=text],.rq textarea,.pos{width:100%;padding:11px 14px;border:1px solid var(--outline);border-radius:8px;background:#fff;color:var(--ink)}
.fld input[type=text]:hover,.fld input[type=date]:hover,.fld input[type=password]:hover,.fld textarea:hover,.fld select:hover,.rq textarea:hover,.login input:hover{border-color:var(--ink)}
.fld input:focus,.fld textarea:focus,.fld select:focus,.rq textarea:focus,.login input:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);outline:0}
.fld input[type=date]{width:auto;min-height:46px;padding:10px 14px!important;border:1px solid var(--outline)!important;border-radius:8px!important}
.fld textarea,.rq textarea{resize:vertical;line-height:1.6}
.rq textarea{min-height:44px}
select,.pos{appearance:none;-webkit-appearance:none;padding-right:38px;background:#fff url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%3E%3Cpath%20fill=%27%235f6368%27%20d=%27M16.59%208.59L12%2013.17%207.41%208.59%206%2010l6%206%206-6z%27/%3E%3C/svg%3E") no-repeat right 10px center/20px}
.pos{width:auto;padding:6px 36px 6px 12px;border-radius:999px;font-weight:500;font-size:.875rem}
input[type=search]{appearance:none;-webkit-appearance:none;border:1px solid transparent;border-radius:999px;background:var(--bar) url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%3E%3Cpath%20fill=%27%23444746%27%20d=%27M15.5%2014h-.79l-.28-.27A6.471%206.471%200%200016%209.5%206.5%206.5%200%20109.5%2016c1.61%200%203.09-.59%204.23-1.57l.27.28v.79l5%204.99L20.49%2019l-4.99-5zm-6%200C7.01%2014%205%2011.99%205%209.5S7.01%205%209.5%205%2014%207.01%2014%209.5%2011.99%2014%209.5%2014z%27/%3E%3C/svg%3E") no-repeat 16px center/20px;padding:0 20px 0 46px;min-height:44px;width:100%}
input[type=search]:hover{background-color:#e3eaf5}
input[type=search]:focus{background-color:#fff;border-color:transparent;box-shadow:var(--lift);outline:0}
.bar2{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.bar2 input[type=search]{flex:1;min-width:220px;width:auto}
.fld{position:relative}
.fld.chg::before{content:"";position:absolute;left:-14px;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--sun)}
.fld label{display:flex;align-items:center;gap:8px;font:500 .875rem/1.4 var(--ui);margin-bottom:6px}
.fld .req{color:var(--bad)}
.fld .undo{margin-left:auto;font-weight:500;font-size:.8125rem;background:none;border:0;color:var(--blue);cursor:pointer;padding:2px 10px;border-radius:999px}
.fld .undo:hover{background:rgba(11,87,208,.08)}
.fld .hint{font-size:.8125rem;color:var(--muted);margin:6px 0 0}
.flds{padding:2px 0 8px;display:grid;gap:18px}
.group{margin-bottom:16px}
.group .flds{padding:0;max-width:720px}
.chk{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:16px;cursor:pointer}
.chk:hover{background:var(--soft)}
.chk input{width:20px;height:20px;margin-top:2px;flex:none}

/* ---- метки и числа ---- */
.num{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:var(--blue-c);color:var(--on-blue);font:500 .8125rem/1 var(--ui)}
.tag{font-size:.75rem;font-weight:500;padding:2px 10px;border-radius:8px;background:var(--bar);color:var(--muted)}
.tag.new{background:var(--sun-c);color:var(--on-sun)}
.dot{background:var(--sun-c);color:var(--on-sun);font-size:.75rem;padding:0 10px;font-weight:700;border-radius:10px;line-height:20px}

/* ---- фотографии ---- */
.photo-list{display:grid;gap:10px;margin-top:14px}
.photo-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.photo-row.drop{border-color:var(--blue);background:var(--blue-t)}
.thumb{width:72px;height:90px;border-radius:12px;background:var(--soft);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.78rem}
.thumb img{width:100%;height:100%;object-fit:cover}
.photo-row h3{margin:0;font:500 1rem var(--ui);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.photo-row p{margin:2px 0 0;color:var(--muted);font-size:.875rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.box>.acts{justify-content:flex-start;margin-top:12px}
.lrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.ltile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px;align-content:start}
.lthumb{aspect-ratio:4/5;background:var(--soft);border-radius:12px;overflow:hidden}.lthumb img{width:100%;height:100%;object-fit:cover;display:block}
.lmeta{display:grid;gap:3px;font-size:.8125rem;color:var(--muted);word-break:break-all}.lmeta b{color:var(--ink);font-size:.875rem;font-weight:500}.lmeta .use{color:var(--green)}
.libdrop{outline:2px dashed var(--blue);outline-offset:4px;border-radius:16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
.pitem{border:2px solid var(--line);border-radius:12px;background:#fff;padding:0;cursor:pointer;overflow:hidden;text-align:left}
.pitem:hover{border-color:var(--outline)}
.pitem.on{border-color:var(--blue)}.pitem img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.pitem span{display:block;padding:4px 8px;font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptiles{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.ptile{width:170px}.plabel{font-size:.8125rem;font-weight:500;margin-bottom:6px}
.pframe{width:100%;background:var(--soft);border-radius:12px;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.8rem;position:relative}
.pframe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.ptile .acts{justify-content:flex-start;margin-top:8px}
.cframe{position:relative;margin:12px auto;overflow:hidden;border-radius:12px;background:var(--soft);cursor:grab;touch-action:none}
.cframe.grab{cursor:grabbing}
.cframe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;user-select:none;pointer-events:none}
.crow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:10px 0}
.crow input[type=range]{flex:1;min-width:140px;max-width:300px}

/* ---- сворачиваемые блоки ---- */
details.more,details.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 16px}
details.more>summary,details.sec>summary{cursor:pointer;padding:14px 20px;font-weight:500;list-style:none;display:flex;align-items:center;gap:10px;border-radius:16px}
details.more>summary:hover,details.sec>summary:hover{background:var(--soft)}
details.more>summary::-webkit-details-marker,details.sec>summary::-webkit-details-marker{display:none}

<body>
<div id="app"></div>
<script>
(function (root) {
'use strict';
/* ================= core: GitHub access, state, saving (no DOM here, so it can be tested) ================= */
const API = 'https://api.github.com';
const LS = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const S = { schema: null, token: '', repo: '', branch: 'main', site: {}, home: {}, page: { sections: [] }, uid: 0, raw: {}, qa: { groups: [] }, orig: { site: {}, home: {}, page: { sections: [] }, qa: { groups: [] } },
            pending: {}, tab: 'photos', lang: 'en', filter: '', run: null, busy: '', notice: null, dirty: 0,
            open: new Set(), req: newReq() };
const clone = o => JSON.parse(JSON.stringify(o));
S.lib = { items: null, loading: false, error: '' }; S.deleted = new Set();
S.notify = newNotify();
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const getv = (obj, group, name) => ((obj && obj[group] && obj[group][name]) || '');
function setv(obj, group, name, value) { if (!obj[group]) obj[group] = {}; obj[group][name] = value; }

function ghError(status, message) { const e = new Error(message || ''); e.status = status; return e; }
function explain(e) {
  if (e.conflict) return 'Сайт уже изменили в другом месте (например, в Pages CMS). Чтобы ничего не затереть, ничего не сохранено. Обновите страницу и повторите правки.';
  if (e.status === 401) return 'GitHub не принял токен: он неверный или истёк. Войдите заново с новым токеном.';
  if (e.status === 403) return 'У токена не хватает прав. Нужны: Contents — Read and write, Actions — Read-only.';
  if (e.status === 404) return 'Репозиторий или файл не найден. Проверьте, что токен выдан именно на репозиторий сайта.';
  if (e.status === 409 || e.status === 422) return 'GitHub отклонил сохранение: сайт уже изменился. Обновите страницу и повторите правки.';
  return e.message || 'Что-то пошло не так.';
}

async function gh(path, opts) {
  const o = opts || {};
  const headers = { Authorization: 'Bearer ' + S.token, 'X-GitHub-Api-Version': '2022-11-28',
                    Accept: o.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json' };
  if (o.body) headers['Content-Type'] = 'application/json';
  let r;
  try {
    r = await fetch(API + path, { method: o.method || 'GET', headers, body: o.body ? JSON.stringify(o.body) : undefined, cache: 'no-store' });
  } catch (e) { throw ghError(0, 'Нет связи с GitHub. Проверьте интернет и попробуйте ещё раз.'); }
  if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch (e) {} throw ghError(r.status, m); }
  if (o.raw) return r.text();
  return r.status === 204 ? null : r.json();
}
const readFile = path => gh(`/repos/${S.repo}/contents/${enc(path)}?ref=${encodeURIComponent(S.branch)}`, { raw: true });

async function loadAll() {
  const langs = S.schema.langs;
  const paths = ['content/site.json', ...langs.map(l => `content/home_${l}.json`), 'content/sections.json', 'content/qa.json', 'content/privacy.md'];
  const texts = await Promise.all(paths.map(p => (p === 'content/qa.json' ? readFile(p).catch(() => '{"groups":[]}') : p === 'content/privacy.md' ? readFile(p).catch(e => { if (e.status === 404) return ''; throw e; }) : readFile(p))));
  S.raw = {}; paths.forEach((p, i) => { S.raw[p] = texts[i]; });
  S.site = JSON.parse(texts[0]);
  S.home = {}; langs.forEach((l, i) => { S.home[l] = JSON.parse(texts[i + 1]); });
  S.page = JSON.parse(texts[langs.length + 1]);
  S.qa = normalizeQa(JSON.parse(texts[langs.length + 2]));
  S.privacy = parsePrivacy(texts[langs.length + 3]);
  if (!S.page || !Array.isArray(S.page.sections)) throw new Error('Файл content/sections.json повреждён: нет списка разделов.');
  S.orig = { site: clone(S.site), home: clone(S.home), page: clone(S.page), qa: clone(S.qa), privacy: clone(S.privacy) };
}

/* ----- Политика конфиденциальности (content/privacy.md: три поля в шапке файла и текст) ----- */
function parsePrivacy(text) {
  const out = { title: '', description: '', updated: '', body: '', extra: [] };
  const m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/.exec(String(text || ''));
  if (!m) { out.body = String(text || '').trim(); return out; }
  const unq = v => { v = v.trim(); if (v[0] === '"') { try { return JSON.parse(v); } catch (e) {} } if (v[0] === "'" && v.endsWith("'") && v.length > 1) return v.slice(1, -1).replace(/''/g, "'"); return v; };
  const lines = m[1].split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const kv = /^(title|description|updated):\s*(.*)$/.exec(lines[i]);
    if (!kv) { if (lines[i].trim()) out.extra.push(lines[i]); continue; }
    let value = kv[2];
    if (/^[>|][+-]?$/.test(value.trim())) {           // a long value that Pages CMS wrote on several lines
      const parts = [];
      while (i + 1 < lines.length && /^\s+\S/.test(lines[i + 1])) parts.push(lines[++i].trim());
      value = parts.join(' ');
    } else value = unq(value);
    out[kv[1]] = value;
  }
  out.body = m[2].replace(/^\s*\n/, '').replace(/\s+$/, '');
  return out;
}
function serializePrivacy(p) {
  const q = v => JSON.stringify(String(v || ''));
  const date = /^\d{4}-\d{2}-\d{2}$/.test(p.updated || '') ? p.updated : q(p.updated);
  return ['---', 'title: ' + q(p.title), 'description: ' + q(p.description), 'updated: ' + date, ...(p.extra || []), '---', '', String(p.body || '').trim(), ''].join('\n');
}
const privacyChanged = () => !!S.privacy && JSON.stringify(S.privacy) !== JSON.stringify(S.orig.privacy);
const todayIso = () => { const d = new Date(); return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()); };

const photoFields = () => S.schema.photos.map(p => p.field);
const textChanged = (lang, sec, f) => getv(S.home[lang], sec, f) !== getv(S.orig.home[lang], sec, f);
const contactChanged = name => String(S.site[name] ?? '') !== String(S.orig.site[name] ?? '');
const photoChanged = field => String(S.site[field] || '') !== String(S.orig.site[field] || '');
const readyChanged = () => !!S.site.publish_ready !== !!S.orig.site.publish_ready;

/** Everything that differs from what is saved on GitHub, grouped for the UI and the commit message. */
function changes() {
  const out = { text: {}, textCount: 0, pageCount: pageChangeCount(), contacts: [], photos: [], ready: readyChanged(), qa: qaChanged() ? 1 : 0, hero: heroChanged() ? 1 : 0, privacy: privacyChanged() ? 1 : 0, notify: notifyFlagChanged() ? 1 : 0, controls: controlsChanged() ? 1 : 0 };
  for (const lang of S.schema.langs) for (const sec of S.schema.groups) for (const f of sec.fields) {
    if (textChanged(lang, sec.name, f.name)) { out.text[lang] = (out.text[lang] || 0) + 1; out.textCount++; }
  }
  for (const f of S.schema.contacts) if (contactChanged(f.name)) out.contacts.push(f.name);
  for (const p of S.schema.photos) if (photoChanged(p.field)) out.photos.push(p.num);
  out.library = pendingKept().filter(([, p]) => p.lib && !p.saved).length + S.deleted.size;
  out.total = out.textCount + out.pageCount + out.contacts.length + out.photos.length + out.library + (out.ready ? 1 : 0) + out.qa + out.hero + out.privacy + out.notify + out.controls;
  return out;
}

/** Problems that would make the site build fail, or wording the site promises never to use. */
function validate() {
  const out = [];
  for (const lang of S.schema.langs) {
    const patterns = (S.schema.banned[lang] || []).map(p => new RegExp(p, 'i'));
    const promise = (where, v) => { for (const re of patterns) { const m = String(v || '').match(re); if (m) { out.push(`${where}: слово «${m[0]}» звучит как обещание результата. Такие формулировки на сайте запрещены, перефразируйте.`); return; } } };
    for (const sec of S.schema.groups) for (const f of sec.fields) {
      const v = getv(S.home[lang], sec.name, f.name);
      promise(`«${f.label}» (${lang.toUpperCase()})`, v);

  const form = String(S.site.form_endpoint || '').trim();

  return out;
}

/** One atomic commit with every changed file and photo. Nothing is written if the site changed meanwhile. */
async function commitChanges(step) {
  step = step || function () {};
  const c = changes();
  if (S.notify.loaded) for (const [k, v] of Object.entries(privacyFlags())) if (v !== flagNow(S.site, k)) S.site[k] = v;   // the privacy notice follows what the script really does
  const files = [];
  const add = (path, obj, orig) => { if (JSON.stringify(obj) !== JSON.stringify(orig)) files.push({ path, text: JSON.stringify(obj, null, 2) + '\n' }); };
  add('content/site.json', S.site, S.orig.site);
  S.schema.langs.forEach(l => add(`content/home_${l}.json`, S.home[l], S.orig.home[l]));
  add('content/sections.json', S.page, S.orig.page);
  add('content/qa.json', S.qa, S.orig.qa);
  if (privacyChanged()) {
    if (S.privacy.updated === S.orig.privacy.updated) S.privacy.updated = todayIso();   // the date of the notice follows the edit unless it was set by hand
    files.push({ path: 'content/privacy.md', text: serializePrivacy(S.privacy) });
  }
  const photos = usedPending(), removals = [...S.deleted];
  if (!files.length && !photos.length && !removals.length) return null;
  step('check');
  for (const f of files) {
    if (await readFile(f.path).catch(e => { if (e.status === 404 && S.raw[f.path] === '') return ''; throw e; }) !== S.raw[f.path]) { const e = ghError(409, 'conflict'); e.conflict = true; throw e; }
  }
  step('upload');
  const blobs = [];
  for (const p of photos) {
    const made = await gh(`/repos/${S.repo}/git/blobs`, { method: 'POST', body: { content: await toBase64(p.blob), encoding: 'base64' } });
    blobs.push({ path: p.path, sha: made.sha });
  }
  step('commit');
  const ref = await gh(`/repos/${S.repo}/git/ref/heads/${enc(S.branch)}`);
  const head = ref.object.sha;
  const parent = await gh(`/repos/${S.repo}/git/commits/${head}`);
  const tree = await gh(`/repos/${S.repo}/git/trees`, { method: 'POST', body: { base_tree: parent.tree.sha, tree: [
    ...files.map(f => ({ path: f.path, mode: '100644', type: 'blob', content: f.text })),
    ...blobs.map(b => ({ path: b.path, mode: '100644', type: 'blob', sha: b.sha })),
    ...removals.map(path => ({ path, mode: '100644', type: 'blob', sha: null })) ] } });
  const commit = await gh(`/repos/${S.repo}/git/commits`, { method: 'POST', body: { message: commitMessage(c), tree: tree.sha, parents: [head] } });
  await gh(`/repos/${S.repo}/git/refs/heads/${enc(S.branch)}`, { method: 'PATCH', body: { sha: commit.sha } });
  S.orig = { site: clone(S.site), home: clone(S.home), page: clone(S.page), qa: clone(S.qa), privacy: clone(S.privacy) };
  files.forEach(f => { S.raw[f.path] = f.text; });
  blobs.forEach(b => { if (S.pending[b.path]) S.pending[b.path].saved = true; });
  if (S.lib.items) S.lib.items = S.lib.items.filter(i => !removals.includes(i.path));
  S.deleted.clear();
  return { sha: commit.sha, files: files.map(f => f.path), photos: blobs.length };
}

const toRun = r => ({ state: r.status !== 'completed' ? 'building' : (r.conclusion === 'success' ? 'done' : 'failed'), url: r.html_url, at: r.updated_at || r.created_at });
async function latestRun() {

  } catch (e) { S.run = null; }
}
async function watchDeploy(sha, onChange, pause) {
  for (let i = 0; i < 72; i++) {
    try {
      const r = await gh(`/repos/${S.repo}/actions/runs?head_sha=${sha}&per_page=5`);
      const run = (r.workflow_runs || [])[0];
      S.run = run ? toRun(run) : { state: 'building' };
      if (onChange) onChange();
      if (run && run.status === 'completed') return S.run;
    } catch (e) { S.run = null; if (onChange) onChange(); return null; }
    await sleep(pause === undefined ? 5000 : pause);
  }
  return S.run;
}

/** Shrinks a photo in the browser (WebP, long side up to 2000 px, about 450 KB) so the site stays fast on phones. */
async function prepareImage(file) {
  let bitmap;
  try { bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { throw new Error('Не удалось открыть файл. Подойдут JPG, PNG или WebP.'); }
  const source = { width: bitmap.width, height: bitmap.height };
  const render = (longSide, type, quality) => {
    const k = Math.min(1, longSide / Math.max(source.width, source.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(source.width * k); canvas.height = Math.round(source.height * k);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    return new Promise(resolve => canvas.toBlob(resolve, type, quality));
  };
  let best = null, ext = 'webp';
  for (const side of [2000, 1600, 1280]) {
    for (const q of [.86, .78, .7, .6]) {
      let blob = await render(side, 'image/webp', q);
      ext = 'webp';
      if (!blob || blob.type !== 'image/webp') { blob = await render(side, 'image/jpeg', q); ext = 'jpg'; }
      best = blob;
      if (blob && blob.size <= 450 * 1024) return { blob, ext, source };
    }
  }
  if (!best) throw new Error('Не удалось подготовить фото. Попробуйте другой файл.');
  return { blob: best, ext, source };
}

function openHeroCrop(path) {
  const DEF = { x: 88, y: 42, z: 1 }, hero = S.schema.hero;
  const desktop = S.site.portrait_crop ? parseCrop(S.site.portrait_crop) : { ...DEF };
  const phone = S.site.portrait_crop_m ? parseCrop(S.site.portrait_crop_m) : { ...desktop };
  let mode = 'desktop', phoneOwn = !!S.site.portrait_crop_m, drag = null;
  openModal('Кадрирование главного фото', close => {
    const img = el('img', { src: thumbSrc(path), alt: '', draggable: false });
    const box = el('div', { class: 'cframe', tabindex: '0', role: 'img', 'aria-label': 'Кадр. Тяните мышью или стрелками на клавиатуре.' }, img);
    const zoom = el('input', { type: 'range', min: '1', max: '3', step: '0.02', value: '1', 'aria-label': 'Масштаб' });
    const label = el('span', { class: 'muted' }, '');
    const cur = () => (mode === 'desktop' ? desktop : phone);
    const frameKey = () => (mode === 'desktop' ? 'desktop' : (S.site.hero_phone === 'top' ? 'top' : 'side'));
    const touch = () => { if (mode === 'phone') phoneOwn = true; };
    const seg = [['Компьютер', 'desktop'], ['Телефон', 'phone']].map(([text, m]) => el('button', { type: 'button', 'aria-pressed': String(m === mode), onclick: () => { mode = m; apply(); } }, text));
    const layout = el('select', { id: 'hero-layout', 'aria-label': 'Фото на телефоне', onchange: e => { S.site.hero_phone = e.target.value === 'top' ? 'top' : ''; apply(); } },
      hero.phoneModes.map(([v, t]) => el('option', { value: v }, t)));
    layout.value = S.site.hero_phone === 'top' ? 'top' : 'side';
    const layoutRow = el('div', { class: 'crow' }, el('label', { for: 'hero-layout' }, 'Фото на телефоне:'), layout);
    function apply() {
      if (mode === 'phone' && !phoneOwn) Object.assign(phone, desktop);
      const st = cur(), k = frameKey();
      box.style.aspectRatio = hero.frames[k];
      box.style.width = k === 'side' ? '120px' : k === 'top' ? '240px' : 'min(100%, 400px)';
      img.style.cssText = cropStyle(fmtCrop(st));
      zoom.value = String(st.z); label.textContent = 'Масштаб ×' + (+st.z).toFixed(2);
      seg.forEach((button, n) => button.setAttribute('aria-pressed', String((n === 1) === (mode === 'phone'))));
      layoutRow.style.display = mode === 'desktop' ? 'none' : '';
    }
    const overflow = () => { const st = cur(), r = box.getBoundingClientRect(), iw = img.naturalWidth || 1, ih = img.naturalHeight || 1, k = Math.max(r.width / iw, r.height / ih) * st.z; return [iw * k - r.width, ih * k - r.height]; };
    box.addEventListener('pointerdown', e => { box.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, s: { ...cur() } }; box.classList.add('grab'); });
    box.addEventListener('pointermove', e => {
      if (!drag) return;
      const st = cur(), [ox, oy] = overflow(); touch();
      if (ox > 0.5) st.x = clampPct(drag.s.x - (e.clientX - drag.x) / ox * 100);
      if (oy > 0.5) st.y = clampPct(drag.s.y - (e.clientY - drag.y) / oy * 100);
      apply();
    });
    const stop = () => { drag = null; box.classList.remove('grab'); };
    box.addEventListener('pointerup', stop); box.addEventListener('pointercancel', stop);
    box.addEventListener('keydown', e => {
      const step = e.shiftKey ? 8 : 2, d = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] }[e.key];
      if (!d) return; e.preventDefault(); const st = cur(); touch(); st.x = clampPct(st.x + d[0]); st.y = clampPct(st.y + d[1]); apply();
    });
    zoom.addEventListener('input', () => { touch(); cur().z = Number(zoom.value); apply(); });
    img.addEventListener('load', apply);
    apply();
    const same = (a, b) => +a.x === +b.x && +a.y === +b.y && +a.z === +b.z;
    return el('div', {},
      el('p', { class: 'muted' }, 'Потяните фото внутри рамки, чтобы лицо осталось в кадре. Отдельно настройте компьютер и телефон. Если на телефоне лицо всё равно не помещается в узкую полосу, выберите «Сверху на всю ширину». Оригинал не меняется.'),

      el('div', { class: 'crow' }, el('button', { class: 'btn ghost small mini', type: 'button', 'aria-label': 'Уменьшить', onclick: () => { touch(); const st = cur(); st.z = Math.max(1, st.z - 0.1); apply(); } }, '−'), zoom,
        el('button', { class: 'btn ghost small mini', type: 'button', 'aria-label': 'Увеличить', onclick: () => { touch(); const st = cur(); st.z = Math.min(3, st.z + 0.1); apply(); } }, '+'), label),
      el('div', { class: 'crow' },
        el('button', { class: 'btn ghost small', type: 'button', onclick: () => { Object.assign(cur(), mode === 'desktop' ? DEF : desktop); if (mode === 'phone') phoneOwn = false; apply(); } }, 'Сбросить'),
        el('button', { class: 'btn ghost small', type: 'button', onclick: close }, 'Отмена'),
        el('button', { class: 'btn small', type: 'button', onclick: () => {
          S.site.portrait_crop = same(desktop, DEF) ? '' : fmtCrop(desktop);
          S.site.portrait_crop_m = phoneOwn && !same(phone, desktop) ? fmtCrop(phone) : '';

  });

        el('a', { class: 'btn ghost small', href: 'https://app.pagescms.org/', target: '_blank', rel: 'noopener' }, 'Статьи (Pages CMS) ↗')),
      el('p', { class: 'muted', style: 'margin-bottom:0' }, 'Статьи («Заметки») пока пишутся в Pages CMS. Раздел появится на сайте, когда будет опубликована хотя бы одна статья. Сайт хранится в ',
        el('a', { href: 'https://github.com/' + S.repo, target: '_blank', rel: 'noopener' }, S.repo), ', ветка ', el('code', {}, S.branch), '. Каждое сохранение — обычный коммит, его можно откатить в истории GitHub.')));
}

/* ---------- privacy notice ---------- */
function panelPrivacy() {
  const p = S.privacy;
  const undo = el('button', { class: 'btn ghost small', type: 'button', hidden: !privacyChanged(),
    onclick: () => { S.privacy = clone(S.orig.privacy); renderPanel(); paintBar(); } }, '↩ Вернуть политику как было');
  const touch = () => { undo.hidden = !privacyChanged(); };
  const title = makeField({ label: 'Заголовок страницы', value: p.title, type: 'string', required: true, onSet: v => { p.title = v; touch(); } });
  const desc = makeField({ label: 'Краткое описание (для поисковиков и превью ссылки)', value: p.description, type: 'text', onSet: v => { p.description = v; touch(); } });
  const date = el('input', { id: 'pp-date', type: 'date', value: /^\d{4}-\d{2}-\d{2}$/.test(p.updated || '') ? p.updated : '', style: 'padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff' });
  date.addEventListener('input', () => { p.updated = date.value; touch(); paintBar(); });
  const dateFld = el('div', { class: 'fld' }, el('label', { for: 'pp-date' }, 'Дата обновления'), date,
    el('p', { class: 'hint' }, 'Показывается вверху страницы. Если вы сами её не меняли, при сохранении правок она станет сегодняшней.'));
  const body = makeField({ label: 'Текст политики', value: p.body, type: 'text', required: true,
    hint: 'Абзацы разделяйте пустой строкой. Заголовки пишутся с «## » в начале строки, жирный текст между ** **, список начинается с «- ».', onSet: v => { p.body = v; touch(); } });
  const ta = body.querySelector('textarea'); ta.rows = 28; ta.style.fontFamily = 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'; ta.style.fontSize = '.9rem';
  return el('div', { class: 'pub' }, el('h1', {}, 'Политика конфиденциальности'),
    el('p', { class: 'lead' }, 'Текст страницы «Privacy notice»: он открывается окном по ссылке под формой и в подвале, и лежит отдельной страницей. Правьте здесь, затем нажмите «Сохранить и опубликовать» внизу.'),
    el('div', { class: 'row', style: 'margin:0 0 16px' }, el('a', { class: 'btn small', href: '../privacy/', target: '_blank', rel: 'noopener' }, 'Открыть опубликованную страницу ↗'), undo),
    el('div', { class: 'box group' }, el('h2', {}, 'Текст'), el('div', { class: 'flds' }, title, desc, dateFld, body)),
    el('div', { class: 'box' }, el('h2', {}, 'Метки, которые подставляются сами'),
      el('p', { class: 'hint', style: 'margin-top:0' }, 'Не удаляйте и не переписывайте эти метки: на их место сайт сам вставляет актуальные данные.'),
      el('ul', {}, el('li', {}, el('code', {}, '{{controller}}'), ': ваше имя, адрес и email из вкладки «Настройки».'),
        el('li', {}, el('code', {}, '{{form_service}}'), ': кто получает сообщения из формы (сервис форм, почта, ваша Google-таблица, Telegram). Меняется, когда вы подключаете «Заявки» или Telegram.'),
        el('li', {}, el('code', {}, '{{updated}}'), ': дата из поля выше.'))),
    el('p', { class: 'muted' }, 'Это шаблон, а не юридическая консультация. Если вы начнёте передавать данные ещё кому-то (новый сервис, рассылка, аналитика), добавьте этого получателя в раздел «Who receives your data».'));
}

const TABS = [['photos', 'Фотографии'], ['texts', 'Тексты'], ['privacy', 'Политика'], ['requests', 'Заявки'], ['settings', 'Настройки']];
function renderPanel() {
  panel.replaceChildren(S.tab === 'photos' ? panelPhotos() : S.tab === 'texts' ? panelTexts() : S.tab === 'requests' ? panelRequests() : S.tab === 'privacy' ? panelPrivacy() : panelSettings());
  paintTabs();
}

/* ---------- shell and login ---------- */
function logout(message) {
  LS.del('si-admin-token'); LS.del(INBOX_KEY); S.token = ''; S.dirty = 0; S.notify = newNotify();
  renderLogin(message || '');
}
function shell() {
  chip = el('span', { class: 'chip', hidden: true });
  noticeBox = el('div'); panel = el('main'); saveBar = el('footer', { class: 'save', hidden: true });
  tabsBar = el('nav', { class: 'tabs', role: 'tablist', 'aria-label': 'Разделы' }, TABS.map(([id, label]) =>
    el('button', { role: 'tab', 'data-tab': id, onclick: () => { S.tab = id; try { history.replaceState(null, '', '#' + id); } catch (e) {} renderPanel(); scrollTo(0, 0); } }, label)));
  app.replaceChildren(
    el('header', { class: 'top' }, el('div', { class: 'top-in' }, el('div', { class: 'brand' }, S.schema.brand, el('small', {}, 'Панель управления')), chip, el('span', { class: 'grow' }),
      el('a', { class: 'lnk', href: '../', target: '_blank', rel: 'noopener' }, 'Открыть сайт ↗'),
      el('button', { class: 'lnk', onclick: () => { if (!S.dirty || confirm('Есть несохранённые правки. Выйти без сохранения?')) { S.dirty = 0; logout(); } } }, 'Выйти')),
      tabsBar),
    el('div', { class: 'notice-wrap' }, noticeBox), panel, saveBar);
}

async function enter() {
  app.replaceChildren(el('main', {}, el('p', { class: 'lead' }, 'Загружаю…')));
  try {
    const repo = await gh('/repos/' + S.repo);
    if (repo.permissions && !repo.permissions.push) throw ghError(403, '');
    await loadAll();
        loadLibrary();
  } catch (e) {
    if (e.status === 401 || e.status === 403 || e.status === 404) return logout(explain(e));
    app.replaceChildren(el('main', {}, el('div', { class: 'note bad' }, explain(e)), el('button', { class: 'btn', onclick: enter }, 'Повторить')));
    return;
  }
  const wanted = TABS.find(t => '#' + t[0] === location.hash);
  if (wanted) S.tab = wanted[0];
  shell(); renderPanel(); paintBar();
  latestRun().then(paintChip);
  if (inboxUrl() && inboxKey()) fetchRequests();       // so the number of new requests shows on the tab
}

function renderLogin(message) {
  const brand = (S.schema && S.schema.brand) || 'Sport Intuitive';
  const token = el('input', { type: 'password', id: 'token', autocomplete: 'off', placeholder: 'github_pat_…' });
  const repo = el('input', { type: 'text', id: 'repo', value: S.repo, placeholder: 'ваш-логин/название-репозитория', autocomplete: 'off' });
  const go = () => {
    const t = token.value.trim(), r = (S.schema && S.schema.repo) || repo.value.trim();
    if (!t || !/^[\w.-]+\/[\w.-]+$/.test(r)) { renderLogin('Вставьте токен и укажите репозиторий в виде «логин/название».'); return; }
    S.token = t; S.repo = r; LS.set('si-admin-token', t); LS.set('si-admin-repo', r);
    enter();
  };
  app.replaceChildren(
    el('header', { class: 'top' }, el('div', { class: 'top-in', style: 'padding-bottom:12px' }, el('div', { class: 'brand' }, brand, el('small', {}, 'Панель управления')))),
    el('main', { class: 'login' }, el('h1', {}, 'Вход'),
      el('p', { class: 'lead' }, 'Панель работает через ваш GitHub: правки сохраняются в репозитории сайта, а сайт обновляется сам. Войти нужно один раз на каждом устройстве.'),
      message ? el('div', { class: 'note bad' }, message) : null,
      el('div', { class: 'box' }, el('h2', {}, 'Как получить ключ доступа (токен)'),
        el('ol', {},
          el('li', {}, 'Откройте ', el('a', { href: 'https://github.com/settings/personal-access-tokens/new', target: '_blank', rel: 'noopener' }, 'страницу создания токена на GitHub ↗'), ' и войдите в свой аккаунт.'),
          el('li', {}, 'Название: «Панель сайта». Срок действия: самый длинный. Запишите в календарь, когда он закончится.'),
          el('li', {}, 'В разделе ', el('code', {}, 'Repository access'), ' выберите ', el('code', {}, 'Only select repositories'), ' и отметьте репозиторий сайта.'),
          el('li', {}, 'В разделе ', el('code', {}, 'Repository permissions'), ' поставьте ', el('code', {}, 'Contents: Read and write'), ' и ', el('code', {}, 'Actions: Read-only'), '.'),
          el('li', {}, 'Нажмите ', el('code', {}, 'Generate token'), ', скопируйте ключ (он показывается один раз) и вставьте ниже.')),
        el('label', { for: 'token' }, el('strong', {}, 'Токен')), token,
        S.schema && S.schema.repo ? null : [el('label', { for: 'repo' }, el('strong', {}, 'Репозиторий')), repo],
        el('button', { class: 'btn', onclick: go }, 'Войти'),
        el('p', { class: 'muted', style: 'margin-bottom:0' }, 'Токен хранится только в этом браузере и даёт доступ лишь к одному репозиторию. Кнопка «Выйти» стирает его. Если что-то пошло не так, токен можно отозвать на GitHub в один клик.'))));
  token.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

async function boot() {
  try { S.schema = await (await fetch('schema.json', { cache: 'no-store' })).json(); }
  catch (e) { app.replaceChildren(el('main', {}, el('div', { class: 'note bad' }, 'Не удалось загрузить настройки панели (schema.json). Панель работает только на опубликованном сайте, а не при открытии файла с диска.'))); return; }
  S.repo = S.schema.repo || LS.get('si-admin-repo'); S.branch = S.schema.branch || 'main';
  S.token = LS.get('si-admin-token');
  if (S.token && S.repo) enter(); else renderLogin('');
}
window.addEventListener('beforeunload', e => { if (S.dirty || S.busy) { e.preventDefault(); e.returnValue = ''; } });
boot();
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
