<style>
:root{--abyss:#06121e;--frost:#edf3f7;--ice:#dae7f0;--ink:#0d2233;--muted:#5a7084;--blue:#2f6fb3;--hi:#8dbdf0;--green:#1f8a74;--mint:#6fd2b8;--warn:#a85a00;--bad:#b3261e;--line:#c3d3df;--sun:#ffd23f}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--frost);color:var(--ink);padding-bottom:100px}

[hidden]{display:none!important}
.top{background:var(--abyss);color:#e8f0f7;display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:12px clamp(14px,3vw,32px)}
.top b{font-size:1.12rem;letter-spacing:.01em}.top .sub{color:var(--hi);margin-left:10px;font-size:.9rem}

<body>
<div id="app"></div>
<script>
(function (root) {
'use strict';
/* ================= core: GitHub access, state, saving (no DOM here, so it can be tested) ================= */
const API = 'https://api.github.com';
const LS = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const S = { schema: null, token: '', repo: '', branch: 'main', site: {}, home: {}, raw: {}, orig: { site: {}, home: {} },
            pending: {}, tab: 'photos', lang: 'en', filter: '', run: null, busy: '', notice: null, dirty: 0 };
const clone = o => JSON.parse(JSON.stringify(o));
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const getv = (obj, group, name) => ((obj && obj[group] && obj[group][name]) || '');
function setv(obj, group, name, value) { if (!obj[group]) obj[group] = {}; obj[group][name] = value; }

function ghError(status, message) { const e = new Error(message || ''); e.status = status; return e; }
function explain(e) {
  if (e.conflict) return 'Сайт уже изменили в другом месте (например, в Pages CMS). Чтобы ничего не затереть, ничего не сохранено. Обновите страницу и повторите правки.';
  if (e.status === 401) return 'GitHub не принял токен: он неверный или истёк. Войдите заново с новым токеном.';
  if (e.status === 403) return 'У токена не хватает прав. Нужны: Contents — Read and write, Actions — Read-only.';
  if (e.status === 404) return 'Репозиторий или файл не найден. Проверьте, что токен выдан именно на репозиторий сайта.';
  if (e.status === 409 || e.status === 422) return 'GitHub отклонил сохранение: сайт уже изменился. Обновите страницу и повторите правки.';
  return e.message || 'Что-то пошло не так.';
}

async function gh(path, opts) {
  const o = opts || {};
  const headers = { Authorization: 'Bearer ' + S.token, 'X-GitHub-Api-Version': '2022-11-28',
                    Accept: o.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json' };
  if (o.body) headers['Content-Type'] = 'application/json';
  let r;
  try {
    r = await fetch(API + path, { method: o.method || 'GET', headers, body: o.body ? JSON.stringify(o.body) : undefined, cache: 'no-store' });
  } catch (e) { throw ghError(0, 'Нет связи с GitHub. Проверьте интернет и попробуйте ещё раз.'); }
  if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch (e) {} throw ghError(r.status, m); }
  if (o.raw) return r.text();
  return r.status === 204 ? null : r.json();
}
const readFile = path => gh(`/repos/${S.repo}/contents/${enc(path)}?ref=${encodeURIComponent(S.branch)}`, { raw: true });

async function loadAll() {
  const langs = S.schema.langs;
  const paths = ['content/site.json', ...langs.map(l => `content/home_${l}.json`)];
  const texts = await Promise.all(paths.map(readFile));
  S.raw = {}; paths.forEach((p, i) => { S.raw[p] = texts[i]; });
  S.site = JSON.parse(texts[0]);
  S.home = {}; langs.forEach((l, i) => { S.home[l] = JSON.parse(texts[i + 1]); });
  S.orig = { site: clone(S.site), home: clone(S.home) };
}

const photoFields = () => S.schema.photos.map(p => p.field);
const textChanged = (lang, sec, f) => getv(S.home[lang], sec, f) !== getv(S.orig.home[lang], sec, f);
const contactChanged = name => String(S.site[name] ?? '') !== String(S.orig.site[name] ?? '');
const photoChanged = field => String(S.site[field] || '') !== String(S.orig.site[field] || '');
const readyChanged = () => !!S.site.publish_ready !== !!S.orig.site.publish_ready;

/** Everything that differs from what is saved on GitHub, grouped for the UI and the commit message. */
function changes() {
  const out = { text: {}, textCount: 0, contacts: [], photos: [], ready: readyChanged() };
  for (const lang of S.schema.langs) for (const sec of S.schema.sections) for (const f of sec.fields) {
    if (textChanged(lang, sec.name, f.name)) { out.text[lang] = (out.text[lang] || 0) + 1; out.textCount++; }
  }
  for (const f of S.schema.contacts) if (contactChanged(f.name)) out.contacts.push(f.name);
  for (const p of S.schema.photos) if (photoChanged(p.field)) out.photos.push(p.num);
  out.total = out.textCount + out.contacts.length + out.photos.length + (out.ready ? 1 : 0);
  return out;
}

/** Problems that would make the site build fail, or wording the site promises never to use. */
function validate() {
  const out = [];
  for (const lang of S.schema.langs) {
    const patterns = (S.schema.banned[lang] || []).map(p => new RegExp(p, 'i'));
    for (const sec of S.schema.sections) for (const f of sec.fields) {
      const v = getv(S.home[lang], sec.name, f.name);
      for (const re of patterns) {
        const m = v.match(re);
        if (m) { out.push(`«${f.label}» (${lang.toUpperCase()}): слово «${m[0]}» звучит как обещание результата. Такие формулировки на сайте запрещены, перефразируйте.`); break; }
      }
      if (S.schema.required.includes(`${sec.name}.${f.name}`) && !v.trim()) out.push(`«${f.label}» (${lang.toUpperCase()}): поле обязательное, оно не может быть пустым.`);
    }
  }
  const form = String(S.site.form_endpoint || '').trim();
  if (form && !/^https:\/\/[^\s/]+/i.test(form)) out.push('«Адрес формы связи» должен начинаться с https://');
  const pub = String(S.site.public_url || '').trim();
  if (pub && !/^https:\/\/[^\s/?#]+[^\s?#]*$/i.test(pub)) out.push('«Адрес сайта» должен начинаться с https:// и не содержать знаков ? и #');
  return out;
}

const two = n => String(n).padStart(2, '0');
function photoPath(num, ext, when) {
  const d = when || new Date();
  return `media/photo-${num}-${d.getFullYear()}${two(d.getMonth() + 1)}${two(d.getDate())}-${two(d.getHours())}${two(d.getMinutes())}${two(d.getSeconds())}.${ext}`;
}
function usedPending() {
  const live = new Set(photoFields().map(f => S.site[f]).filter(Boolean));
  return Object.entries(S.pending).filter(([path, p]) => live.has(path) && !p.saved).map(([path, p]) => ({ path, blob: p.blob }));
}
async function toBase64(blob) {
  if (typeof FileReader === 'undefined') return Buffer.from(await blob.arrayBuffer()).toString('base64');
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(',')[1]);
    fr.onerror = () => reject(new Error('Не удалось прочитать фото.'));
    fr.readAsDataURL(blob);
  });
}
function commitMessage(c) {
  const parts = [];
  if (c.textCount) parts.push('тексты (' + Object.keys(c.text).map(l => l.toUpperCase()).join(', ') + ')');
  if (c.photos.length) parts.push('фото ' + c.photos.join(', '));
  if (c.contacts.length) parts.push('контакты и имя');
  if (c.ready) parts.push(S.site.publish_ready ? 'индексация включена' : 'индексация выключена');
  return 'Панель управления: ' + parts.join('; ');
}

/** One atomic commit with every changed file and photo. Nothing is written if the site changed meanwhile. */
async function commitChanges(step) {
  step = step || function () {};
  const c = changes();
  const files = [];
  const add = (path, obj, orig) => { if (JSON.stringify(obj) !== JSON.stringify(orig)) files.push({ path, text: JSON.stringify(obj, null, 2) + '\n' }); };
  add('content/site.json', S.site, S.orig.site);
  S.schema.langs.forEach(l => add(`content/home_${l}.json`, S.home[l], S.orig.home[l]));
  if (!files.length) return null;
  const photos = usedPending();
  step('check');
  for (const f of files) {
    if (await readFile(f.path) !== S.raw[f.path]) { const e = ghError(409, 'conflict'); e.conflict = true; throw e; }
  }
  step('upload');
  const blobs = [];
  for (const p of photos) {
    const made = await gh(`/repos/${S.repo}/git/blobs`, { method: 'POST', body: { content: await toBase64(p.blob), encoding: 'base64' } });
    blobs.push({ path: p.path, sha: made.sha });
  }
  step('commit');
  const ref = await gh(`/repos/${S.repo}/git/ref/heads/${enc(S.branch)}`);
  const head = ref.object.sha;
  const parent = await gh(`/repos/${S.repo}/git/commits/${head}`);
  const tree = await gh(`/repos/${S.repo}/git/trees`, { method: 'POST', body: { base_tree: parent.tree.sha, tree: [
    ...files.map(f => ({ path: f.path, mode: '100644', type: 'blob', content: f.text })),
    ...blobs.map(b => ({ path: b.path, mode: '100644', type: 'blob', sha: b.sha })) ] } });
  const commit = await gh(`/repos/${S.repo}/git/commits`, { method: 'POST', body: { message: commitMessage(c), tree: tree.sha, parents: [head] } });
  await gh(`/repos/${S.repo}/git/refs/heads/${enc(S.branch)}`, { method: 'PATCH', body: { sha: commit.sha } });
  S.orig = { site: clone(S.site), home: clone(S.home) };
  files.forEach(f => { S.raw[f.path] = f.text; });
  blobs.forEach(b => { if (S.pending[b.path]) S.pending[b.path].saved = true; });
  return { sha: commit.sha, files: files.map(f => f.path), photos: blobs.length };
}

const toRun = r => ({ state: r.status !== 'completed' ? 'building' : (r.conclusion === 'success' ? 'done' : 'failed'), url: r.html_url, at: r.updated_at || r.created_at });
async function latestRun() {
  try {
    const r = await gh(`/repos/${S.repo}/actions/runs?branch=${encodeURIComponent(S.branch)}&per_page=1`);
    S.run = r.workflow_runs && r.workflow_runs[0] ? toRun(r.workflow_runs[0]) : null;
  } catch (e) { S.run = null; }
}
async function watchDeploy(sha, onChange, pause) {
  for (let i = 0; i < 72; i++) {
    try {
      const r = await gh(`/repos/${S.repo}/actions/runs?head_sha=${sha}&per_page=5`);
      const run = (r.workflow_runs || [])[0];
      S.run = run ? toRun(run) : { state: 'building' };
      if (onChange) onChange();
      if (run && run.status === 'completed') return S.run;
    } catch (e) { S.run = null; if (onChange) onChange(); return null; }
    await sleep(pause === undefined ? 5000 : pause);
  }
  return S.run;
}

/** Shrinks a photo in the browser (WebP, long side up to 2000 px, about 450 KB) so the site stays fast on phones. */
async function prepareImage(file) {
  let bitmap;
  try { bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { throw new Error('Не удалось открыть файл. Подойдут JPG, PNG или WebP.'); }
  const source = { width: bitmap.width, height: bitmap.height };
  const render = (longSide, type, quality) => {
    const k = Math.min(1, longSide / Math.max(source.width, source.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(source.width * k); canvas.height = Math.round(source.height * k);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    return new Promise(resolve => canvas.toBlob(resolve, type, quality));
  };
  let best = null, ext = 'webp';
  for (const side of [2000, 1600, 1280]) {
    for (const q of [.86, .78, .7, .6]) {
      let blob = await render(side, 'image/webp', q);
      ext = 'webp';
      if (!blob || blob.type !== 'image/webp') { blob = await render(side, 'image/jpeg', q); ext = 'jpg'; }
      best = blob;
      if (blob && blob.size <= 450 * 1024) return { blob, ext, source };
    }
  }
  if (!best) throw new Error('Не удалось подготовить фото. Попробуйте другой файл.');
  return { blob: best, ext, source };
}

root.__dash = { S, gh, loadAll, changes, validate, commitChanges, photoPath, usedPending, watchDeploy, latestRun, setv, getv, explain, commitMessage };
if (typeof document === 'undefined') { if (typeof module !== 'undefined') module.exports = root.__dash; return; }

/* ================= interface ================= */
const el = (tag, props, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
};
const app = document.getElementById('app');
let panel, saveBar, noticeBox, chip, tabsBar;

function setNotice(kind, content) { S.notice = content ? { kind, content } : null; paintNotice(); }
function paintNotice() {
  if (!noticeBox) return;
  noticeBox.replaceChildren();
  if (!S.notice) return;
  const c = S.notice.content;
  noticeBox.append(el('div', { class: 'note ' + S.notice.kind, role: 'status' }, ...(Array.isArray(c) ? c : [c])));
}
function paintChip() {
  if (!chip) return;
  const r = S.run;
  chip.className = 'chip' + (r ? (r.state === 'done' ? ' ok' : r.state === 'building' ? ' work' : ' bad') : '');
  chip.replaceChildren();
  if (!r) { chip.hidden = true; return; }
  chip.hidden = false;
  const when = r.at ? new Date(r.at).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : '';
  chip.append(r.state === 'building' ? 'Сайт обновляется…' : r.state === 'done' ? 'Сайт опубликован · ' + when : 'Ошибка публикации');
  if (r.state === 'failed' && r.url) chip.append(' ', el('a', { href: r.url, target: '_blank', rel: 'noopener', style: 'color:#fff' }, 'подробности'));

async function takeFile(slot, file) {

  if (!/^image\//.test(file.type) && !/\.(jpe?g|png|webp|gif|avif|heic)$/i.test(file.name)) { setNotice('warn', 'Это не похоже на картинку. Подойдут JPG, PNG или WebP.'); return; }
  S.busy = `Готовлю фото ${slot.num}…`; paintBar();
  try {
    const { blob, ext, source } = await prepareImage(file);
    const path = photoPath(slot.num, ext);
    const old = S.site[slot.field];
    if (old && S.pending[old] && !S.pending[old].saved) { URL.revokeObjectURL(S.pending[old].url); delete S.pending[old]; }
    S.pending[path] = { blob, url: URL.createObjectURL(blob), kb: Math.round(blob.size / 1024), w: source.width, h: source.height };
    S.site[slot.field] = path;
    const small = Math.max(source.width, source.height) < 1100;
    setNotice('warn', small ? `Фото ${slot.num} небольшое (${source.width}×${source.height}). На большом экране оно может выглядеть мягким. По возможности загрузите оригинал.` : null);

        S.schema && S.schema.repo ? null : [el('label', { for: 'repo' }, el('strong', {}, 'Репозиторий')), repo],
        el('button', { class: 'btn', onclick: go }, 'Войти'),
        el('p', { style: 'color:#5a7084;font-size:.88rem;margin-bottom:0' }, 'Токен хранится только в этом браузере и даёт доступ лишь к одному репозиторию. Кнопка «Выйти» стирает его. Если что-то пошло не так, токен можно отозвать на GitHub в один клик.'))));
  token.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

async function boot() {
  try { S.schema = await (await fetch('schema.json', { cache: 'no-store' })).json(); }
  catch (e) { app.replaceChildren(el('main', {}, el('div', { class: 'note bad' }, 'Не удалось загрузить настройки панели (schema.json). Панель работает только на опубликованном сайте, а не при открытии файла с диска.'))); return; }
  S.repo = S.schema.repo || LS.get('si-admin-repo'); S.branch = S.schema.branch || 'main';
  S.token = LS.get('si-admin-token');
  if (S.token && S.repo) enter(); else renderLogin('');
}
window.addEventListener('beforeunload', e => { if (S.dirty || S.busy) { e.preventDefault(); e.returnValue = ''; } });
boot();
})(typeof window !== 'undefined' ? window : globalThis);
</script>
